 {"id": "un03", "src": "guide", "topic": "inspect", "ref": "نظام العمل، المادة ٣٠", "t": "أي هذه الأنشطة يحتاج ترخيصاً من الوزارة وفق المادة ٣٠؟", "o": ["التوظيف والاستقدام والخدمات العمالية", "نشر إعلان وظيفة شاغرة في المنشأة نفسها", "توظيف صاحب العمل لعماله مباشرة", "تدريب العمال داخل المنشأة"], "w": "المادة ٣٠: لا يجوز لأي شخص طبيعي أو اعتباري ممارسة نشاط توظيف السعوديين أو استقدام العمال أو تقديم الخدمات العمالية إلا بترخيص من الوزارة.", "subs": ["guide_unlicensed", "law_employ"]},
 {"id": "dm01", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ي)؛ لائحة العمالة المنزلية ومن في حكمهم، المادة ١٠", "t": "ما الحد الأقصى للتشغيل الفعلي للعامل المنزلي في اليوم؟", "o": ["١٠ ساعات", "٨ ساعات", "١٢ ساعة", "لا حد له في العمل المنزلي"], "w": "المادة ١٠: لا يُشغّل العامل المنزلي فعلياً أكثر من ١٠ ساعات يومياً، ولا أكثر من ٥ ساعات متتالية دون راحة نصف ساعة، ولا تقل الراحة اليومية المتواصلة عن ٨ ساعات.", "subs": ["guide_domestic"]},
 {"id": "dm02", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ي)؛ لائحة العمالة المنزلية ومن في حكمهم، المادة ١٠", "t": "ما أقل فترة راحة يومية متواصلة يجب أن يحصل عليها العامل المنزلي؟", "o": ["٨ ساعات", "٦ ساعات", "١٠ ساعات", "٤ ساعات"], "w": "المادة ١٠: لا تقل فترات الراحة اليومية المتواصلة للعامل المنزلي عن ٨ ساعات، ولا تدخل فترات الراحة والعبادة والطعام في حساب ساعات العمل.", "subs": ["guide_domestic"]},
 {"id": "dm03", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ي)؛ لائحة العمالة المنزلية ومن في حكمهم، المادة ٢٠", "t": "كسرت عاملة منزلية جهازاً بالخطأ، وأراد صاحب العمل خصم قيمته. ما الحد الأعلى للحسم الشهري؟", "o": ["ربع الأجر", "نصف الأجر", "الأجر كاملاً حتى يُسدد", "١٠٪ من الأجر"], "w": "المادة ٢٠: لا يجوز الحسم من أجر العامل المنزلي إلا في حالات محددة (ما أتلفه عمداً أو إهمالاً، أو سلفة، أو حكم قضائي) وبما لا يتجاوز ربع الأجر.", "subs": ["guide_domestic"]},
 {"id": "dm04", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ي)؛ لائحة العمالة المنزلية ومن في حكمهم، المادة ١٣", "t": "عامل منزلي حصل على إجازة مرضية ٢٠ يوماً بتقرير طبي. كيف يُحسب أجره؟", "o": ["١٥ يوماً كاملة ثم ٥ بالنصف", "٢٠ يوماً بأجر كامل", "٢٠ يوماً بنصف الأجر", "١٠ أيام بأجر كامل ثم ١٠ دون أجر"], "w": "المادة ١٣: يستحق العامل المنزلي إجازة مرضية لا تزيد على ٣٠ يوماً: الخمسة عشر الأولى بأجر كامل، والخمسة عشر التالية بنصف الأجر.", "subs": ["guide_domestic"]},
 {"id": "dm08", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ي)؛ لائحة العمالة المنزلية ومن في حكمهم، المادة ٢٧", "t": "في أي حالة يحق للعامل المنزلي إنهاء العقد مع احتفاظه بحقوقه؟", "o": ["إذا كُلّف بأعمال خطرة", "إذا وجد صاحب عمل بأجر أعلى", "إذا أراد العودة لبلده قبل انتهاء العقد", "إذا طُلب منه العمل في يوم عطلة مرة واحدة"], "w": "المادة ٢٧: من حالات إنهاء العامل المنزلي للعقد مع احتفاظه بحقوقه: إخلال صاحب العمل بالتزاماته الجوهرية، والغش وقت التعاقد، والاعتداء، والتكليف بأعمال خطرة، وتأجير خدماته للغير.", "subs": ["guide_domestic"]},
 {"id": "dm09", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ي)؛ لائحة العمالة المنزلية ومن في حكمهم، المادة ٢٦", "t": "اكتشف صاحب عمل منزلي أن العامل تعمّد إتلاف ممتلكاته. ما الشرط لإنهاء العقد دون مكافأة أو تعويض؟", "o": ["إبلاغ الجهات خلال ٢٤ ساعة", "أن ينتظر حتى نهاية الشهر", "أن يحصل على موافقة السفارة", "لا شرط؛ يكفي أن يخبر العامل"], "w": "المادة ٢٦ (الفقرة ٢): لصاحب العمل المنزلي إنهاء العقد دون مكافأة أو تعويض إذا تعمّد العامل فعلاً أو تقصيراً لإلحاق خسارة مادية به، بشرط إبلاغ الجهات المختصة خلال ٢٤ ساعة من علمه.", "subs": ["guide_domestic"]},
 {"id": "ag01", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ك)؛ لائحة عمال الزراعة والرعاة الخاصون ومن في حكمهم، المادة ٧", "t": "عقد عمل راعٍ لم تُذكر فيه مدته. كيف يُعامل؟", "o": ["يُعد لمدة سنة", "يُعد غير محدد المدة", "يُعد باطلاً ويُعاد تحريره", "يُعد لمدة سنتين قابلة للتجديد"], "w": "المادة ٧: يجب أن يكون عقد العمل محدد المدة، وإذا خلا من بيان مدته يُعد مبرماً لمدة سنة. ويُحرر من ثلاث نسخ: لكل طرف نسخة، والثالثة تودع لدى مكتب الاستقدام.", "subs": ["guide_agri"]},
 {"id": "ag02", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ك)؛ لائحة عمال الزراعة والرعاة الخاصون ومن في حكمهم، المادة ١٠", "t": "ما الحد الأقصى للتشغيل الفعلي لعامل الزراعة في اليوم؟", "o": ["٨ ساعات", "١٠ ساعات", "١٢ ساعة", "٦ ساعات"], "w": "المادة ١٠: لا يُشغّل العامل فعلياً أكثر من ٨ ساعات يومياً، ولا أكثر من ٥ ساعات متتالية دون راحة نصف ساعة، والعمل الإضافي بأجر الساعة مضافاً إليه ٥٠٪ من الأساسي.", "subs": ["guide_agri"]},
 {"id": "ag04", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ك)؛ لائحة عمال الزراعة والرعاة الخاصون ومن في حكمهم، المادة ١٠", "t": "عمل عامل زراعي يوم عيد الأضحى. كيف تُعامل ساعات عمله ذلك اليوم؟", "o": ["ساعات عمل إضافية بأجر إضافي", "ساعات عادية دون أجر إضافي", "يُعطى يوماً بدلاً منها دون أجر إضافي", "لا يجوز تشغيله مطلقاً ولو برضاه"], "w": "المادة ١٠ (الفقرة ٤): تُعد جميع ساعات العمل التي تؤدى في أيام العطل والأعياد ساعات عمل إضافية، يُدفع عنها أجر الساعة مضافاً إليه ٥٠٪ من الأجر الأساسي.", "subs": ["guide_agri"]},
 {"id": "ag06", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ك)؛ لائحة عمال الزراعة والرعاة الخاصون ومن في حكمهم، المادة ١٣", "t": "تجاوز مرض عامل زراعي ٣٠ يوماً. ماذا يحق لصاحب العمل؟", "o": ["إنهاؤه مع التذكرة والمستحقات", "إنهاء العقد دون أي مستحقات", "خصم أيام المرض من أجر الشهور القادمة", "نقل العامل لصاحب عمل آخر دون موافقته"], "w": "المادة ١٣: الإجازة المرضية حتى ٣٠ يوماً (١٥ بأجر كامل و١٥ بنصفه). ولصاحب العمل إنهاء العقد إذا تجاوز المرض ٣٠ يوماً مع تحمل تذكرة العودة وتصفية المستحقات، ولا يجوز الإنهاء قبل استنفاد الإجازة إلا بطلب العامل كتابة.", "subs": ["guide_agri"]},
 {"id": "lw01", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ١٠", "t": "عقد عمل لم يحدد طريقة حساب المدد. بأي تقويم تُحسب المدد المنصوص عليها في النظام؟", "o": ["بالتقويم الهجري", "بالتقويم الميلادي", "بأيهما أنفع للعامل", "بتقويم أم القرى الميلادي"], "w": "المادة ١٠: تُحسب المواعيد والمدد المنصوص عليها في النظام ولوائحه بالتقويم الهجري، ما لم ينص في عقد العمل أو اللوائح على خلاف ذلك.", "subs": ["law_general"]},
 {"id": "lw02", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٢", "t": "بحسب تعريفات النظام، من هو \"الحدث\"؟", "o": ["من أتم ١٥ ولم يبلغ ١٨", "من لم يبلغ ١٥ سنة بعد", "من أتم ١٨ ولم يبلغ ٢١ سنة", "كل من لم يبلغ ٢١ سنة هجرية"], "w": "المادة ٢: الحدث هو الشخص الذي أتم الخامسة عشرة من عمره ولم يبلغ الثامنة عشرة.", "subs": ["law_general"]},
 {"id": "lw05", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ١٦", "t": "تغيّر مدير المنشأة المسؤول. خلال كم يوماً على الأكثر يجب إبلاغ مكتب العمل؟", "o": ["٧ أيام", "٣٠ يوماً", "١٥ يوماً", "٦٠ يوماً"], "w": "المادة ١٦: يُبلَّغ مكتب العمل بتغيير الشريك أو المدير المسؤول خلال ٧ أيام على الأكثر من تسلّم الجديد عمله، ويبقى صاحب العمل مسؤولاً بصفة أصلية.", "subs": ["law_general"]},
 {"id": "lw06", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ١٨", "t": "بيعت منشأة لمالك جديد. ما أثر ذلك على عقود عمالها؟", "o": ["تبقى سارية وتُعد الخدمة متصلة", "تنتهي ويُصرف للعمال مكافأتهم", "تُعلّق حتى يجددها المالك الجديد", "تنتقل فقط للعمال السعوديين"], "w": "المادة ١٨: يبقى عقد العمل سارياً عند انتقال ملكية المنشأة أو تغيير شكلها القانوني، وتُعد الخدمة متصلة، ويكون المالك السابق والجديد مسؤولين بالتضامن عن حقوق العمال السابقة.", "subs": ["law_general"]},
 {"id": "lw07", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ١٩", "t": "أفلست منشأة. ماذا يُصرف للعامل أولاً قبل سداد أي مصروفات أخرى؟", "o": ["دفعة معجلة تعادل أجر شهر", "مكافأة نهاية الخدمة كاملة", "أجر ثلاثة أشهر", "لا شيء قبل تصفية الديون"], "w": "المادة ١٩: تُعد مستحقات العامل ديوناً ممتازة من الدرجة الأولى، ويُدفع للعامل عند الإفلاس أو التصفية دفعة معجلة تعادل أجر شهر واحد قبل أي مصروف آخر.", "subs": ["law_general"]},
 {"id": "lw08", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ١١", "t": "أسندت شركة جزءاً من عملها الأصلي إلى مقاول. ما حق عمال المقاول؟", "o": ["نفس حقوق ومزايا عمال الشركة الأصلية", "الحد الأدنى من الأجور فقط", "ما يتفق عليه المقاول معهم ولو كان أقل", "حقوق عمال المقاول لا علاقة لها بالشركة"], "w": "المادة ١١: إذا أسند صاحب العمل إلى شخص آخر أحد أعماله الأصلية، فعلى هذا الأخير أن يمنح عماله جميع الحقوق والمزايا التي يمنحها صاحب العمل الأصلي لعماله.", "subs": ["law_general", "law_contract"]},
 {"id": "lw09", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٢٦", "t": "ما الحد الأدنى لنسبة العمال السعوديين في المنشآت بحسب المادة ٢٦، ما لم يخفضها الوزير؟", "o": ["٧٥٪", "٥٠٪", "٣٠٪", "١٠٠٪"], "w": "المادة ٢٦: على جميع المنشآت أياً كان عدد عمالها استقطاب السعوديين وتوظيفهم، وألا تقل نسبتهم عن ٧٥٪ من مجموع العمال، وللوزير خفض النسبة مؤقتاً عند عدم توافر الكفاءات.", "subs": ["law_employ", "saud_general"]},
 {"id": "lw10", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٢٩", "t": "أصيب عامل إصابة عمل أنقصت قدرته على أداء عمله السابق. ما الذي يلتزم به صاحب العمل؟", "o": ["نقله لعمل مناسب بأجره", "إنهاء عقده مع صرف المكافأة", "إبقاؤه في عمله السابق كما هو", "منحه إجازة دون أجر حتى يتحسن"], "w": "المادة ٢٩: إذا أصيب العامل إصابة عمل نتج عنها نقص في قدراته لا يمنعه من أداء عمل آخر، يلتزم صاحب العمل بتوظيفه في عمل مناسب بالأجر المحدد لهذا العمل، دون إخلال بتعويض الإصابة.", "subs": ["law_employ"]},
 {"id": "lw11", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٣١", "t": "عامل استقدمته شركة استقدام لصالح منشأة. مع من تكون علاقته التعاقدية؟", "o": ["مع المنشأة مباشرة", "مع شركة الاستقدام فقط", "مع مكتب الإرسال في بلده", "لا علاقة تعاقدية حتى يمر ٩٠ يوماً"], "w": "المادة ٣١: يُعد العمال السعوديون الذين أسهمت المكاتب في توظيفهم، والعمال الذين استُقدموا لصالح صاحب العمل، عمالاً لديه، ويرتبطون معه بعلاقة تعاقدية مباشرة.", "subs": ["law_employ"]},
 {"id": "lw12", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٤٨", "t": "أنهى عامل برنامج تدريب دفعت تكاليفه المنشأة مدة ٦ أشهر. ماذا يجوز للمنشأة أن تشترط عليه؟", "o": ["العمل لديها مدة مماثلة لمدة التدريب", "العمل لديها خمس سنوات على الأقل", "دفع ضعف تكاليف التدريب إن استقال", "عدم العمل لدى أي منشأة منافسة مدى الحياة"], "w": "المادة ٤٨: لصاحب العمل إلزام المتدرب بالعمل لديه بعد انتهاء التدريب مدة مماثلة لمدته، فإن رفض أو لم يكملها لزمه رد تكاليف التدريب أو ما يتناسب مع المدة الباقية.", "subs": ["law_training"]},
 {"id": "lw13", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٤٨", "t": "أراد أحد طرفي عقد التدريب إنهاءه. ما مدة الإشعار المطلوبة على الأقل؟", "o": ["أسبوع", "شهر", "يومان", "٦٠ يوماً"], "w": "المادة ٤٨: يجوز لأي من الطرفين إنهاء عقد التأهيل أو التدريب بشرط إبلاغ الطرف الآخر قبل أسبوع على الأقل من تاريخ التوقف، ولصاحب العمل إنهاؤه إذا ثبت عدم قدرة المتدرب على إكماله بصورة مفيدة.", "subs": ["law_training"]},
 {"id": "lw14", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٤٦", "t": "كيف لا يجوز تحديد مكافأة المتدرب في عقد التدريب؟", "o": ["بالقطعة أو على أساس الإنتاج", "بمبلغ شهري ثابت", "بمبلغ لكل مرحلة من مراحل التدريب", "بمبلغ يتدرج مع المراحل"], "w": "المادة ٤٦: يُكتب عقد التدريب ويحدد المهنة ومدة التدريب ومراحله والمكافأة في كل مرحلة، ولا يجوز في أي حال أن تُحدد المكافأة على أساس القطعة أو الإنتاج.", "subs": ["law_training"]},
 {"id": "lw16", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٥٨", "t": "أراد صاحب العمل نقل عامل إلى فرع في مدينة أخرى يتطلب تغيير سكنه. ما الشرط؟", "o": ["موافقة العامل كتابة", "إشعاره قبل ٣٠ يوماً فقط", "زيادة أجره ١٠٪ على الأقل", "لا شرط؛ النقل من حق صاحب العمل"], "w": "المادة ٥٨: لا يجوز نقل العامل بغير موافقته كتابة من مكان عمله الأصلي إلى مكان آخر يقتضي تغيير محل إقامته. وفي الضرورة يجوز تكليفه مؤقتاً بمكان آخر لمدة لا تتجاوز ٣٠ يوماً في السنة على نفقة صاحب العمل.", "subs": ["law_contract"]},
 {"id": "lw17", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٥٥", "t": "عقد محدد المدة جُدّد ثلاث مرات متتالية. ماذا يصبح؟", "o": ["عقداً غير محدد المدة", "عقداً محدداً جديداً لسنة", "عقداً منتهياً تلقائياً", "عقد تجربة جديداً"], "w": "المادة ٥٥: إذا تجدد العقد محدد المدة ثلاث مرات متتالية، أو بلغت مدة العقد الأصلي مع التجديد أربع سنوات أيهما أقل، واستمر الطرفان في تنفيذه، تحوّل العقد إلى عقد غير محدد المدة.", "subs": ["law_contract"]},
 {"id": "lw18", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٥٣", "t": "ما الحد الأقصى لمجموع فترة التجربة في جميع الأحوال؟", "o": ["١٨٠ يوماً", "٩٠ يوماً", "سنة كاملة", "٦٠ يوماً"], "w": "المادة ٥٣: تُنص التجربة صراحة في العقد وتحدد مدتها، ولا يزيد مجموع مدتها في جميع الأحوال على ١٨٠ يوماً، وإنهاء العقد خلالها لا يستحق عنه أي طرف تعويضاً ولا مكافأة.", "subs": ["law_contract"]},
 {"id": "lw19", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٧٠", "t": "ما الحد الأعلى للغرامة التأديبية على العامل عن المخالفة الواحدة؟", "o": ["أجر ٥ أيام", "أجر يوم واحد", "أجر ١٠ أيام", "نصف الأجر الشهري"], "w": "المادة ٧٠: لا تزيد الغرامة عن المخالفة الواحدة على أجر ٥ أيام، ولا يُقتطع من أجره للغرامات أكثر من أجر ٥ أيام في الشهر، ولا يزيد الإيقاف دون أجر على ٥ أيام في الشهر.", "subs": ["law_discipline"]},
 {"id": "lw20", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٦٩", "t": "اكتشف مدير مخالفة عامل قبل ٤٠ يوماً، ويريد الآن التحقيق معه. ما الحكم؟", "o": ["لا يجوز؛ مضى أكثر من ٣٠ يوماً", "يجوز؛ لا مدة لاتهام العامل بالمخالفة", "يجوز إذا وافق مدير الموارد البشرية", "لا يجوز إلا إذا كانت المخالفة مالية"], "w": "المادة ٦٩: لا يجوز اتهام العامل بمخالفة مضى على كشفها أكثر من ٣٠ يوماً، ولا توقيع جزاء بعد انتهاء التحقيق بأكثر من ٣٠ يوماً.", "subs": ["law_discipline"]},
 {"id": "lw23", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٦٨", "t": "عامل خالف ثانية بعد ٢٠٠ يوم من مخالفته الأولى المماثلة. هل يجوز تشديد الجزاء بسبب التكرار؟", "o": ["لا؛ مضى أكثر من ١٨٠ يوماً", "نعم؛ التكرار يبرر التشديد دائماً", "نعم؛ إذا كانت المخالفتان متماثلتين", "لا؛ لا يجوز التشديد للتكرار أصلاً"], "w": "المادة ٦٨: لا يجوز تشديد الجزاء في حالة تكرار المخالفة إذا كان قد انقضى على المخالفة السابقة ١٨٠ يوماً من تاريخ إبلاغ العامل بتوقيع الجزاء عليه.", "subs": ["law_discipline"]},
 {"id": "lw25", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٨٣", "t": "ما أقصى مدة لشرط عدم المنافسة بعد انتهاء عقد العمل؟", "o": ["سنتان", "سنة واحدة", "خمس سنوات", "لا حد لمدته إذا كان مكتوباً"], "w": "المادة ٨٣: يجوز اشتراط عدم المنافسة كتابة إذا كان العمل يسمح بمعرفة عملاء صاحب العمل أو أسراره، ويكون محدداً زماناً ومكاناً ونوع عمل، ولا تزيد مدته على سنتين من انتهاء العلاقة.", "subs": ["law_end", "law_contract"]},
 {"id": "lw26", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٩٣", "t": "أجر عامل المستحق ٤٬٠٠٠ ريال، وعليه أقساط وغرامات. ما أقصى مجموع يجوز حسمه منه هذا الشهر؟", "o": ["٢٬٠٠٠ ريال", "١٬٠٠٠ ريال", "٤٠٠ ريال", "٣٬٠٠٠ ريال"], "w": "المادة ٩٣: لا يجوز أن تزيد المبالغ المحسومة من أجر العامل على نصف أجره المستحق.", "subs": ["law_wages"]},
 {"id": "lw27", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٩٢", "t": "عامل أجره ٨٬٠٠٠ ريال اقترض من صاحب العمل. ما أقصى قسط شهري يُحسم من أجره لسداد القرض؟", "o": ["٨٠٠ ريال", "٤٬٠٠٠ ريال", "٢٬٠٠٠ ريال", "١٬٦٠٠ ريال"], "w": "المادة ٩٢: يُسترد القرض الذي يقدمه صاحب العمل للعامل بحسم لا يزيد على ١٠٪ من أجره.", "subs": ["law_wages"]},
 {"id": "lw29", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ١٠٨", "t": "لماذا قد لا تنطبق حدود ساعات العمل والعمل الإضافي على مدير عام في شركة؟", "o": ["لأن الإدارة العليا مستثناة", "لأن راتبه أعلى من الحد الأدنى", "لأن عقده غير محدد المدة", "لأنه سعودي الجنسية"], "w": "المادة ١٠٨: لا تسري أحكام المادتين ٩٨ و١٠١ على حالات منها الأشخاص الذين يشغلون مناصب الإدارة العليا، والأعمال المتقطعة.", "subs": ["law_hours"]},
 {"id": "lw30", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ١٠٧", "t": "بدلاً من أجر الساعات الإضافية، عرض صاحب العمل على العامل أيام راحة. ما الشرط؟", "o": ["موافقة العامل", "موافقة مكتب العمل", "أن تكون الراحة مضاعفة", "لا يجوز ذلك مطلقاً"], "w": "المادة ١٠٧: يدفع صاحب العمل أجراً إضافياً يوازي أجر الساعة مضافاً إليه ٥٠٪ من الأجر الأساسي، ويجوز له بموافقة العامل احتساب أيام إجازة مدفوعة بدلاً من أجر الساعات الإضافية.", "subs": ["law_hours"]},
 {"id": "lw31", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ١٠٤", "t": "أراد صاحب عمل أن يكون يوم السبت راحة أسبوعية لبعض عماله بدلاً من الجمعة. ما المطلوب؟", "o": ["إبلاغ مكتب العمل", "موافقة كل عامل كتابة", "زيادة أجر يوم الجمعة ٥٠٪", "لا يجوز تغيير يوم الراحة"], "w": "المادة ١٠٤: يوم الجمعة يوم الراحة الأسبوعية لجميع العمال، ولصاحب العمل بعد إبلاغ مكتب العمل أن يستبدل به لبعض عماله أي يوم من أيام الأسبوع، ويكون يوم الراحة بأجر كامل.", "subs": ["law_rest"]},
 {"id": "lw33", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ١١٦", "t": "حصل عامل على إجازة دون أجر مدتها ٣٠ يوماً. ما أثرها على عقده؟", "o": ["يُوقف العقد فيما زاد على ٢٠ يوماً", "لا أثر لها على العقد مهما طالت مدتها", "يُعد العقد منتهياً ويُصرف للعامل حقه", "يُعد العقد موقوفاً من أول يوم في الإجازة"], "w": "المادة ١١٦: للعامل بموافقة صاحب العمل إجازة دون أجر يتفقان على مدتها، ويُعد عقد العمل موقوفاً خلال مدة الإجازة فيما زاد على ٢٠ يوماً، ما لم يتفق الطرفان على خلاف ذلك.", "subs": ["law_leave"]},
 {"id": "lw34", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ١١٣", "t": "توفي أخو عامل. كم يوماً يستحق إجازة بأجر كامل؟", "o": ["٣ أيام", "٥ أيام", "يوم واحد", "٧ أيام"], "w": "المادة ١١٣: للعامل إجازة بأجر كامل ٥ أيام لزواجه أو لوفاة زوجه أو أحد أصوله أو فروعه، و٣ أيام لوفاة أخيه أو أخته، و٣ أيام لولادة مولود له.", "subs": ["law_leave"]},
 {"id": "lw35", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٢", "t": "متى يُعد العمل \"لبعض الوقت\" بحسب تعريف النظام؟", "o": ["إذا قلّت عن نصف الساعات المعتادة", "إذا قلّت ساعاته عن ٦ ساعات في اليوم", "إذا كانت مدة العقد أقل من سنة واحدة", "إذا كان العمل يُؤدى عن بعد من المنزل"], "w": "المادة ٢: العمل لبعض الوقت هو العمل الذي يؤديه عامل غير متفرغ لدى صاحب عمل ولساعات عمل تقل عن نصف ساعات العمل اليومية المعتادة لدى المنشأة. والمادة ١٢٠ تجعل الوزير يصدر قواعد تنظيمه.", "subs": ["law_parttime", "law_general"]},
 {"id": "lw37", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ١٥٤", "t": "عاملة عادت من إجازة الوضع وترضع طفلها. ما حقها في فترات الرضاعة؟", "o": ["حتى ساعة يومياً تُحسب من العمل", "ساعتان يومياً دون أجر", "نصف ساعة يومياً لا تُحسب من العمل", "لا حق لها بعد انتهاء إجازة الوضع"], "w": "المادة ١٥٤: للعاملة حين عودتها من إجازة الوضع أن تأخذ بقصد إرضاع مولودها فترة أو فترات للاستراحة لا تزيد في مجموعها على ساعة في اليوم الواحد، وتُحسب من ساعات العمل الفعلية.", "subs": ["law_women"]},
 {"id": "lw38", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ١٦٠", "t": "توفي زوج عاملة غير مسلمة. كم مدة إجازتها بأجر كامل؟", "o": ["١٥ يوماً", "٤ أشهر و١٠ أيام", "٣ أيام", "٣٠ يوماً"], "w": "المادة ١٦٠: للعاملة المسلمة التي يتوفى زوجها إجازة عدة بأجر كامل لا تقل عن ٤ أشهر و١٠ أيام، ولغير المسلمة ١٥ يوماً بأجر كامل.", "subs": ["law_women"]},
 {"id": "lw39", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ١٦٦", "t": "شغّلت منشأة حدثاً عمره ١٦ سنة. خلال كم يجب إبلاغ مكتب العمل؟", "o": ["في الأسبوع الأول", "خلال شهر من تشغيله", "خلال ٩٠ يوماً من تشغيله", "لا يلزم إبلاغ مكتب العمل"], "w": "المادة ١٦٦: على صاحب العمل الذي يشغّل حدثاً إبلاغ مكتب العمل خلال الأسبوع الأول من تشغيله، وأن يحتفظ بسجل خاص للعمال الأحداث.", "subs": ["law_minors"]},
 {"id": "lw40", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ١٦٣", "t": "ما الحد الأدنى للفترة الليلية التي يُحظر فيها تشغيل الأحداث؟", "o": ["١٢ ساعة متتالية", "٨ ساعات متتالية", "٦ ساعات متتالية", "١٠ ساعات متتالية"], "w": "المادة ١٦٣: لا يجوز تشغيل الأحداث أثناء فترة من الليل لا تقل عن ١٢ ساعة متتالية، إلا في الحالات التي يحددها الوزير بقرار.", "subs": ["law_minors"]},
 {"id": "lw41", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٢٠١", "t": "لاحظ مفتش خطراً داهماً على سلامة العمال من آلة معطلة. ما صلاحيته؟", "o": ["طلب اتخاذ إجراءات فورية لإزالة الخطر", "الانتظار حتى انتهاء الزيارة ثم كتابة تقرير", "إغلاق المنشأة نهائياً بنفسه", "لا صلاحية له في المعدات"], "w": "المادة ٢٠١: للمفتش إصدار تعليمات لأصحاب العمل بتعديل قواعد العمل في الأجهزة والمعدات خلال مواعيد محددة، وله في حالة الخطر الداهم أن يطلب اتخاذ إجراءات فورية.", "subs": ["law_inspect"]},
 {"id": "lw42", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٢٠٤", "t": "احتاج مفتش لتقييم تسرّب كيميائي في مصنع. بمن يجوز الاستعانة؟", "o": ["مختصين كالأطباء والكيميائيين", "العمال في المصنع نفسه فقط دون غيرهم", "صاحب المصنع لتقديم تقييمه الخاص للتسرب", "لا يجوز للمفتش الاستعانة بأي جهة أخرى"], "w": "المادة ٢٠٤: يجوز عند الحاجة الاستعانة بأطباء ومهندسين وكيميائيين ومختصين في السلامة والصحة المهنية، ولمدير مكتب العمل والمفتشين طلب المساعدة من الجهات التنفيذية المختصة.", "subs": ["law_inspect"]},
 {"id": "lw43", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٢٣١", "t": "عوقبت منشأة على مخالفة ومُنحت مهلة لإزالتها، لكنها لم تُزلها. ما الحكم؟", "o": ["تُعد مخالفة جديدة", "تُلغى العقوبة الأولى عنها", "تُمدد المهلة تلقائياً مرة واحدة", "لا أثر لعدم الإزالة بعد العقوبة"], "w": "المادة ٢٣١: يلتزم المخالف بإزالة المخالفة خلال المهلة التي تحددها اللائحة، ويُعد عدم إزالتها خلالها مخالفة جديدة.", "subs": ["law_penal"]},
 {"id": "lw45", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ٢٤٤", "t": "أي نظام حلّ محله نظام العمل الحالي؟", "o": ["نظام العمل والعمال (١٣٨٩هـ)", "نظام الخدمة المدنية والموارد البشرية", "نظام التأمينات الاجتماعية ولوائحه", "نظام الشركات الصادر عام ١٤٤٣هـ"], "w": "المادة ٢٤٤: يحل هذا النظام محل نظام العمل والعمال الصادر بالمرسوم م/٢١ بتاريخ ٦/٩/١٣٨٩هـ، ويلغي ما يتعارض معه، ويستمر العمل باللوائح والقرارات السابقة إلى حين تعديلها.", "subs": ["law_final"]},
 {"id": "mr01", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ج)؛ لائحة تنظيم عقد العمل البحري، المادة ٤", "t": "وجدت على سفينة سعودية شاباً عمره ١٧ سنة ضمن الطاقم. ما الحكم؟", "o": ["يجوز تدريبه فقط، ولا يجوز تشغيله", "يجوز تشغيله إذا وافق ولي أمره كتابياً", "يجوز تشغيله ٦ ساعات يومياً كالأحداث", "لا يجوز وجوده على السفينة ولو للتدريب"], "w": "المادة ٤ من لائحة تنظيم عقد العمل البحري: لا يجوز تشغيل أي شخص دون ١٨ عاماً، ويجوز تدريب من بلغ ١٦ عاماً فأكثر.", "subs": ["guide_marine", "law_marine"]},
 {"id": "mr02", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ج)؛ لائحة تنظيم عقد العمل البحري، المادة ٦", "t": "قُسّمت راحة بحار خلال ٢٤ ساعة إلى ثلاث فترات: ٤ ساعات ثم ٣ ثم ٣. ما الحكم؟", "o": ["مخالفة؛ قُسّمت لأكثر من فترتين", "نظامي؛ المهم ألا يقل مجموع الراحة عن ١٠ ساعات", "نظامي؛ لأن أطول فترة ٤ ساعات وهذا يكفي", "مخالفة؛ لأن مجموع الراحة يجب أن يكون ١٢ ساعة"], "w": "المادة ٦: لا تقل الراحة عن ١٠ ساعات في كل ٢٤ ساعة و٧٧ ساعة في كل ٧ أيام، ولا تُقسم لأكثر من فترتين لا تقل إحداهما عن ٦ ساعات، ولا تزيد الفترة بين راحتين متتاليتين على ١٤ ساعة.", "subs": ["guide_marine", "law_marine"]},
 {"id": "mr03", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ج)؛ لائحة تنظيم عقد العمل البحري، المادة ٦", "t": "ما الحد الأدنى لساعات راحة البحار خلال ٧ أيام؟", "o": ["٧٧ ساعة", "٧٢ ساعة", "٧٠ ساعة", "٨٤ ساعة"], "w": "الخيار الأول في المادة ٦: ألا تتجاوز ساعات العمل ١٤ ساعة في ٢٤ ساعة و٧٢ ساعة في ٧ أيام. والخيار الثاني: ألا تقل الراحة عن ١٠ ساعات في ٢٤ ساعة و٧٧ ساعة في ٧ أيام.", "subs": ["guide_marine", "law_marine"]},
 {"id": "mr05", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ج)؛ لائحة تنظيم عقد العمل البحري، المادة ٧", "t": "كم يوماً على الأقل يجب أن يُبلَّغ البحار مسبقاً بموعد ومكان الصعود إلى السفينة، في غير حالات الطوارئ؟", "o": ["٥ أيام", "يومان", "١٠ أيام", "١٥ يوماً"], "w": "المادة ٧ (الفقرة ٦): يبلغ المجهز البحار خلال فترة مناسبة لا تقل عن ٥ أيام بتاريخ ووقت ومكان الصعود المتوقع، عدا حالات الطوارئ والضرورة.", "subs": ["guide_marine", "law_marine"]},
 {"id": "mr06", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ج)؛ لائحة تنظيم عقد العمل البحري، المادة ١٨", "t": "رحّل مجهزٌ بحاراً إلى موطنه. كم كيلوغراماً من أمتعته الشخصية يلزم المجهز بنقلها على حسابه على الأقل؟", "o": ["٢٣ كيلوغراماً", "١٠ كيلوغرامات", "٣٠ كيلوغراماً", "لا يلزمه نقل أي أمتعة"], "w": "المادة ١٨: تشمل تكاليف الإعادة الرحلة كاملة، والإقامة والغذاء حتى الوصول، ونقل ٢٣ كيلوغراماً من الأمتعة، والعلاج إذا وقع الضرر أثناء الخدمة. ولا يجوز مطالبة البحار بها سلفاً.", "subs": ["guide_marine", "law_marine"]},
 {"id": "mr09", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ج)؛ لائحة تنظيم عقد العمل البحري، المادة ٣٤", "t": "قدّم بحار شكوى إلى الربان. ما أقصى مدة للنظر فيها ومعالجتها على متن السفينة؟", "o": ["٧ أيام", "٣ أيام", "١٥ يوماً", "٢٠ يوماً"], "w": "المادة ٣٤: يُنظر في الشكوى ويعالجها الربان أو المجهز خلال ٧ أيام كحد أقصى. وإذا كانت الشكوى على الربان تُقدّم لمالك السفينة ويُمنح الطرفان ٢٠ يوماً، ثم ٢٠ يوماً أخرى لعرضها على إدارة التسوية الودية.", "subs": ["guide_marine", "law_marine"]},
 {"id": "mr11", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ج)؛ لائحة تنظيم عقد العمل البحري، المادة ٢٠", "t": "وثيقة الضمان المالي لمسؤولية التخلي عن البحارة تغطي الأجور المتأخرة. ما الحد الذي تغطيه منها؟", "o": ["أجر ٤ أشهر", "أجر شهرين", "أجر ٦ أشهر", "أجر سنة كاملة"], "w": "المادة ٢٠: يقدم المجهز ضماناً مالياً يغطي الأجور العالقة بما لا يتجاوز أجر ٤ أشهر، ونفقات البحار ومنها الإعادة، واحتياجاته الأساسية. ويحظر إبحار السفينة دون وثيقة الضمان على متنها.", "subs": ["guide_marine", "law_marine"]},
 {"id": "mr12", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ج)؛ لائحة تنظيم عقد العمل البحري، المادة ٢٨", "t": "أصيب بحار بعجز مؤقت بسبب العمل وبقي على متن السفينة. ما الذي يلتزم به المجهز تجاه أجره؟", "o": ["أجره كاملاً حتى ١٦ أسبوعاً", "نصف أجره حتى يشفى تماماً", "٧٥٪ من أجره من أول يوم للإصابة", "لا يلتزم بأجره، ويكتفي بنفقات العلاج"], "w": "المادة ٢٨: يدفع المجهز للبحار العاجز مؤقتاً أجره كاملاً طوال بقائه على متن السفينة مدة لا تتجاوز ١٦ أسبوعاً، إضافة إلى نفقات العلاج والغذاء والإقامة.", "subs": ["guide_marine", "law_marine"]},
 {"id": "mr13", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ج)؛ لائحة تنظيم عقد العمل البحري، المادة ٢٨", "t": "توفي بحار أثناء الخدمة ولم تُصرف مستحقاته لورثته. خلال كم يوماً يودعها المجهز لدى السلطة البحرية؟", "o": ["١٥ يوماً", "٧ أيام", "٣٠ يوماً", "٦٠ يوماً"], "w": "المادة ٢٨ (الفقرة ٤): يودع المجهز لدى السلطة البحرية الأجر والمبالغ المستحقة للبحار المتوفى خلال ١٥ يوماً من الوفاة أو العلم بها إذا لم يكن وفّاها لمستحقيها، ويتحمل نفقات دفنه في بلده.", "subs": ["guide_marine", "law_marine"]},
 {"id": "mr15", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ج)؛ لائحة تنظيم عقد العمل البحري، المادة ٢٩", "t": "أراد مجهز حجز بعض أغراض بحار لخلاف بينهما. أي هذه لا يجوز حجزه أياً كان السبب؟", "o": ["ملابس البحار وأدوات مهنته", "جواز سفره فقط", "أجره الشهري كاملاً", "لا شيء؛ يجوز الحجز بأمر الربان"], "w": "المادة ٢٩: لا يُحجز أياً كان السبب على ملابس البحار، ولا على الآلات والأشياء المملوكة له واللازمة لمهنته، ولا على المبالغ المستحقة له لمصاريف الطبيب والأدوية والإعادة.", "subs": ["guide_marine", "law_marine"]},
 {"id": "mr16", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ج)؛ لائحة تنظيم عقد العمل البحري، المادة ٣٣", "t": "سفينة سعودية حمولتها ٨٠٠ طن تستعد لرحلة دولية، وشهادة العمل البحري منتهية. ما الحكم؟", "o": ["يحظر إبحارها حتى تحصل على شهادة سارية", "يجوز إبحارها وتجديد الشهادة في الميناء التالي", "الشهادة مطلوبة فقط للسفن فوق ٥٠٠٠ طن", "يجوز إبحارها إذا وافق الربان كتابياً"], "w": "المادة ٣٣: يحظر إبحار أي سفينة أو وحدة بحرية دون شهادة عمل بحري سارية. ومن مخالفات الفئة (ج) إبحار السفينة السعودية التي تبلغ حمولتها ٥٠٠ طن أو أكثر في ملاحة دولية دون الشهادة.", "subs": ["guide_marine", "law_marine"]},
 {"id": "mr18", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ج)؛ لائحة تنظيم عقد العمل البحري، المادة ١١", "t": "سفينة تقوم برحلات دولية لأكثر من ٣ أيام. متى يلزم تعيين طبيب مؤهل على متنها؟", "o": ["إذا كانت تحمل أكثر من ١٠٠ فرد", "إذا كانت تحمل أكثر من ٥٠ فرداً", "إذا زادت حمولتها على ٥٠٠ طن", "في كل السفن الدولية مهما كان عدد من عليها"], "w": "المادة ١١: يُعيّن طبيب مؤهل مسؤول عن الرعاية الطبية في السفينة التي تحمل أكثر من ١٠٠ فرد وتقوم برحلات دولية لأكثر من ٣ أيام. ويُعيّن ضابط أمن لسفن البضائع فوق ٥٠٠ طن وسفن الركاب الدولية.", "subs": ["guide_marine", "law_marine"]},
 {"id": "mr19", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ج)؛ لائحة تنظيم عقد العمل البحري، المادة ١١", "t": "كم مرة على الأقل يجب أن يوفّر المجهز للبحارة الملابس ومتطلبات السلامة والصحة المهنية؟", "o": ["عند الالتحاق، ثم كل ٦ أشهر", "مرة واحدة فقط عند التعيين في السفينة", "مرة كل سنة عقدية من تاريخ العقد", "عند طلب البحار ذلك كتابياً من الربان"], "w": "المادة ١١ (الفقرة ٣): يوفّر المجهز الملابس ومتطلبات السلامة والصحة المهنية فور التحاق البحار، ويجددها مرة كل ٦ أشهر بحد أقصى.", "subs": ["guide_marine", "law_marine"]},
 {"id": "mr20", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ج)؛ لائحة تنظيم عقد العمل البحري، المادة ٦", "t": "متدرب على سفينة عمره ١٧ سنة. ما الحد الأقصى لساعات تدريبه؟", "o": ["٨ ساعات يومياً و٤٠ أسبوعياً", "١٤ ساعة يومياً و٧٢ أسبوعياً", "٦ ساعات يومياً و٣٦ أسبوعياً", "١٠ ساعات يومياً و٥٠ أسبوعياً"], "w": "المادة ٦ (الفقرة ٣): لا تتجاوز ساعات المتدربين دون ١٨ عاماً ٨ ساعات يومياً و٤٠ أسبوعياً، مع ساعة للوجبة الرئيسية و١٥ دقيقة راحة بعد كل ساعتين متواصلتين.", "subs": ["guide_marine", "law_marine"]},
 {"id": "mr22", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (ج)؛ لائحة تنظيم عقد العمل البحري، المادة ١٦", "t": "بحار أجره محسوب على أساس الرحلة، وتوفي أثناءها. ما حق ورثته؟", "o": ["أجره عن الرحلة كاملة", "أجره حتى يوم وفاته فقط", "نصف أجر الرحلة", "لا يستحقون شيئاً من أجر الرحلة"], "w": "المادة ١٦: إذا كان الأجر بالرحلة وتوفي أثناءها فلورثته أجر الرحلة كاملة، وإذا كان بالشهر فلهم أجره حتى يوم وفاته، وإذا كان حصة في الأرباح فلهم الحصة كاملة.", "subs": ["guide_marine", "law_marine"]},
 {"id": "mn02", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ١٨٩", "t": "زائر من شركة مورّدة يريد دخول موقع العمل في منجم لمعاينة معدات. ما الحكم؟", "o": ["يحظر دخوله إلا بتصريح خاص", "يجوز دخوله ما دام يرتدي أدوات الوقاية", "يجوز دخوله بمرافقة أي عامل", "يجوز دخوله فوق سطح الأرض دون قيود"], "w": "المادة ١٨٩: يحظر دخول أماكن العمل وملحقاتها على غير العاملين فيها، عدا المفتشين ومن يحملون تصاريح خاصة.", "subs": ["guide_mines", "law_mines"]},
 {"id": "mn04", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ١٩٣", "t": "محجر صغير يعمل فيه ١٥ عاملاً، وبجواره محاجر صغيرة أخرى ضمن دائرة نصف قطرها ١٥ كم. ما الخيار النظامي للإنقاذ والإسعاف؟", "o": ["الاشتراك في مكان إنقاذ وسط", "لا يلزمه أي ترتيب لأن عماله أقل من ٥٠", "إنشاء غرفة تمريض كاملة خاصة به", "الاعتماد على أقرب مستشفى حكومي فقط"], "w": "المادة ١٩٣: المنجم أو المحجر الذي يعمل فيه ٥٠ عاملاً فأكثر يعد مكاناً للإنقاذ والإسعاف وغرفة تمريض. أما الأصغر الواقعة في دائرة نصف قطرها ٢٠ كم فيجوز أن تشترك في مكان وسط.", "subs": ["guide_mines", "law_mines"]},
 {"id": "mn07", "src": "law", "topic": "contract", "ref": "نظام العمل، المادة ١٩٢", "t": "ما الذي يجب أن يتوفر في نقطة الإنقاذ القريبة من المنجم؟", "o": ["أدوات إسعاف واتصال وفني مدرب", "سيارة إسعاف مجهزة وطبيب مقيم دائم", "غرفة تمريض فقط دون أي معدات إنقاذ", "مخزن للمعدات الاحتياطية وقطع الغيار"], "w": "المادة ١٩٢: ينشئ صاحب العمل نقطة إنقاذ قريبة مجهزة بأدوات الإنقاذ والإسعافات، مع وسيلة اتصال مناسبة، ويعيّن عاملاً فنياً مدرباً للإشراف على الإنقاذ والإسعافات الأولية.", "subs": ["guide_mines", "law_mines"]},
 {"id": "rg01", "src": "regs", "topic": "contract", "ref": "اللائحة التنفيذية لنظام العمل، المادة ١؛ نظام العمل، المادة ٦", "t": "عامل بعقد عمل مؤقت استمر في العمل مع صاحب العمل ١٠٠ يوم. ما أثر ذلك؟", "o": ["تسري عليه جميع أحكام نظام العمل", "يبقى عقده مؤقتاً مهما طالت المدة", "ينتهي عقده تلقائياً", "يتحول إلى عقد تدريب"], "w": "المادة ١ من اللائحة (تنفيذاً للمادة ٦): إذا استمر طرفا عقد العمل المؤقت أو العرضي في تنفيذه مدة تجاوزت ٩٠ يوماً، سرت على العقد جميع أحكام نظام العمل.", "subs": ["regs_temp"]},
 {"id": "rg02", "src": "regs", "topic": "contract", "ref": "نظام العمل، المادة ٢", "t": "ما المدة القصوى للعمل المؤقت أو العرضي بحسب تعريفات النظام؟", "o": ["٩٠ يوماً", "٣٠ يوماً", "١٨٠ يوماً", "سنة واحدة"], "w": "المادة ٢: العمل المؤقت يدخل في نشاط صاحب العمل وتقتضي طبيعته إنجازه في مدة محددة، والعرضي لا يدخل في نشاطه، ولا تتجاوز مدة أي منهما ٩٠ يوماً.", "subs": ["regs_temp", "law_general"]},
 {"id": "rg04", "src": "regs", "topic": "contract", "ref": "نظام العمل، المادة ١٣؛ اللائحة التنفيذية لنظام العمل، المادتان ٣ و٤", "t": "ما المطلوب من صاحب العمل بعد إعداد لائحة تنظيم العمل؟", "o": ["إعلانها في مكان ظاهر", "إرسالها لكل عامل بالبريد المسجل", "حفظها سراً لدى الإدارة", "نشرها في صحيفة محلية"], "w": "المادة ١٣: يعد صاحب العمل لائحة تنظيم العمل وفق النموذج المعد من الوزارة، ويعلنها وأي تعديل عليها في مكان ظاهر في المنشأة أو بأي وسيلة أخرى تكفل علم الخاضعين لها بأحكامها.", "subs": ["regs_workregs", "law_general"]},

 {"id": "rg07", "src": "regs", "topic": "contract", "ref": "نظام العمل، المادة ١٧", "t": "ما الذي يجب أن يعلنه صاحب العمل في مكان ظاهر بالمنشأة بحسب المادة ١٧؟", "o": ["جدول ساعات العمل والراحة", "رواتب جميع العاملين", "أسماء العمال المعاقبين", "أرباح المنشأة السنوية"], "w": "المادة ١٧: يحتفظ صاحب العمل في مكان العمل بالسجلات والكشوف والملفات المطلوبة، ويعلن في مكان ظاهر جدولاً بساعات العمل وفترات الراحة ويوم الراحة الأسبوعية ومواعيد بدء كل نوبة وانتهائها.", "subs": ["regs_docs", "law_general"]},
 {"id": "rg09", "src": "regs", "topic": "contract", "ref": "نظام العمل، المادة ٩؛ الدليل الإجرائي، الفئة (أ)", "t": "عقد عمل مكتوب بالعربية والإنجليزية، واختلف النصان في مقدار البدل. أيهما المعتمد؟", "o": ["النص العربي", "النص الإنجليزي", "الأنفع للعامل", "الأحدث تاريخاً"], "w": "المادة ٩: العربية هي الواجبة الاستعمال في البيانات والسجلات والملفات وعقود العمل، وإذا استُعملت لغة أجنبية إلى جانبها فالنص العربي هو المعتمد دون غيره.", "subs": ["regs_docs", "law_general"]},

 {"id": "rg11", "src": "regs", "topic": "contract", "ref": "نظام العمل، المادة ٣٧", "t": "عقد عامل وافد لم تُذكر فيه مدته. ما مدته نظاماً؟", "o": ["مدة رخصة العمل", "سنة واحدة تتجدد تلقائياً", "غير محدد المدة كالعامل السعودي", "سنتان من تاريخ وصول العامل"], "w": "المادة ٣٧: يجب أن يكون عقد عمل غير السعودي مكتوباً ومحدد المدة، وإذا خلا العقد من بيان مدته عُدّت مدة رخصة العمل هي مدة العقد.", "subs": ["regs_saud", "law_foreign"]},
 {"id": "rg14", "src": "regs", "topic": "contract", "ref": "اللائحة التنفيذية لنظام العمل، المادة ١٥ مكرر؛ نظام العمل، المادة ٤٣", "t": "منشأة ملزمة بنسبة لتدريب عمالها السعوديين، ولديها موظف يكمل دراسته الجامعية. متى يُحتسب ضمن النسبة؟", "o": ["إذا تحمل صاحب العمل نفقات دراسته", "إذا كانت دراسته مسائية خارج الدوام", "إذا كان تخصصه الدراسي إدارياً", "لا يُحتسب مطلقاً ضمن نسبة التدريب"], "w": "المادة ٤٣ والمادة ١٥ مكرر من اللائحة: على صاحب العمل تدريب عماله السعوديين بنسبة يحددها الوزير، ويُحتسب العمال الذين يكملون دراستهم ضمن هذه النسبة إذا تحمل صاحب العمل نفقات دراستهم.", "subs": ["regs_train", "law_training", "guide_other"]},

 {"id": "rg22", "src": "regs", "topic": "contract", "ref": "تصريح وزارة الموارد البشرية بشأن الحد الأقصى للعمل الإضافي (٢٠٢١)", "t": "ما الحد الأقصى السنوي لساعات العمل الإضافي للعامل، ما لم يوافق على تجاوزه؟", "o": ["٧٢٠ ساعة", "٣٦٠ ساعة", "١٠٠٠ ساعة", "٤٨٠ ساعة"], "w": "أعلنت الوزارة أن الحد الأقصى للعمل الإضافي ٧٢٠ ساعة في السنة للعامل، ويجوز تجاوزه بموافقته، مع دفع الأجر الإضافي وفق المادة ١٠٧.", "subs": ["regs_hours", "law_hours"]},
 {"id": "rg23", "src": "regs", "topic": "contract", "ref": "اللائحة التنفيذية لنظام العمل، المادة ٢٤", "t": "متى تبدأ إجازة عيد الأضحى للعاملين، وكم مدتها؟", "o": ["٤ أيام تبدأ من يوم الوقوف بعرفة", "٤ أيام تبدأ من يوم العيد نفسه", "٣ أيام تبدأ من أول أيام العيد", "٥ أيام تبدأ قبل يوم عرفة بيوم واحد"], "w": "المادة ٢٤ من اللائحة: إجازة عيد الأضحى ٤ أيام تبدأ من يوم الوقوف بعرفة، وعيد الفطر ٤ أيام تبدأ من اليوم التالي لـ٢٩ رمضان، واليوم الوطني يوم واحد (الأول من برج الميزان)، ويوم التأسيس يوم واحد (٢٢ فبراير).", "subs": ["regs_hours"]},
 {"id": "rg25", "src": "regs", "topic": "contract", "ref": "نظام العمل، المادة ١٤٢؛ اللائحة التنفيذية لنظام العمل، المادة ٢٩", "t": "ماذا تحدد المادة ٢٩ من اللائحة التنفيذية فيما يخص الإسعافات الأولية؟", "o": ["محتويات الخزانة ومن يقوم بالإسعاف", "موقع أقرب مستشفى للمنشأة", "أسعار الأدوية في الخزانة", "عدد الأطباء الواجب تعيينهم"], "w": "المادة ١٤٢ من النظام: تحدد اللائحة ما يجب أن تحتويه خزانة الإسعافات من وسائل وأدوية وكمياتها، وتنظيم وسائل حفظها، وشروط من يقوم بمهمة الإسعافات ومستواه، وهذا ما تنظمه المادة ٢٩ من اللائحة.", "subs": ["regs_safety", "law_safety"]},
 {"id": "rg27", "src": "regs", "topic": "contract", "ref": "نظام العمل، المادة ١٦٤؛ اللائحة التنفيذية لنظام العمل، المرأة العاملة والأحداث", "t": "ما الحد الأقصى لساعات عمل الحدث يومياً في غير رمضان؟", "o": ["٦ ساعات", "٨ ساعات", "٤ ساعات", "٧ ساعات"], "w": "المادة ١٦٤: لا يجوز تشغيل الأحداث فعلياً أكثر من ٦ ساعات يومياً لغير شهر رمضان، و٤ ساعات في رمضان، ولا يعمل أكثر من ٤ ساعات متصلة دون راحة نصف ساعة، ولا يبقى في مكان العمل أكثر من ٧ ساعات.", "subs": ["regs_women", "law_minors"]},
 {"id": "rg28", "src": "regs", "topic": "contract", "ref": "نظام العمل، المادة ١٦٢؛ الدليل الإجرائي، الفئة (أ)", "t": "فتى عمره ١٤ سنة يريد العمل في محل عطور خلال الإجازة الصيفية. متى يجوز ذلك؟", "o": ["في أعمال خفيفة يحددها الوزير", "لا يجوز إطلاقاً قبل ١٨ سنة", "يجوز في أي عمل بموافقة ولي أمره", "يجوز إذا لم يتجاوز ٨ ساعات يومياً"], "w": "المادة ١٦٢: لا يجوز تشغيل من لم يتم ١٥ سنة، وللوزير أن يسمح بتشغيل من بين ١٣ و١٥ سنة في أعمال خفيفة لا تضر صحتهم ونموهم ولا تعطل مواظبتهم في المدرسة.", "subs": ["regs_women", "law_minors", "guide_women"]},

 {"id": "rg31", "src": "regs", "topic": "contract", "ref": "اللائحة التنفيذية لنظام العمل، المادة ٣٨", "t": "اتفق صاحب منشأة مع الوزارة على تسوية مخالفة، لكنه لم ينفذ الاتفاق. متى يُلغى الاتفاق؟", "o": ["إذا لم يُنفّذ خلال ٦٠ يوماً", "إذا لم يُنفّذ خلال سنة من توقيعه", "لا يُلغى أبداً بعد توقيع الطرفين عليه", "إذا لم يُنفّذ خلال ٧ أيام عمل"], "w": "المادة ٣٨ من اللائحة تتيح تسوية المخالفات وفق شروط، منها عدم تكرارها خلال عامين، ويُلغى اتفاق التسوية إذا لم يُنفذ خلال ٦٠ يوماً.", "subs": ["regs_penal"]},

function pinHash(p){let h=2166136261;const s='mulhem|'+p;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(16);}

 if(d){try{localStorage.removeItem(DRAFT_KEY)}catch(e){}}

const fmtDate=iso=>{if(!iso)return '';const[y,m,d]=iso.split('-').map(Number);try{return new Date(y,m-1,d).toLocaleDateString('ar-SA-u-ca-gregory',{day:'numeric',month:'long',year:'numeric'});}catch(e){return iso;}};
function campaignsOn(dk){const d=pd(dk);return (CFG.campaigns||[]).filter(c=>c.from&&c.to&&pd(c.from)<=d&&d<=pd(c.to)&&((c.subs||[]).length||(c.topics||[]).length||(c.srcs||[]).length));}
function focusOf(dk){const cs=campaignsOn(dk);if(!cs.length)return null;const F={subs:new Set(),topics:new Set(),srcs:new Set(),cs};cs.forEach(c=>{(c.subs||[]).forEach(t=>F.subs.add(t));(c.topics||[]).forEach(t=>F.topics.add(t));(c.srcs||[]).forEach(s=>F.srcs.add(s));});return F;}
const inFocus=(it,F)=>!!F&&((it.subs||[]).some(x=>F.subs&&F.subs.has(x))||(F.topics&&F.topics.has(it.topic))||(F.srcs&&F.srcs.has(it.src)));
const subLabel=it=>{const k=(it.subs||[]).find(x=>SUBS[x]&&SUBS[x].src===it.src)||(it.subs||[])[0];return k&&SUBS[k]?SUBS[k].n:(TOPICS[it.topic]||'');};
const campChips=c=>(c.srcs||[]).map(s=>`<span>${SOURCES[s].n} (كامل)</span>`).join('')+(c.subs||[]).map(k=>SUBS[k]?`<span>${SUBS[k].n}</span>`:'').join('')+(c.topics||[]).map(t=>TOPICS[t]?`<span>${TOPICS[t]}</span>`:'').join('');

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967295;}

/* اختيار الأسئلة: أسئلة فترة التركيز أولاً، ثم ما أخطأت فيه، ثم الجديد قبل المكرر */
function pickItems(g,n){const t=today();const F=focusOf(t);const pool=poolFor(g);
 const pr=x=>{const it=S.items[x.id];const j=Math.random()*10;let p;
  if(!it)p=50+j;else{const age=daysBetween(it.last,t);if(age<1)p=-100+j;else if(it.miss)p=80+Math.min(age,10)*3+j;else p=Math.min(age,30)*2+j;}
  if(inFocus(x,F))p+=300;return p;};
 return pool.map(x=>({x,p:pr(x)})).sort((a,b)=>b.p-a.p).slice(0,Math.min(n,pool.length)).map(o=>Object.assign({_k:o.x.id},o.x));}

/* خطة اليوم: أضعف مهارة أولاً، ثم ما لم يُقيَّم أو يحتاج تقوية، مع أولوية لفترة التركيز */
function buildPlan(dk){const F=focusOf(dk);
 const avail=GAMES.filter(g=>poolFor(g).length);
 const assessed=avail.filter(g=>skOf(g.id)).sort((a,b)=>S.sk[a.id].r-S.sk[b.id].r);
 const plan=[],why={};const add=(g,w)=>{if(g&&plan.length<3&&!plan.includes(g.id)){plan.push(g.id);why[g.id]=w;}};
 const fTitle=F?F.cs.map(c=>c.title).join('، '):'';
 const cand=avail.map(g=>{const k=skOf(g.id);const fc=focusCount(g,F);let sc,w;
  if(!k){sc=60;w=assessed.length?'مهارة لم تُقيَّم بعد':'قياس أوّلي لمستواك';}
  else{const st=Math.max(0,daysBetween(k.last,dk));sc=(100-k.r)+Math.min(st,10)*4;w=st>=3?`لم تتدرب عليها منذ ${ar(st)} أيام`:`تحتاج تقوية (${ar(k.r)})`;}
  if(fc){sc+=45;}sc+=hash(dk+g.id)*8;return{g,k,sc,w,fc};}).sort((a,b)=>b.sc-a.sc);
 if(assessed.length>=2)add(assessed[0],`أضعف مهاراتك حالياً (${ar(S.sk[assessed[0].id].r)})`);
 if(F){const fx=cand.filter(c=>c.fc).sort((a,b)=>b.fc-a.fc||b.sc-a.sc);if(fx[0])add(fx[0].g,`تركيز الفترة: ${fTitle}`);}
 cand.forEach(c=>add(c.g,c.w));
 if(!F&&assessed.length>=4){const strongest=assessed[assessed.length-1];if(!plan.includes(strongest.id)){plan.pop();add(strongest,`نقطة قوتك (${ar(S.sk[strongest.id].r)}): حافظ عليها`);}}
 if(F)plan.forEach(id=>{if(focusCount(G(id),F)&&!why[id].startsWith('تركيز'))why[id]+=`، وضمن تركيز الفترة`;});
 return{plan,why,done:{},sig:cfgSig()};}
function todayPlan(){const t=today();const d=S.days[t];

/* ================= إطار اللعب ================= */
function newSess(g,total,wk){return{g,score:0,correct:0,total,res:[],wk};}
const gTime=g=>Math.round(g.time*skLevel(g.id).tm);
function shell(g,s){setTab(s.wk?'home':'games');const m=view();const wrap=el('div','narrow');m.append(wrap);
 const lv=skLevel(g.id);let wkTag='';
 if(s.wk){const d=todayPlan();wkTag=`<span class="x2">تمرين اليوم ${ar(d.plan.indexOf(g.id)+1)}/${ar(d.plan.length)}</span>`;}
 const top=el('div','gtop');
 top.innerHTML=`<button class="iconbtn" aria-label="رجوع">${ic('back')}</button><div class="gtitle"><span class="gicon" style="--c:var(--${g.color})">${ic(g.icon)}</span><div><b>${g.name}</b><div class="gsub">${wkTag}<span class="lvpill ${lv.cls}">${lv.name}</span></div></div></div><div class="score"><small>النقاط</small><b>٠</b></div>`;
 top.querySelector('button').onclick=()=>{stopT();s.wk?home():games();};
 const prog=el('div','prog');for(let k=0;k<s.total;k++)prog.append(el('i'));
 const tw=el('div','timer',`<span class="tpill">${ic('clock')}<span class="secs"></span><small>ث</small></span><div class="track"><div class="bar"></div></div>`);tw.style.visibility='hidden';
 const body=el('div','');
 wrap.append(top,prog,tw,body);
 return{body,
  prog:i=>[...prog.children].forEach((d,k)=>d.className=k<i?'done':k===i?'now':''),
  score:v=>{top.querySelector('.score b').textContent=ar(Math.round(v));},
  timer:(sec,end)=>timer(sec,tw,end)};}
function timer(sec,wrap,end){stopT();wrap.style.visibility='visible';const bar=wrap.querySelector('.bar'),tx=wrap.querySelector('.secs');const t0=Date.now();let left=sec;
 const tick=()=>{left=Math.max(0,sec-(Date.now()-t0)/1000);bar.style.transform=`scaleX(${left/sec})`;wrap.classList.toggle('low',left/sec<.25);tx.textContent=ar(Math.ceil(left));if(left<=0){stopT();end();}};
 tick();T=setInterval(tick,200);return()=>left;}
function nextBtn(last,fn){const b=el('button','btn primary block',last?'عرض النتيجة':'التالي');b.onclick=fn;return b;}
function scrollTo(e){setTimeout(()=>{try{e.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(x){}},60);}
const refLine=it=>it.ref?`<p class="ref">${ic('book')}<span><b>المرجع:</b> ${esc(it.ref)}</span></p>`:'';
const qHead=it=>`<div class="qmeta">${it.label?`<span class="tag">${esc(it.label)}</span>`:''}${srcChip(it.src)}${subLabel(it)?`<span class="tag">${subLabel(it)}</span>`:''}</div>`;

/* ===== محرك: اختيار من متعدد ===== */
function runMCQ(g,wk){const items=pickItems(g,wk?g.wn:g.n);const s=newSess(g,items.length,wk);const time=gTime(g);let i=0;const sh=shell(g,s);
 function q(){if(i>=items.length)return finish(s);const it=items[i];sh.prog(i);sh.body.innerHTML='';
  sh.body.append(el('div','qcard',`${qHead(it)}<p class="qtext">${esc(it.t)}</p>${it.sub?`<p class="constraint">${ic('lock')}<span>${esc(it.sub)}</span></p>`:''}`));
  sh.body.append(el('p','ask',g.prompt));
  const opts=shuffle(it.o.map((t,k)=>({t,ok:k===0})));const list=el('div','opts');let answered=false;
  opts.forEach((o,k)=>{const b=el('button','opt');b.textContent=o.t;b.style.animationDelay=(k*60)+'ms';o.b=b;b.onclick=()=>answer(o);list.append(b);});
  sh.body.append(list);
  const left=sh.timer(time,()=>answer(null));
  function answer(o){if(answered)return;answered=true;stopT();const rem=left();const good=!!(o&&o.ok);
   s.res.push({k:it._k,ok:good,p:good?70+30*rem/time:0,tf:1-rem/time,timed:1});
   opts.forEach(x=>{x.b.disabled=true;if(x.ok)x.b.classList.add('ok');});
   if(good){s.score+=100+Math.ceil(rem)*3;s.correct++;fx('ok');}else{if(o)o.b.classList.add('bad');fx('bad');}
   sh.score(s.score);
   const fb=el('div','feedback '+(good?'good':'miss'),`<strong>${good?'إجابة صحيحة':(o?'ليست الإجابة الصحيحة':'انتهى الوقت')}</strong><p>${esc(it.w)}</p>${refLine(it)}`);
   fb.append(nextBtn(i===items.length-1,()=>{i++;q();}));sh.body.append(fb);scrollTo(fb);}
 }
 q();}

/* ===== محرك: الترتيب ===== */
function runOrder(g,wk){const items=pickItems(g,wk?g.wn:g.n);const s=newSess(g,items.length,wk);const time=gTime(g);let i=0;const sh=shell(g,s);
 function q(){if(i>=items.length)return finish(s);const it=items[i];sh.prog(i);sh.body.innerHTML='';
  sh.body.append(el('div','qcard',`${qHead(it)}<p class="qtext">${esc(it.t)}</p>`));
  sh.body.append(el('p','ask','اضغط على أول ٣ خطوات بالترتيب: ١ ثم ٢ ثم ٣. اضغط مرة ثانية للإلغاء.'));
  const opts=shuffle(it.o.map((t,k)=>({t,k})));const chosen=[];let done=false;const list=el('div','opts');
  const confirm=el('button','btn primary block','اعتمد الترتيب');confirm.disabled=true;
  opts.forEach((o,k)=>{const b=el('button','opt order','<span class="num"></span><span class="t"></span>');b.querySelector('.t').textContent=o.t;b.style.animationDelay=(k*60)+'ms';o.b=b;
   b.onclick=()=>{if(done)return;const p=chosen.indexOf(o);if(p>-1)chosen.splice(p,1);else if(chosen.length<3)chosen.push(o);paint();fx('ok');};list.append(b);});
  function paint(){opts.forEach(o=>{const p=chosen.indexOf(o);o.b.classList.toggle('sel',p>-1);o.b.querySelector('.num').textContent=p>-1?ar(p+1):'';});confirm.disabled=chosen.length<3;}
  sh.body.append(list,confirm);
  const left=sh.timer(time,submit);confirm.onclick=submit;
  function submit(){if(done)return;done=true;stopT();const rem=left();let exact=0,part=0;
   chosen.forEach((o,p)=>{if(o.k===p)exact++;else if(o.k<3)part++;});
   const full=chosen.length===3;
   s.res.push({k:it._k,ok:exact===3,p:(exact*30+part*10)/90*85+(full?15*rem/time:0),tf:1-rem/time,timed:1});
   s.score+=exact*40+part*15+(full?Math.ceil(rem):0);if(exact===3)s.correct++;sh.score(s.score);fx(exact===3?'ok':'bad');
   opts.forEach(o=>{o.b.disabled=true;o.b.classList.remove('sel');const n=o.b.querySelector('.num');
    if(o.k<3){o.b.classList.add('ok');n.textContent=ar(o.k+1);}else if(chosen.includes(o)){o.b.classList.add('bad');n.textContent='✕';}else n.textContent='';});
   confirm.remove();
   const head=!full?'انتهى الوقت قبل اكتمال الترتيب':exact===3?'ترتيب صحيح':`${ar(exact)} من ٣ في مكانها الصحيح`;
   const fb=el('div','feedback '+(exact===3?'good':'miss'),`<strong>${head}</strong><p>${esc(it.w)}</p>${refLine(it)}`);
   fb.append(nextBtn(i===items.length-1,()=>{i++;q();}));sh.body.append(fb);scrollTo(fb);}
 }
 q();}

/* ===== محرك: دقة الملاحظة ===== */
function runSpot(g,wk){const items=pickItems(g,wk?g.wn:g.n);const s=newSess(g,items.length,wk);const time=gTime(g);let i=0;const sh=shell(g,s);
 function q(){if(i>=items.length)return finish(s);const it=items[i];sh.prog(i);sh.body.innerHTML='';let done=false;
  const need=it.l.filter(x=>x.e).length;
  sh.body.append(el('div','qmeta solo',srcChip(it.src)+(subLabel(it)?`<span class="tag">${subLabel(it)}</span>`:'')));
  sh.body.append(el('p','ask',`في هذا المستند ${ar(need)} أخطاء نظامية. اضغط على الأسطر الخاطئة ثم اضغط زر التحقق.`));
  const doc=el('div','doc');doc.append(el('div','doc-h',`${ic('file')}<b>${esc(it.title)}</b>`));
  const lines=it.l.map(x=>{const b=el('button','line');b.textContent=x.t;b.onclick=()=>{if(done)return;b.classList.toggle('sel');count();fx('ok');};doc.append(b);return{x,b};});
  const cnt=el('p','counter');
  function count(){cnt.textContent=`اخترت ${ar(lines.filter(l=>l.b.classList.contains('sel')).length)} من ${ar(need)}`;}
  count();
  const btn=el('button','btn primary block','تحقّق');
  sh.body.append(doc,cnt,btn);
  const left=sh.timer(time,submit);btn.onclick=submit;
  function submit(){if(done)return;done=true;stopT();const rem=left();let hit=0,wrong=0;
   lines.forEach(({x,b})=>{const sel=b.classList.contains('sel');b.disabled=true;b.classList.remove('sel');
    if(x.e&&sel){hit++;b.classList.add('ok');}else if(x.e)b.classList.add('miss');else if(sel){wrong++;b.classList.add('bad');}
    if(x.e){const w=el('span','why');w.textContent=x.e;b.append(w);}});
   const ok=hit===need&&!wrong;
   s.res.push({k:it._k,ok,p:Math.max(0,hit/need*85-wrong*12)+(hit?15*rem/time:0),tf:1-rem/time,timed:1});
   s.score+=Math.max(0,hit*60-wrong*20+(hit?Math.ceil(rem):0));if(ok)s.correct++;sh.score(s.score);fx(hit===need?'ok':'bad');
   btn.remove();cnt.remove();
   const head=`اكتشفت ${ar(hit)} من ${ar(need)}`+(wrong?`، و${ar(wrong)} اختيار لسطر سليم`:'');
   const fb=el('div','feedback '+(ok?'good':'miss'),`<strong>${head}</strong><p>${esc(it.w)}</p>${refLine(it)}`);
   fb.append(nextBtn(i===items.length-1,()=>{i++;q();}));sh.body.append(fb);scrollTo(fb);}
 }
 q();}

/* ===== محرك: المرونة (سؤال، ثم معلومة جديدة) ===== */
function runTwist(g,wk){const items=pickItems(g,wk?g.wn:g.n);const s=newSess(g,items.length,wk);const time=gTime(g);let i=0;const sh=shell(g,s);
 function q(){if(i>=items.length)return finish(s);const it=items[i];sh.prog(i);sh.body.innerHTML='';const st={};
  sh.body.append(el('div','qcard',`${qHead(it)}<p class="qtext">${esc(it.t)}</p>`));
  stage(1);
  function stage(n){const qs=n===1?it.q1:it.q2,os=n===1?it.o1:it.o2,ws=n===1?it.w1:it.w2;
   const box=el('div','stagebox');
   if(n===2)box.append(el('div','twist',`<span class="tag">${ic('info')} معلومة جديدة</span><p>${esc(it.tw)}</p>`));
   box.append(el('p','ask',`${n===1?'السؤال الأول':'السؤال الثاني'}: ${esc(qs)}`));
   const opts=shuffle(os.map((t,k)=>({t,ok:k===0})));const list=el('div','opts');let answered=false;
   opts.forEach((o,k)=>{const b=el('button','opt');b.textContent=o.t;b.style.animationDelay=(k*60)+'ms';o.b=b;b.onclick=()=>answer(o);list.append(b);});
   box.append(list);sh.body.append(box);if(n===2)scrollTo(box);
   const left=sh.timer(time,()=>answer(null));
   function answer(o){if(answered)return;answered=true;stopT();const rem=left();const good=!!(o&&o.ok);
    st[n]={good,rem};opts.forEach(x=>{x.b.disabled=true;if(x.ok)x.b.classList.add('ok');});
    if(good){s.score+=80+Math.ceil(rem)*2;fx('ok');}else{if(o)o.b.classList.add('bad');fx('bad');}
    sh.score(s.score);
    const fb=el('div','feedback '+(good?'good':'miss')+(n===1?' mini':''),`<strong>${good?'صحيح':(o?'ليست الإجابة الصحيحة':'انتهى الوقت')}</strong><p>${esc(ws)}</p>${n===2?refLine(it):''}`);
    if(n===1){const nb=el('button','btn primary block',ic('info')+' ظهرت معلومة جديدة');nb.onclick=()=>{nb.remove();stage(2);};fb.append(nb);}
    else{const p1=st[1].good?70+30*st[1].rem/time:0,p2=good?70+30*rem/time:0;const both=st[1].good&&good;if(both)s.correct++;
     s.res.push({k:it._k,ok:both,p:(p1+p2)/2,tf:1-(st[1].rem+rem)/(2*time),timed:1});
     fb.append(nextBtn(i===items.length-1,()=>{i++;q();}));}
    box.append(fb);scrollTo(fb);}
  }
 }
 q();}

function meetTop(back){const top=el('div','gtop');top.innerHTML=`<button class="iconbtn" aria-label="رجوع">${ic('back')}</button><div class="gtitle"><span class="gicon" style="--c:var(--teal)">${ic('users')}</span><div><b>نقاش الفريق</b><div class="gsub"><span class="lvpill mid">نشاط جماعي</span></div></div></div>`;top.querySelector('button').onclick=back;return top;}
function meetPool(topic){const hid=new Set(CFG.hidden||[]);
 const a=Q_FLEX.filter(x=>!hid.has(x.id)).map(x=>({tag:'موقف ميداني',subs:x.subs,src:x.src,topic:x.topic,t:x.t+' ثم: '+x.tw,ans:x.o2[0],w:x.w2,ref:x.ref}));
 const b=[...Q_INTEG,...Q_INIT,...Q_TEAM,...(CFG.custom||[]).filter(c=>['integ','init','team'].includes(c.skill))].filter(x=>!hid.has(x.id)).map(x=>({tag:'موقف',subs:x.subs,src:x.src,topic:x.topic,t:x.t,ans:x.o[0],w:x.w,ref:x.ref}));
 const all=a.concat(b);const f=topic?all.filter(x=>topic.startsWith('src:')?x.src===topic.slice(4):(x.subs||[]).includes(topic)):all;return f.length?f:all;}

function recordSkill(g,s){const t=today();
 const p=s.res.length?Math.round(s.res.reduce((a,r)=>a+r.p,0)/s.res.length):0;
 s.res.forEach(r=>{if(!r.k)return;const it=S.items[r.k]||{seen:0};it.seen++;it.last=t;it.miss=!r.ok;S.items[r.k]=it;});
 const k=S.sk[g.id]||{r:0,n:0,hist:[],acc:null,tf:null};const before=k.n?k.r:null;
 k.r=k.n?Math.round(k.r*.6+p*.4):p;k.n++;k.last=t;k.hist.push({d:t,p});if(k.hist.length>30)k.hist.shift();
 const timed=s.res.filter(r=>r.timed);
 if(timed.length){const acc=timed.filter(r=>r.ok).length/timed.length,tf=timed.reduce((a,r)=>a+r.tf,0)/timed.length;k.acc=k.acc==null?acc:k.acc*.6+acc*.4;k.tf=k.tf==null?tf:k.tf*.6+tf*.4;}
 S.sk[g.id]=k;const dp=S.dp[t]||{s:0,n:0};dp.s+=p;dp.n++;S.dp[t]=dp;
 return{p,before,after:k.r};}

  const bad=m=>{h.textContent=m;h.style.display='block';fx('bad');};
  if(!/^\d{4,}$/.test(a))return bad('الرمز يجب أن يكون ٤ أرقام أو أكثر');if(a!==c)return bad('الرمزان غير متطابقين');if(a==='1234')return bad('اختر رمزاً غير الرمز المبدئي');
  CFG.pin=pinHash(a);saveDraft('تغيّر الرمز');adminHome();};
 w.append(f);}

function dlFile(name,text,type){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
function buildPublished(src){const out=Object.assign({},CFG);delete out._draft;out.stamp=Date.now().toString(36);
 const open='<script type="application/json" id="mulhem-config">';const i=src.indexOf(open);if(i<0)return null;const j=src.indexOf('</'+'script>',i+open.length);if(j<0)return null;
 return src.slice(0,i+open.length)+JSON.stringify(out).replace(/</g,'\\u003c')+src.slice(j);}
function exportHTML(){const go=src=>{const html=buildPublished(src);if(!html){toast('تعذّر إنشاء الملف');return;}dlFile('siraj.html',html,'text/html');toast('نُزّل الملف المحدّث');};
 const fallback=()=>go(ORIGINAL_HTML);
 if(/^https?:/.test(location.protocol)){fetch(location.href.split('#')[0],{cache:'no-store'}).then(r=>r.ok?r.text():Promise.reject()).then(t=>t.includes('id="mulhem-config"')?go(t):fallback()).catch(fallback);}
 else fallback();}

if(location.hash==='#admin'){adminLogin();}else{home();}

</script>
