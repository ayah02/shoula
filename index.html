<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#0B2838">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="description" content="ملهم: تدريب يومي على مواقف الرقابة والتوطين، يحلل نقاط قوتك وضعفك ويختار تمرين الغد بناءً عليها.">
<title>ملهم</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23123B50'/%3E%3Cpath d='M12%201.5c.6%204.8%202.7%208.2%209%2010.5-6.3%202.3-8.4%205.7-9%2010.5-.6-4.8-2.7-8.2-9-10.5%206.3-2.3%208.4-5.7%209-10.5z' fill='%23F7C443' transform='translate(2.4 2.4) scale(.8)'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="touchicon" href="">
<script>try{var t=localStorage.getItem("mulhem_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* الألوان مستخلصة من الشعار */
  --navy:#123B50;
  --navy-deep:#0B2838;
  --navy-card:#16475F;
  --navy-raise:#1B5470;
  --green:#3DB672;
  --teal:#1C8C8E;
  --yellow:#F7C443;
  --orange:#F2922A;
  --ink:#F3F8FA;
  --muted:#A8C2CE;
  --faint:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.12);
  /* رموز الثيم */
  --bg:#0B2838;
  --on-ink:#0B2838;
  --track:rgba(255,255,255,.1);
  --line-strong:rgba(255,255,255,.3);
  --glass-top:rgba(11,40,56,.82);
  --glass-tab:rgba(22,71,95,.92);
  --glass-timer:rgba(11,40,56,.88);
  --step-bg:rgba(11,40,56,.45);
  --card-shadow:none;
  --tab-shadow:0 12px 30px rgba(0,0,0,.35);
  --glow-a:rgba(242,146,42,.16);--glow-b:rgba(28,140,142,.22);--glow-c:rgba(61,182,114,.14);
  --wk-a:var(--navy-raise);--wk-b:var(--navy-card);
  --t-yellow:#F7C443;--t-orange:#F2922A;--t-green:#3DB672;--t-teal:#3BB5B7;
  --c-pct:100%;
  --pill-base-bg:rgba(242,146,42,.18);--pill-base-fg:#FFC48A;
  --pill-mid-bg:rgba(28,140,142,.3);--pill-mid-fg:#8FE0E1;
  --pill-adv-bg:rgba(61,182,114,.22);--pill-adv-fg:#9BE6BC;
  color-scheme:dark;
  --radius:18px;
  --font:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: light){
 :root:not([data-theme="dark"]){
  --navy-deep:#F2F6F7;
  --navy-card:#FFFFFF;
  --navy-raise:#FFFFFF;
  --ink:#0F2A38;
  --muted:#4E6672;
  --faint:rgba(18,59,80,.06);
  --line:rgba(18,59,80,.14);
  --bg:#F2F6F7;
  --on-ink:#FFFFFF;
  --track:rgba(18,59,80,.1);
  --line-strong:rgba(18,59,80,.32);
  --glass-top:rgba(242,246,247,.86);
  --glass-tab:rgba(255,255,255,.94);
  --glass-timer:rgba(242,246,247,.92);
  --step-bg:#F4F8F9;
  --card-shadow:0 1px 2px rgba(15,42,56,.06),0 4px 14px rgba(15,42,56,.05);
  --tab-shadow:0 10px 28px rgba(15,42,56,.16);
  --glow-a:rgba(242,146,42,.12);--glow-b:rgba(28,140,142,.12);--glow-c:rgba(61,182,114,.10);
  --wk-a:#FFF7E3;--wk-b:#FFFFFF;
  --t-yellow:#9A6200;--t-orange:#B4530A;--t-green:#1D7444;--t-teal:#136A6C;
  --c-pct:72%;
  --pill-base-bg:rgba(242,146,42,.16);--pill-base-fg:#9A4A00;
  --pill-mid-bg:rgba(28,140,142,.14);--pill-mid-fg:#0F6466;
  --pill-adv-bg:rgba(61,182,114,.16);--pill-adv-fg:#1B6B3F;
  color-scheme:light;
 }
}
:root[data-theme="light"]{
  --navy-deep:#F2F6F7;
  --navy-card:#FFFFFF;
  --navy-raise:#FFFFFF;
  --ink:#0F2A38;
  --muted:#4E6672;
  --faint:rgba(18,59,80,.06);
  --line:rgba(18,59,80,.14);
  --bg:#F2F6F7;
  --on-ink:#FFFFFF;
  --track:rgba(18,59,80,.1);
  --line-strong:rgba(18,59,80,.32);
  --glass-top:rgba(242,246,247,.86);
  --glass-tab:rgba(255,255,255,.94);
  --glass-timer:rgba(242,246,247,.92);
  --step-bg:#F4F8F9;
  --card-shadow:0 1px 2px rgba(15,42,56,.06),0 4px 14px rgba(15,42,56,.05);
  --tab-shadow:0 10px 28px rgba(15,42,56,.16);
  --glow-a:rgba(242,146,42,.12);--glow-b:rgba(28,140,142,.12);--glow-c:rgba(61,182,114,.10);
  --wk-a:#FFF7E3;--wk-b:#FFFFFF;
  --t-yellow:#9A6200;--t-orange:#B4530A;--t-green:#1D7444;--t-teal:#136A6C;
  --c-pct:72%;
  --pill-base-bg:rgba(242,146,42,.16);--pill-base-fg:#9A4A00;
  --pill-mid-bg:rgba(28,140,142,.14);--pill-mid-fg:#0F6466;
  --pill-adv-bg:rgba(61,182,114,.16);--pill-adv-fg:#1B6B3F;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:var(--font);
  background:var(--navy-deep);
  color:var(--ink);
  min-height:100vh;
  line-height:1.7;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(600px 400px at 100% 0%, var(--glow-a), transparent 60%),
    radial-gradient(520px 420px at 0% 30%, var(--glow-b), transparent 60%),
    radial-gradient(500px 380px at 80% 100%, var(--glow-c), transparent 60%),
    var(--navy-deep);
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== الهيكل ===== */
.topbar{
  position:sticky;top:0;z-index:20;
  padding:calc(10px + var(--safe-t)) 16px 10px;
  background:var(--glass-top);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--faint);
}
.topbar-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:0}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--navy);display:grid;place-items:center;border:1px solid var(--line)}
.brand-mark svg{width:24px;height:24px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);line-height:1.2}
.chip{display:flex;align-items:center;gap:8px;background:var(--navy-card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.chip .streak{color:var(--t-orange);display:flex;align-items:center;gap:3px}
.chip .streak svg{width:15px;height:15px}

main{max-width:1040px;margin:0 auto;padding:18px 16px calc(110px + var(--safe-b))}
.narrow{max-width:680px;margin:0 auto}

.tabbar{
  position:fixed;z-index:30;left:50%;transform:translateX(-50%);
  bottom:calc(12px + var(--safe-b));
  display:flex;gap:4px;padding:6px;border-radius:999px;
  background:var(--glass-tab);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);box-shadow:var(--tab-shadow);
}
.tabbar button{display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.tabbar button.on{background:var(--ink);color:var(--on-ink)}

/* ===== عناصر عامة ===== */
.eyebrow{margin:0;color:var(--t-yellow);font-weight:600;font-size:14px}
h1{font-size:clamp(26px,5.4vw,40px);line-height:1.3;margin:6px 0 10px;font-weight:700;text-wrap:balance}
h2{font-size:20px;margin:28px 0 12px;font-weight:700}
.lead{color:var(--muted);margin:0;font-size:16px;max-width:56ch}
.muted{color:var(--muted)}
.card{background:var(--navy-card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--card-shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;font-weight:700;font-size:15px;transition:transform .12s, opacity .2s, background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--orange);color:#1b1205}
.btn.primary:disabled{opacity:.4}
.btn.ghost{background:var(--faint);border:1px solid var(--line)}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* ===== الرئيسية ===== */
.home-top{display:grid;gap:16px;grid-template-columns:1fr}
.level .lv-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.level .lv-name{font-size:22px;font-weight:700}
.level .lv-xp{color:var(--muted);font-size:13px}
.bar-wrap{height:10px;background:var(--track);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--yellow),var(--orange));transition:width .8s}
.lv-steps{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.lv-steps span.on{color:var(--t-yellow);font-weight:600}

.daily{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--navy-raise),var(--navy-card));}
.daily::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;left:-50px;top:-60px;background:radial-gradient(circle,rgba(247,196,67,.35),transparent 70%)}
.daily .tag{background:var(--yellow);color:#2a1d00}
.daily h3{margin:10px 0 4px;font-size:20px}
.daily p{margin:0 0 14px;color:var(--muted)}
.daily.done .tag{background:var(--green);color:#03210f}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--faint);color:var(--muted)}
.tag svg{width:14px;height:14px}

.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gcard{
  text-align:right;background:var(--navy-card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;display:flex;flex-direction:column;gap:10px;min-height:150px;position:relative;overflow:hidden;box-shadow:var(--card-shadow);
  transition:transform .15s,border-color .2s;
}
.gcard:hover{border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.gcard:active{transform:scale(.97)}
.gcard::before{content:"";position:absolute;inset:auto auto -40px -40px;width:120px;height:120px;border-radius:50%;background:var(--c);opacity:.12}
.gicon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) var(--c-pct),#0B2838)}
.gicon svg{width:22px;height:22px}
.gcard b{font-size:16px;line-height:1.4}
.gcard small{color:var(--muted);font-size:13px;line-height:1.5}
.gcard .best{margin-top:auto;font-size:12px;color:color-mix(in srgb,var(--c) var(--c-pct),#0B2838);font-weight:600}

.meet-card{display:flex;gap:14px;align-items:center;text-align:right;width:100%;margin-top:12px}
.meet-card .gicon{width:50px;height:50px}
.meet-card div{flex:1}
.meet-card b{display:block;font-size:17px}
.meet-card small{color:var(--muted)}

/* قائمة الألعاب */
.glist{display:grid;gap:12px}
.gitem{display:flex;gap:14px;text-align:right;align-items:flex-start;width:100%}
.gitem .gicon{width:48px;height:48px}
.gitem .txt{flex:1;min-width:0}
.gitem b{display:block;font-size:17px}
.gitem .s{color:var(--ink);opacity:.9;font-size:14px;margin:2px 0 6px}
.gitem .why{color:var(--muted);font-size:13px;border-right:3px solid var(--c);padding-right:10px;margin:0}
.gitem .meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* ===== شاشة اللعب ===== */
.gtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--faint);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.gtitle{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.gtitle .gicon{width:38px;height:38px;border-radius:11px}
.gtitle b{display:block;font-size:16px;line-height:1.3}
.x2{display:inline-block;font-size:11px;font-weight:700;color:#2a1d00;background:var(--yellow);padding:1px 8px;border-radius:99px;margin-top:2px}
.score{text-align:center;background:var(--navy-card);border:1px solid var(--line);border-radius:12px;padding:4px 12px;min-width:74px}
.score small{display:block;font-size:10px;color:var(--muted);line-height:1.3}
.score b{font-size:18px;color:var(--t-yellow);font-variant-numeric:tabular-nums}

.prog{display:flex;gap:6px;margin-bottom:10px}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--track)}
.prog i.done{background:var(--green)}
.prog i.now{background:var(--yellow)}

.timer{display:flex;align-items:center;gap:10px;margin:0 -16px 14px;padding:8px 16px;position:sticky;top:calc(59px + var(--safe-t));z-index:15;background:var(--glass-timer);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.timer .track{flex:1;height:10px;border-radius:9px;background:var(--track);overflow:hidden}
.tpill{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:99px;background:var(--navy-card);border:1.5px solid var(--teal);color:var(--ink);flex:none;transition:border-color .3s,background .3s}
.tpill svg{width:17px;height:17px;color:var(--t-teal)}
.tpill small{font-size:12px;color:var(--muted)}
.timer.low .tpill{border-color:var(--orange);background:rgba(242,146,42,.15)}
.timer.low .tpill svg{color:var(--t-orange)}
.timer .bar{height:100%;width:100%;background:var(--teal);transform-origin:right center;border-radius:9px;transition:transform .2s linear, background .3s}
.timer.low .bar{background:var(--orange)}
.timer .secs{font-weight:700;font-variant-numeric:tabular-nums;min-width:22px;text-align:center;font-size:18px;line-height:1}
.timer.low .secs{color:var(--t-orange);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}

.qcard{background:var(--navy-card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--card-shadow);margin-bottom:14px;animation:rise .35s ease both}
.qtext{font-size:18px;font-weight:600;margin:10px 0 0;line-height:1.75}
.constraint{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:rgba(247,196,67,.14);color:var(--t-yellow);font-weight:600;font-size:15px;display:flex;gap:8px;align-items:flex-start}
.constraint svg{margin-top:4px}
.center{text-align:center}
.big{font-size:30px;font-weight:700;margin:8px 0 2px;color:var(--t-yellow)}
.ask{margin:4px 0 10px;color:var(--muted);font-weight:600;font-size:14px}
.opts{display:grid;gap:10px;margin-bottom:14px}
.opt{
  text-align:right;width:100%;padding:14px 16px;border-radius:14px;
  background:var(--navy-raise);border:1.5px solid var(--line);box-shadow:var(--card-shadow);
  font-size:15px;line-height:1.7;white-space:pre-line;
  transition:border-color .2s, background .2s, transform .12s;
  animation:rise .35s ease both;
}
.opt:not(:disabled):hover{border-color:var(--line-strong)}
.opt:not(:disabled):active{transform:scale(.985)}
.opt.ok{border-color:var(--green);background:rgba(61,182,114,.16)}
.opt.bad{border-color:var(--orange);background:rgba(242,146,42,.14);animation:shake .35s}
.opt:disabled:not(.ok):not(.bad){opacity:.55}
.opt.order{display:flex;gap:12px;align-items:center}
.opt .num{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px dashed var(--line-strong);font-weight:700}
.opt.sel{border-color:var(--yellow)}
.opt.sel .num{background:var(--yellow);border-color:var(--yellow);color:#2a1d00}
.opt.ok .num{background:var(--green);border-color:var(--green);color:#03210f}
.opt.bad .num{border-color:var(--orange)}
.hint{margin:-4px 0 4px;font-size:13px;color:var(--t-orange);padding-right:6px}

.feedback{border-radius:var(--radius);padding:16px;margin:4px 0 16px;border:1px solid;animation:rise .3s ease both}
.feedback.good{border-color:rgba(61,182,114,.5);background:rgba(61,182,114,.1)}
.feedback.miss{border-color:rgba(242,146,42,.5);background:rgba(242,146,42,.08)}
.feedback strong{display:block;font-size:16px;margin-bottom:4px}
.feedback.good strong{color:var(--t-green)}
.feedback.miss strong{color:var(--t-orange)}
.feedback p{margin:0 0 14px;color:var(--ink);opacity:.92}

/* المستند */
.doc{background:#F7F4EC;color:#1d2a31;border-radius:14px;padding:6px 0 10px;margin-bottom:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:rise .35s ease both}
.doc-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:2px solid #e3dccb;margin-bottom:4px;font-size:15px}
.doc-h svg{color:var(--teal)}
.line{display:block;width:100%;text-align:right;padding:10px 16px;font-size:15px;color:#1d2a31;border-right:4px solid transparent;transition:background .15s}
.line:not(:disabled):hover{background:#efe9da}
.line.sel{background:#fde8cc;border-right-color:var(--orange)}
.line.ok{background:#dcf3e5;border-right-color:var(--green)}
.line.miss{background:#fff3d1;border-right-color:var(--yellow)}
.line.bad{background:#fbe0d3;border-right-color:#c2410c;text-decoration:line-through;text-decoration-color:rgba(194,65,12,.5)}
.line .why{display:block;font-size:13px;color:#43545c;margin-top:4px;text-decoration:none}
.line.miss .why::before{content:"فاتك: ";font-weight:700;color:#8a6300}
.line.ok .why::before{content:"أحسنت: ";font-weight:700;color:#1e7a47}
.counter{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 12px}

/* لماذا الخمسة */
.chain{display:grid;gap:0;margin:0 0 6px}
.link{display:flex;gap:12px;align-items:flex-start;position:relative;padding:0 0 14px;animation:rise .3s ease both}
.link::before{content:"";position:absolute;right:15px;top:32px;bottom:0;width:2px;background:var(--green);opacity:.5}
.link .lv{width:32px;height:32px;border-radius:50%;background:var(--green);color:#03210f;font-weight:700;display:grid;place-items:center;flex:none}
.link p{margin:3px 0 0;font-size:15px}
.link.root .lv{background:var(--yellow);color:#2a1d00}

/* الاستخدامات البديلة */
.ideaform{display:flex;gap:8px;margin-bottom:12px}
.ideaform input{flex:1;min-width:0;padding:13px 14px;border-radius:14px;background:var(--navy-raise);border:1.5px solid var(--line);outline:none;font-size:16px}
.ideaform input:focus{border-color:var(--yellow)}
.ideaform input.shake{animation:shake .35s;border-color:var(--orange)}
.meter{display:flex;gap:4px;margin-bottom:12px}
.meter i{flex:1;height:8px;border-radius:5px;background:var(--track);transition:background .3s}
.meter i.on{background:var(--yellow)}
.meter i.over{background:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:10px}
.chip-i{background:var(--navy-raise);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:14px;animation:pop .3s ease both}

/* اللغز */
.qs{display:grid;gap:8px;margin-bottom:8px}
.qbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:right;width:100%;padding:12px 14px;border-radius:12px;background:var(--navy-raise);border:1px solid var(--line);font-size:15px}
.qbtn .ans{min-width:62px;text-align:center;font-size:13px;padding:3px 10px;border-radius:99px;background:var(--faint);color:var(--muted)}
.qbtn .ans:empty::after{content:"اسأل"}
.qbtn.open{cursor:default}
.qbtn.yes .ans{background:var(--green);color:#03210f}
.qbtn.no .ans{background:var(--orange);color:#1b1205}
.qbtn.na .ans{background:var(--muted);color:var(--on-ink)}

/* النتيجة */
.result{text-align:center;padding-top:10px}
.ring{width:170px;height:170px;margin:10px auto 6px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .val b{font-size:40px;line-height:1;color:var(--t-yellow);font-variant-numeric:tabular-nums}
.ring .val small{color:var(--muted);font-size:13px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{background:var(--navy-card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;box-shadow:var(--card-shadow)}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.msg{font-size:17px;font-weight:600;max-width:40ch;margin:4px auto 0}
.lvlup{margin:16px auto;padding:12px 16px;border-radius:14px;background:linear-gradient(90deg,rgba(247,196,67,.18),rgba(242,146,42,.18));border:1px solid rgba(247,196,67,.4);font-weight:700;color:var(--t-yellow);max-width:420px}

/* الإنجازات */
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{text-align:center;padding:14px 8px;border-radius:16px;background:var(--navy-card);border:1px solid var(--line)}
.badge .bi{width:48px;height:48px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:var(--faint);color:var(--muted)}
.badge.on .bi{background:linear-gradient(135deg,var(--yellow),var(--orange));color:#2a1d00}
.badge b{display:block;font-size:13px}
.badge small{display:block;font-size:11px;color:var(--muted);line-height:1.5;margin-top:2px}
.badge:not(.on){opacity:.55}
.newbadges{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.newbadges .badge{width:120px;animation:pop .5s ease both}

.bests{display:grid;gap:8px}
.bestrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--navy-card);border:1px solid var(--line)}
.bestrow .gicon{width:34px;height:34px;border-radius:10px}
.bestrow .gicon svg{width:18px;height:18px}
.bestrow span{flex:1}
.bestrow b{color:var(--t-yellow);font-variant-numeric:tabular-nums}

/* الاجتماع */
.field{width:100%;padding:13px 14px;border-radius:14px;background:var(--navy-raise);border:1.5px solid var(--line);outline:none;resize:vertical;font-size:16px;line-height:1.7}
.field:focus{border-color:var(--yellow)}
.lbl{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
.seg{display:flex;background:var(--navy-raise);border-radius:14px;padding:4px;border:1px solid var(--line);margin-bottom:16px}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--on-ink)}
.devil{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(242,146,42,.22),rgba(247,196,67,.12));border:1px solid rgba(242,146,42,.45);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.devil .gicon{--c:var(--orange);width:48px;height:48px}
.devil small{display:block;color:var(--muted);font-size:13px}
.devil b{font-size:22px}
.clock{font-size:clamp(56px,16vw,96px);font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1;margin:14px 0 6px;color:var(--ink)}
.clock.low{color:var(--t-orange)}
.prompts{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:8px}
.prompts li{padding:10px 14px;border-radius:12px;background:var(--navy-card);border:1px solid var(--line);font-size:15px;display:flex;gap:10px}
.prompts li::before{content:"؟";color:var(--t-yellow);font-weight:700}

.toast{position:fixed;left:50%;top:calc(76px + var(--safe-t));transform:translate(-50%,-20px);opacity:0;z-index:50;background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;transition:all .3s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.install{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--muted)}
.install b{color:var(--ink)}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (min-width:760px){
  .home-top{grid-template-columns:1.3fr 1fr;align-items:start}
  .ggrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .glist{grid-template-columns:1fr 1fr}
  .badges{grid-template-columns:repeat(6,minmax(0,1fr))}
  .home-side{display:grid;gap:16px}
}
.home-side{display:grid;gap:16px}
.chip .xpn{color:var(--muted);font-weight:500}
.top-actions{display:flex;align-items:center;gap:8px;min-width:0}
.themebtn{width:38px;height:38px;border-radius:12px;background:var(--navy-card);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--ink);transition:transform .2s}
.themebtn:active{transform:rotate(-20deg) scale(.92)}
.themebtn svg{width:19px;height:19px}
html.theme-anim *{transition:background-color .35s,border-color .35s,color .35s!important}
@media (max-width:400px){.brand small{display:none}.chip{padding:6px 10px;gap:6px}}
@media (max-width:380px){
  .tabbar button{padding:10px 12px;font-size:13px}
  .gcard{padding:14px;min-height:140px}
  .stats{gap:6px}
}

/* ===== تمرين اليوم ===== */
.wk{background:linear-gradient(150deg,var(--wk-a),var(--wk-b));position:relative;overflow:hidden}
.wk::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;left:-70px;top:-80px;background:radial-gradient(circle,rgba(247,196,67,.28),transparent 70%);pointer-events:none}
.wk-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.wk .tag{background:var(--yellow);color:#2a1d00}
.wk.complete .tag{background:var(--green);color:#03210f}
.wk h3{margin:12px 0 2px;font-size:21px;line-height:1.4}
.wk-sub{margin:0;font-size:14px}
.wk .bar-wrap{margin:12px 0 12px}
.steps{display:grid;gap:8px;margin-bottom:14px;position:relative;z-index:1}
.step{display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:10px 12px;border-radius:14px;background:var(--step-bg);border:1.5px solid var(--line);transition:border-color .2s}
.step:not(.static):hover{border-color:var(--line-strong)}
.step.next{border-color:var(--yellow)}
.step .sn{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;border:1.5px solid var(--line-strong)}
.step.done .sn{background:var(--green);border-color:var(--green);color:#03210f}
.step.done .sn svg{width:16px;height:16px}
.step .gicon{width:36px;height:36px;border-radius:11px}
.step .gicon svg{width:18px;height:18px}
.step .st{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.45}
.step .st b{font-size:15px}
.step .st small{color:var(--muted);font-size:12.5px}
.step .sp{font-weight:700;color:var(--t-yellow);font-variant-numeric:tabular-nums}
.step.done .st b{opacity:.85}

.lvpill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--faint);color:var(--muted);white-space:nowrap}
.lvpill.base{background:var(--pill-base-bg);color:var(--pill-base-fg)}
.lvpill.mid{background:var(--pill-mid-bg);color:var(--pill-mid-fg)}
.lvpill.adv{background:var(--pill-adv-bg);color:var(--pill-adv-fg)}
.gcard .lvpill{margin-top:auto;align-self:flex-start}
.gsub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.gsub .x2{margin:0}

/* لمحة سريعة */
.qi{display:grid;gap:10px}
.qi-row{display:flex;align-items:center;gap:10px}
.qi-row b{flex:1;font-size:15px}
.qi-row .v{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.flag svg{width:14px;height:14px}
.flag.good{background:var(--pill-adv-bg);color:var(--pill-adv-fg)}
.flag.weak{background:var(--pill-base-bg);color:var(--pill-base-fg)}

/* النتيجة */
.delta{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px auto 0;padding:10px 14px;border-radius:14px;background:var(--navy-card);border:1px solid var(--line);max-width:440px;font-size:15px}
.delta svg{color:var(--t-yellow)}
.upc{color:var(--t-green);font-weight:700}
.downc{color:var(--t-orange);font-weight:700}
.coach{display:flex;gap:12px;align-items:flex-start;text-align:right;background:var(--navy-card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px}
.coach .ci{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(247,196,67,.16);color:var(--t-yellow)}
.coach.good .ci{background:rgba(61,182,114,.18);color:var(--t-green)}
.coach.weak .ci{background:rgba(242,146,42,.18);color:var(--t-orange)}
.coach b{display:block;font-size:16px;margin-bottom:2px}
.coach p{margin:0;color:var(--ink);opacity:.9;font-size:14.5px}
.coach .mini{display:flex;gap:14px;margin-top:8px;font-size:13px;color:var(--muted)}
.coach .mini b{display:inline;font-size:13px;color:var(--ink)}
.small{font-size:13px}
.card-h{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.card-h svg{color:var(--t-yellow)}

/* التحليل */
.heroN small{color:var(--muted);font-weight:600}
.heroN .hn{display:block;font-size:64px;line-height:1.1;color:var(--t-yellow);font-variant-numeric:tabular-nums;margin:4px 0}
.heroN p{margin:0}
.skills{display:grid;gap:16px}
.skh{display:flex;align-items:center;gap:8px}
.skn{flex:1;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.sdot{width:10px;height:10px;border-radius:3px;flex:none}
.skv{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.tr{font-size:11px}
.skbar{height:10px;border-radius:99px;background:var(--track);margin:7px 0 6px;overflow:hidden}
.skbar i{display:block;height:100%;border-radius:99px;background:var(--teal);transition:width .8s}
.skbar.empty{background:repeating-linear-gradient(135deg,var(--track) 0 6px,transparent 6px 12px)}
.skm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}

.chartwrap{position:relative}
.readout{margin:0 0 6px;font-size:14px;color:var(--muted);min-height:22px}
.readout b{color:var(--ink)}
.tchart{width:100%;max-width:620px;height:auto;display:block;touch-action:pan-y}
.tchart .grid{stroke:var(--track);stroke-width:1}
.tchart .ax{fill:var(--muted);font-size:10px;font-family:var(--font)}
.tchart .ln{fill:none;stroke:var(--teal);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tchart .pt{fill:var(--teal);stroke:var(--navy-card);stroke-width:2}
.tchart .hit{fill:transparent;cursor:pointer}
.tchart .cross{stroke:var(--line-strong);stroke-width:1;stroke-dasharray:3 3}
.dots-l{margin:12px 0 6px;font-size:12.5px;color:var(--muted)}
.dots{display:flex;gap:4px}
.dots span{flex:1;max-width:20px;aspect-ratio:1;border-radius:6px;background:var(--track)}
.dots span.part{background:rgba(28,140,142,.45)}
.dots span.on{background:var(--green)}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="brand-mark" id="brandMark"></span>
      <span>ملهم<small>تدريب الرقابة والتوطين</small></span>
    </div>
    <div class="top-actions"><button class="themebtn" id="themeBtn" type="button"></button><div class="chip" id="hdrChip"></div></div>
  </div>
</header>

<main id="main"><div id="noapp" style="max-width:520px;margin:40px auto;padding:20px;border-radius:18px;background:#16475F;border:1px solid rgba(255,255,255,.12);text-align:center;line-height:1.8">
<b style="font-size:20px;display:block;margin-bottom:6px">ملهم يحتاج يفتح في المتصفح</b>
<span style="color:#A8C2CE">يبدو أن الملف انفتح في معاينة لا تشغّل التطبيق. في أندرويد: اختر "فتح باستخدام Chrome". في الآيفون: اطلب رابط ملهم وافتحه في Safari.</span>
</div></main>

<nav class="tabbar" aria-label="التنقل">
  <button data-tab="home"></button>
  <button data-tab="games"></button>
  <button data-tab="me"></button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= أيقونات ================= */
const ICONS={
  zap:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v3"/><path d="M12 13h.01"/>',
  down:'<path d="M12 3v14"/><path d="m18 11-6 6-6-6"/><path d="M6 21h12"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  eye:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  spark:'<path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/><path d="M19 3v4"/><path d="M21 5h-4"/>',
  help:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
  award:'<circle cx="12" cy="8" r="6"/><path d="M15.5 12.9 17 22l-5-3-5 3 1.5-9.1"/>',
  back:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>',
  phone:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
  moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
const MARK_PATH='M12 1.5c.6 4.8 2.7 8.2 9 10.5-6.3 2.3-8.4 5.7-9 10.5-.6-4.8-2.7-8.2-9-10.5 6.3-2.3 8.4-5.7 9-10.5z';
document.getElementById('brandMark').innerHTML=`<svg viewBox="0 0 24 24"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7C443"/><stop offset=".45" stop-color="#F2922A"/><stop offset=".75" stop-color="#3DB672"/><stop offset="1" stop-color="#1C8C8E"/></linearGradient></defs><path d="${MARK_PATH}" fill="url(#fg)"/></svg>`;

/* أيقونة الشاشة الرئيسية للجوال */
(function(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#123B50';x.fillRect(0,0,180,180);
  const g=x.createLinearGradient(0,30,0,150);g.addColorStop(0,'#F7C443');g.addColorStop(.45,'#F2922A');g.addColorStop(.75,'#3DB672');g.addColorStop(1,'#1C8C8E');
  x.translate(24,24);x.scale(5.5,5.5);x.fillStyle=g;x.fill(new Path2D(MARK_PATH));
  document.getElementById('touchicon').href=c.toDataURL('image/png');}catch(e){}})();

/* ================= أدوات ================= */
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const ar=n=>Number(n).toLocaleString('ar-SA');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=(a,n)=>shuffle(a).slice(0,n);
const fx=t=>{try{navigator.vibrate&&navigator.vibrate(t==='bad'?[25,40,25]:12)}catch(e){}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200);}
const dkey=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const today=()=>dkey(new Date());
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dkey(d);};


/* ================= الوضع الداكن والفاتح ================= */
const mqLight=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;
const curTheme=()=>document.documentElement.getAttribute('data-theme')||(mqLight&&mqLight.matches?'light':'dark');
function paintThemeBtn(){const t=curTheme();const b=$('#themeBtn');
 b.innerHTML=ic(t==='dark'?'sun':'moon');
 const l=t==='dark'?'التبديل إلى الوضع الفاتح':'التبديل إلى الوضع الداكن';b.setAttribute('aria-label',l);b.title=l;
 $('#themeColor').setAttribute('content',t==='dark'?'#0B2838':'#F2F6F7');}
function setTheme(t){const h=document.documentElement;h.classList.add('theme-anim');h.setAttribute('data-theme',t);
 try{localStorage.setItem('mulhem_theme',t)}catch(e){}paintThemeBtn();setTimeout(()=>h.classList.remove('theme-anim'),400);}
$('#themeBtn').onclick=()=>setTheme(curTheme()==='dark'?'light':'dark');
if(mqLight&&mqLight.addEventListener)mqLight.addEventListener('change',paintThemeBtn);

/* ================= الحالة ================= */

const pd=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);};
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const addDays=(k,n)=>{const[y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n));};

function skLevel(id){const k=skOf(id);if(!k)return{name:'لم تُقيَّم',cls:'none',tm:1};if(k.r>=75)return{name:'متقدم',cls:'adv',tm:.8};if(k.r>=45)return{name:'متوسط',cls:'mid',tm:1};return{name:'تأسيسي',cls:'base',tm:1.25};}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967295;}

/* اختيار الأسئلة بالتكرار الذكي: ما أخطأت فيه يعود بعد يوم، والجديد قبل المكرر */
function pickItems(g,n){const t=today();
 const pr=i=>{const it=S.items[g.id+':'+i];const j=Math.random()*10;if(!it)return 50+j;const age=daysBetween(it.last,t);if(age<1)return -100+j;if(it.miss)return 80+Math.min(age,10)*3+j;return Math.min(age,30)*2+j;};
 return g.data.map((_,i)=>i).sort((a,b)=>pr(b)-pr(a)).slice(0,n).map(i=>Object.assign({_k:g.id+':'+i},g.data[i]));}

/* خطة اليوم: أضعف مهارة أولاً، ثم ما لم يُقيَّم، ثم ما يحتاج تقوية أو أُهمل، ثم نقطة قوة للحفاظ عليها */
function buildPlan(dk){
 const assessed=GAMES.filter(g=>skOf(g.id)).sort((a,b)=>S.sk[a.id].r-S.sk[b.id].r);
 const un=GAMES.filter(g=>!skOf(g.id)).sort((a,b)=>hash(dk+a.id)-hash(dk+b.id));
 const plan=[],why={};const add=(g,w)=>{if(g&&plan.length<3&&!plan.includes(g.id)){plan.push(g.id);why[g.id]=w;}};
 if(!assessed.length)un.forEach(g=>add(g,'قياس أوّلي لمستواك'));
 if(assessed.length>=2)add(assessed[0],`أضعف مهاراتك حالياً (${ar(S.sk[assessed[0].id].r)})`);
 un.forEach(g=>add(g,'مهارة لم تُقيَّم بعد'));
 if(plan.length<3){
  const rest=assessed.filter(g=>!plan.includes(g.id));const strongest=rest.length>1?rest[rest.length-1]:null;
  const pool=rest.filter(g=>g!==strongest).map(g=>{const k=S.sk[g.id];const st=Math.max(0,daysBetween(k.last,dk));return{g,k,st,sc:(100-k.r)+Math.min(st,10)*4+hash(dk+g.id)*6};}).sort((a,b)=>b.sc-a.sc);
  if(pool[0])add(pool[0].g,pool[0].st>=3?`لم تتدرب عليها منذ ${ar(pool[0].st)} أيام`:`تحتاج تقوية (${ar(pool[0].k.r)})`);
  if(strongest)add(strongest,`نقطة قوتك (${ar(S.sk[strongest.id].r)}): حافظ عليها`);
  pool.slice(1).forEach(x=>add(x.g,'للتنويع'));
 }
 return{plan,why,done:{}};}
function todayPlan(){const t=today();if(!S.days[t]){S.days[t]=buildPlan(t);save();}return S.days[t];}

/* ================= إطار اللعب ================= */
function newSess(g,total,wk){return{g,score:0,correct:0,total,res:[],wk};}
const gTime=g=>Math.round(g.time*skLevel(g.id).tm);

function shell(g,s){setTab(s.wk?'home':'games');const m=view();const wrap=el('div','narrow');m.append(wrap);
 const lv=skLevel(g.id);let wkTag='';
 if(s.wk){const d=todayPlan();wkTag=`<span class="x2">تمرين اليوم ${ar(d.plan.indexOf(g.id)+1)}/٣</span>`;}
 const top=el('div','gtop');
 top.innerHTML=`<button class="iconbtn" aria-label="رجوع">${ic('back')}</button><div class="gtitle"><span class="gicon" style="--c:var(--${g.color})">${ic(g.icon)}</span><div><b>${g.name}</b><div class="gsub">${wkTag}<span class="lvpill ${lv.cls}">${lv.name}</span></div></div></div><div class="score"><small>النقاط</small><b>٠</b></div>`;
 top.querySelector('button').onclick=()=>{stopT();s.wk?home():games();};
 const prog=el('div','prog');for(let k=0;k<s.total;k++)prog.append(el('i'));
 const tw=el('div','timer',`<span class="tpill">${ic('clock')}<span class="secs"></span><small>ث</small></span><div class="track"><div class="bar"></div></div>`);tw.style.visibility='hidden';
 const body=el('div','');
 wrap.append(top,prog,tw,body);
 return{body,
  prog:i=>[...prog.children].forEach((d,k)=>d.className=k<i?'done':k===i?'now':''),
  score:v=>{top.querySelector('.score b').textContent=ar(Math.round(v));},
  timer:(sec,end)=>timer(sec,tw,end),
  hideTimer:()=>{tw.style.display='none';}};}

function timer(sec,wrap,end){stopT();wrap.style.visibility='visible';const bar=wrap.querySelector('.bar'),tx=wrap.querySelector('.secs');const t0=Date.now();let left=sec;
 const tick=()=>{left=Math.max(0,sec-(Date.now()-t0)/1000);bar.style.transform=`scaleX(${left/sec})`;wrap.classList.toggle('low',left/sec<.25);tx.textContent=ar(Math.ceil(left));if(left<=0){stopT();end();}};
 tick();T=setInterval(tick,200);return()=>left;}

function nextBtn(last,fn){const b=el('button','btn primary block',last?'عرض النتيجة':'التالي');b.onclick=fn;return b;}
function scrollTo(e){setTimeout(()=>{try{e.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(x){}},60);}

/* ===== محرك: اختيار من متعدد ===== */
function runMCQ(g,wk){const items=pickItems(g,wk?g.wn:g.n);const s=newSess(g,items.length,wk);const time=gTime(g);let i=0;const sh=shell(g,s);
 function q(){if(i>=items.length)return finish(s);const it=items[i];sh.prog(i);sh.body.innerHTML='';
  sh.body.append(el('div','qcard',`${it.label?`<span class="tag">${it.label}</span>`:''}<p class="qtext">${it.t}</p>${it.sub?`<p class="constraint">${ic('lock')}<span>${it.sub}</span></p>`:''}`));
  sh.body.append(el('p','ask',g.prompt));
  const opts=shuffle(it.o.map((t,k)=>({t,ok:k===0})));const list=el('div','opts');let answered=false;
  opts.forEach((o,k)=>{const b=el('button','opt');b.textContent=o.t;b.style.animationDelay=(k*60)+'ms';o.b=b;b.onclick=()=>answer(o);list.append(b);});
  sh.body.append(list);
  const left=sh.timer(time,()=>answer(null));
  function answer(o){if(answered)return;answered=true;stopT();const rem=left();const good=!!(o&&o.ok);
   s.res.push({k:it._k,ok:good,p:good?70+30*rem/time:0,tf:1-rem/time,timed:1});
   opts.forEach(x=>{x.b.disabled=true;if(x.ok)x.b.classList.add('ok');});
   if(good){s.score+=100+Math.ceil(rem)*3;s.correct++;fx('ok');}else{if(o)o.b.classList.add('bad');fx('bad');}
   sh.score(s.score);
   const fb=el('div','feedback '+(good?'good':'miss'),`<strong>${good?'إجابة قوية':(o?'ليست الأقوى':'انتهى الوقت')}</strong><p>${it.w}</p>`);
   fb.append(nextBtn(i===items.length-1,()=>{i++;q();}));sh.body.append(fb);scrollTo(fb);}
 }
 q();}

/* ===== محرك: الترتيب (طوارئ) ===== */
function runOrder(g,wk){const items=pickItems(g,wk?g.wn:g.n);const s=newSess(g,items.length,wk);const time=gTime(g);let i=0;const sh=shell(g,s);
 function q(){if(i>=items.length)return finish(s);const it=items[i];sh.prog(i);sh.body.innerHTML='';
  sh.body.append(el('div','qcard',`<span class="tag">${ic('zap')} موقف ميداني</span><p class="qtext">${it.t}</p>`));
  sh.body.append(el('p','ask','اضغط على أول ٣ خطوات بالترتيب: ١ ثم ٢ ثم ٣. اضغط مرة ثانية للإلغاء.'));
  const opts=shuffle(it.o.map((t,k)=>({t,k})));const chosen=[];let done=false;const list=el('div','opts');
  const confirm=el('button','btn primary block','اعتمد الخطة');confirm.disabled=true;
  opts.forEach((o,k)=>{const b=el('button','opt order','<span class="num"></span><span class="t"></span>');b.querySelector('.t').textContent=o.t;b.style.animationDelay=(k*60)+'ms';o.b=b;
   b.onclick=()=>{if(done)return;const p=chosen.indexOf(o);if(p>-1)chosen.splice(p,1);else if(chosen.length<3)chosen.push(o);paint();fx('ok');};list.append(b);});
  function paint(){opts.forEach(o=>{const p=chosen.indexOf(o);o.b.classList.toggle('sel',p>-1);o.b.querySelector('.num').textContent=p>-1?ar(p+1):'';});confirm.disabled=chosen.length<3;}
  sh.body.append(list,confirm);
  const left=sh.timer(time,submit);confirm.onclick=submit;
  function submit(){if(done)return;done=true;stopT();const rem=left();let exact=0,part=0;
   chosen.forEach((o,p)=>{if(o.k===p)exact++;else if(o.k<3)part++;});
   const full=chosen.length===3;
   s.res.push({k:it._k,ok:exact===3,p:(exact*30+part*10)/90*85+(full?15*rem/time:0),tf:1-rem/time,timed:1});
   s.score+=exact*40+part*15+(full?Math.ceil(rem):0);if(exact===3)s.correct++;sh.score(s.score);fx(exact===3?'ok':'bad');
   opts.forEach(o=>{o.b.disabled=true;o.b.classList.remove('sel');const n=o.b.querySelector('.num');
    if(o.k<3){o.b.classList.add('ok');n.textContent=ar(o.k+1);}else if(chosen.includes(o)){o.b.classList.add('bad');n.textContent='✕';}else n.textContent='';});
   confirm.remove();
   const head=!full?'انتهى الوقت قبل اكتمال الخطة':exact===3?'ترتيب مثالي':`${ar(exact)} من ٣ في مكانها الصحيح`;
   const fb=el('div','feedback '+(exact===3?'good':'miss'),`<strong>${head}</strong><p>${it.w}</p>`);
   fb.append(nextBtn(i===items.length-1,()=>{i++;q();}));sh.body.append(fb);scrollTo(fb);}
 }
 q();}

/* ===== محرك: الخلل الخفي ===== */
function runSpot(g,wk){const items=pickItems(g,wk?g.wn:g.n);const s=newSess(g,items.length,wk);const time=gTime(g);let i=0;const sh=shell(g,s);
 function q(){if(i>=items.length)return finish(s);const it=items[i];sh.prog(i);sh.body.innerHTML='';let done=false;
  const need=it.l.filter(x=>x.e).length;
  sh.body.append(el('p','ask',`في هذا المستند ${ar(need)} أخطاء منطقية. اضغط على الأسطر الخاطئة ثم اضغط زر التحقق.`));
  const doc=el('div','doc');doc.append(el('div','doc-h',`${ic('file')}<b>${it.title}</b>`));
  const lines=it.l.map(x=>{const b=el('button','line');b.textContent=x.t;b.onclick=()=>{if(done)return;b.classList.toggle('sel');count();fx('ok');};doc.append(b);return{x,b};});
  const cnt=el('p','counter');
  function count(){cnt.textContent=`اخترت ${ar(lines.filter(l=>l.b.classList.contains('sel')).length)} من ${ar(need)}`;}
  count();
  const btn=el('button','btn primary block','تحقّق');
  sh.body.append(doc,cnt,btn);
  const left=sh.timer(time,submit);btn.onclick=submit;
  function submit(){if(done)return;done=true;stopT();const rem=left();let hit=0,wrong=0;
   lines.forEach(({x,b})=>{const sel=b.classList.contains('sel');b.disabled=true;b.classList.remove('sel');
    if(x.e&&sel){hit++;b.classList.add('ok');}else if(x.e)b.classList.add('miss');else if(sel){wrong++;b.classList.add('bad');}
    if(x.e){const w=el('span','why');w.textContent=x.e;b.append(w);}});
   const ok=hit===need&&!wrong;
   s.res.push({k:it._k,ok,p:Math.max(0,hit/need*85-wrong*12)+(hit?15*rem/time:0),tf:1-rem/time,timed:1});
   s.score+=Math.max(0,hit*60-wrong*20+(hit?Math.ceil(rem):0));if(ok)s.correct++;sh.score(s.score);fx(hit===need?'ok':'bad');
   btn.remove();cnt.remove();
   const head=`اكتشفت ${ar(hit)} من ${ar(need)}`+(wrong?`، و${ar(wrong)} اختيار لسطر سليم`:'');
   const fb=el('div','feedback '+(ok?'good':'miss'),`<strong>${head}</strong><p>${it.w}</p>`);
   fb.append(nextBtn(i===items.length-1,()=>{i++;q();}));sh.body.append(fb);scrollTo(fb);}
 }
 q();}

/* ===== محرك: لماذا الخمسة ===== */
function runWhys(g,wk){const it=pickItems(g,1)[0];const s=newSess(g,it.s.length,wk);const sh=shell(g,s);let i=0,miss=0;const tfs=[];
 const time=Math.round(30*skLevel(g.id).tm);
 sh.body.append(el('div','qcard',`<span class="tag">المشكلة</span><p class="qtext">${it.p}</p>`));
 sh.body.append(el('p','ask',`لكل مستوى ${ar(time)} ثانية. إذا انتهى الوقت نكشف لك السبب الأعمق وننتقل.`));
 const chain=el('div','chain');const stage=el('div','');sh.body.append(chain,stage);
 const HINT=['','هذا لوم لشخص وليس سبباً. اللوم يوقف التفكير قبل الوصول للجذر.','هذا إعادة وصف للمشكلة بكلمات أخرى، ولم يقرّبك من السبب.'];
 function addLink(t){const ln=el('div','link'+(i===it.s.length-1?' root':''),`<span class="lv">${ar(i+1)}</span><p></p>`);ln.querySelector('p').textContent=t;chain.append(ln);}
 function step(){sh.prog(i);stage.innerHTML='';if(i>=it.s.length)return end();
  let tried=false,locked=false;
  stage.append(el('p','ask',`لماذا حدث ذلك؟ (${ar(i+1)} من ${ar(it.s.length)})`));
  const opts=shuffle(it.s[i].map((t,k)=>({t,k})));const list=el('div','opts');
  const left=sh.timer(time,timeout);
  opts.forEach((o,k)=>{const b=el('button','opt');b.textContent=o.t;b.style.animationDelay=(k*60)+'ms';o.b=b;
   b.onclick=()=>{if(locked)return;
    if(o.k===0){locked=true;stopT();const rem=left();tfs.push(1-rem/time);fx('ok');s.score+=(tried?30:60)+Math.ceil(rem);if(!tried)s.correct++;sh.score(s.score);addLink(o.t);i++;step();}
    else{fx('bad');if(!tried)miss++;tried=true;s.score=Math.max(0,s.score-15);sh.score(s.score);b.disabled=true;b.classList.add('bad');b.after(el('p','hint',HINT[o.k]));}};
   list.append(b);});
  stage.append(list);scrollTo(stage);
  function timeout(){if(locked)return;locked=true;if(!tried)miss++;tfs.push(1);fx('bad');
   opts.forEach(o=>{o.b.disabled=true;if(o.k===0)o.b.classList.add('ok');});
   const n=el('p','hint','انتهى الوقت. هذا هو السبب الأعمق، ننتقل للمستوى التالي.');list.after(n);
   setTimeout(()=>{addLink(opts.find(o=>o.k===0).t);i++;step();},1600);}
 }
 function end(){stopT();const tf=tfs.length?tfs.reduce((a,b)=>a+b,0)/tfs.length:1;
  s.res.push({k:it._k,ok:miss===0,p:s.correct/s.total*85+(1-tf)*15,tf,timed:1});
  const fb=el('div','feedback good',`<strong>وصلت إلى الجذر</strong><p>${it.r}</p>`);fb.append(nextBtn(true,()=>finish(s)));stage.append(fb);scrollTo(fb);}
 step();}

/* ===== محرك: عصف ذهني ===== */
function runUses(g,wk){const obj=pickItems(g,1)[0];const s=newSess(g,1,wk);const sh=shell(g,s);let ideas=[];let done=false;
 sh.body.append(el('div','qcard',`<span class="tag">عصف ذهني</span><p class="qtext">${obj.n}</p><p class="muted" style="margin:8px 0 0">${obj.h}</p>`));
 sh.body.append(el('p','ask','اكتب أكبر عدد من الأفكار. الهدف ١٠ أفكار، ولا توجد إجابة خاطئة.'));
 const form=el('form','ideaform','<input type="text" placeholder="فكرة جديدة..." maxlength="80" autocomplete="off" enterkeyhint="send" aria-label="فكرة جديدة"><button class="btn primary" type="submit">أضف</button>');
 const input=form.querySelector('input');
 const meter=el('div','meter');for(let k=0;k<10;k++)meter.append(el('i'));
 const chips=el('div','chips');
 const fin=el('button','btn ghost block','أنهيت');fin.onclick=end;
 function bad(){input.classList.remove('shake');void input.offsetWidth;input.classList.add('shake');fx('bad');}
 form.onsubmit=e=>{e.preventDefault();if(done)return;const v=input.value.trim().replace(/\s+/g,' ');
  if(v.length<3)return bad();if(ideas.includes(v)){toast('هذه الفكرة مكتوبة مسبقاً');return bad();}
  ideas.push(v);const c=el('span','chip-i');c.textContent=v;chips.prepend(c);
  [...meter.children].forEach((d,k)=>{d.className=k<ideas.length?(ideas.length>=10?'over':'on'):'';});
  s.score=ideas.length*15+(ideas.length>=10?50:0);sh.score(s.score);fx('ok');
  if(ideas.length===10)toast('عشر أفكار! أي فكرة إضافية مكسب');
  input.value='';input.focus();};
 sh.body.append(form,meter,chips,fin);
 sh.timer(g.time,end);
 function end(){if(done)return;done=true;stopT();s.correct=ideas.length>=10?1:0;s.res.push({k:obj._k,ok:true,p:Math.min(100,ideas.length*10),timed:0});finish(s,{extra:`${ar(ideas.length)} فكرة`});}
 setTimeout(()=>{try{input.focus()}catch(e){}},300);}

/* ===== محرك: لغز نعم أو لا ===== */
function runPuzzle(g,wk){const it=pickItems(g,1)[0];const s=newSess(g,1,wk);const sh=shell(g,s);let asked=0,done=false,rem1=0;
 const time=Math.round(120*skLevel(g.id).tm),time2=20;
 const pot=()=>Math.max(40,160-asked*15);
 sh.body.append(el('div','qcard',`<span class="tag">اللغز</span><p class="qtext">${it.p}</p>`));
 sh.body.append(el('p','ask',`اسأل أسئلة إجابتها نعم أو لا، ثم اختر الحل. أمامك ${ar(Math.round(time/60*10)/10)} دقيقة، وكل سؤال يخصم من نقاطك.`));
 const qs=el('div','qs');
 it.q.forEach(([t,a])=>{const b=el('button','qbtn','<span class="t"></span><b class="ans"></b>');b.querySelector('.t').textContent=t;
  b.onclick=()=>{if(done||b.classList.contains('open'))return;asked++;b.classList.add('open',a==='نعم'?'yes':a==='لا'?'no':'na');b.querySelector('.ans').textContent=a;cnt();fx('ok');};qs.append(b);});
 const counter=el('p','counter');function cnt(){counter.textContent=`أسئلة مستخدمة: ${ar(asked)}، النقاط الممكنة الآن: ${ar(pot())}`;}cnt();
 const solve=el('button','btn primary block','أعرف الحل');
 sh.body.append(qs,counter,solve);
 const left1=sh.timer(time,()=>{toast('انتهى وقت الأسئلة، اختر الحل الآن');openSolve();});
 solve.onclick=openSolve;
 function openSolve(){if(done)return;done=true;rem1=left1();stopT();solve.remove();qs.querySelectorAll('button').forEach(b=>b.disabled=true);

const BADGES=[
 {id:'first',n:'البداية',d:'أكملت أول تمرين',ic:'check'},
 {id:'perfect',n:'دقة كاملة',d:'كل الإجابات صحيحة في تمرين',ic:'target'},
 {id:'workout',n:'يوم مكتمل',d:'أنهيت تمرين يوم كامل',ic:'dumbbell'},

function checkBadges(s,dayDone){const got=[];const add=id=>{if(!S.badges.includes(id)){S.badges.push(id);got.push(id);}};
 add('first');if(s.total&&s.correct===s.total)add('perfect');if(dayDone)add('workout');if(streakNow()>=3)add('streak');if(streakNow()>=7)add('week');if(GAMES.every(g=>skOf(g.id)))add('all');return got;}
function badgeEl(b,on){return el('div','badge'+(on?' on':''),`<div class="bi">${ic(b.ic)}</div><b>${b.n}</b><small>${b.d}</small>`);}

function recordSkill(g,s){const t=today();
 const p=s.res.length?Math.round(s.res.reduce((a,r)=>a+r.p,0)/s.res.length):0;
 s.res.forEach(r=>{if(!r.k)return;const it=S.items[r.k]||{seen:0};it.seen++;it.last=t;it.miss=!r.ok;S.items[r.k]=it;});
 const k=S.sk[g.id]||{r:0,n:0,hist:[],acc:null,tf:null};const before=k.n?k.r:null;
 k.r=k.n?Math.round(k.r*.6+p*.4):p;k.n++;k.last=t;k.hist.push({d:t,p});if(k.hist.length>30)k.hist.shift();
 const timed=s.res.filter(r=>r.timed);
 if(timed.length){const acc=timed.filter(r=>r.ok).length/timed.length,tf=timed.reduce((a,r)=>a+r.tf,0)/timed.length;k.acc=k.acc==null?acc:k.acc*.6+acc*.4;k.tf=k.tf==null?tf:k.tf*.6+tf*.4;}
 S.sk[g.id]=k;const dp=S.dp[t]||{s:0,n:0};dp.s+=p;dp.n++;S.dp[t]=dp;
 return{p,before,after:k.r};}

function finish(s,o={}){stopT();const g=s.g,t=today();

 const before=lvl(S.xp).i;

 w.append(el('p','msg',msg));
 const dl=el('div','delta');
 if(R.before==null)dl.innerHTML=`${ic('target')}<span>أول قياس لمهارة <b>${SK[g.id].n}</b>: <b>${ar(R.after)}</b> من ١٠٠</span>`;
 else{const df=R.after-R.before;dl.innerHTML=`${ic(df>=0?'trend':'target')}<span><b>${SK[g.id].n}</b>: ${ar(R.before)} ← <b>${ar(R.after)}</b> <span class="${df>0?'upc':df<0?'downc':''}">${df>0?'+'+ar(df):df<0?'−'+ar(-df):'بدون تغيير'}</span></span>`;}
 w.append(dl);

 if(R.p<60||R.p>=85){const tip=el('div','coach',`<span class="ci">${ic(R.p<60?'target':'up')}</span><div><b>${R.p<60?'نصيحة للتحسن':'استثمر قوتك'}</b><p>${R.p<60?SK[g.id].weak:SK[g.id].strong}</p></div>`);w.append(tip);}
 if(after.i>before)w.append(el('div','lvlup',`ارتقيت إلى مستوى ${after.name}`));
 if(nb.length){w.append(el('p','ask','إنجاز جديد'));const nbw=el('div','newbadges');nb.forEach(id=>nbw.append(badgeEl(BADGES.find(b=>b.id===id),true)));w.append(nbw);}

 else{const again=el('button','btn primary',ic('refresh')+' مرة أخرى');again.onclick=g.run;const back=el('button','btn ghost','كل التمارين');back.onclick=games;again.style.flex=back.style.flex='1';row.append(again,back);}
 w.append(row);

function trendChart(){const t=today();const days=[];for(let k=13;k>=0;k--){const dk=addDays(t,-k);const v=S.dp[dk];days.push({dk,v:v?Math.round(v.s/v.n):null,done:!!(S.days[dk]&&S.days[dk].complete)});}
 const W=340,H=150,L=10,R=34,Tp=12,B=26,iw=W-L-R,ih=H-Tp-B;
 const x=i=>W-R-(i/13)*iw; /* الزمن من اليمين لليسار، والمحور على اليمين */
 const y=v=>Tp+ih-(v/100)*ih;
 let path='',pen=false;days.forEach((d,i)=>{if(d.v==null){pen=false;return;}path+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(d.v).toFixed(1)+' ';pen=true;});
 const fmt=dk=>{const[yy,mm,dd]=dk.split('-').map(Number);try{return new Date(yy,mm-1,dd).toLocaleDateString('ar-SA-u-ca-gregory',{day:'numeric',month:'short'});}catch(e){return dk;}};
 let svg=`<svg viewBox="0 0 ${W} ${H}" class="tchart" role="img" aria-label="متوسط الأداء اليومي لآخر ١٤ يوماً">`;
 [0,50,100].forEach(v=>{svg+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${W-R+6}" y="${y(v)+4}" class="ax" text-anchor="end">${ar(v)}</text>`;});
 [[13,'end'],[6,'middle'],[0,'start']].forEach(([i,a])=>{svg+=`<text x="${x(i)}" y="${H-6}" class="ax" text-anchor="${a}">${fmt(days[i].dk)}</text>`;});
 svg+=`<path d="${path}" class="ln"/>`;
 days.forEach((d,i)=>{if(d.v!=null)svg+=`<circle cx="${x(i)}" cy="${y(d.v)}" r="4" class="pt"/>`;});
 days.forEach((d,i)=>{svg+=`<rect x="${x(i)-iw/26}" y="${Tp}" width="${iw/13}" height="${ih}" class="hit" data-i="${i}"/>`;});
 svg+=`<line class="cross" x1="0" x2="0" y1="${Tp}" y2="${Tp+ih}" style="display:none"/></svg>`;
 const wrap=el('div','chartwrap');const ro=el('p','readout');wrap.append(ro);wrap.insertAdjacentHTML('beforeend',svg);
 const cross=wrap.querySelector('.cross');
 const show=i=>{const d=days[i];ro.innerHTML=`<b>${fmt(d.dk)}</b>: ${d.v==null?'لا تمرين':`${ar(d.v)}٪ متوسط الأداء`}${d.done?'، تمرين اليوم مكتمل':''}`;cross.setAttribute('x1',x(i));cross.setAttribute('x2',x(i));cross.style.display='';};
 const lastI=[...days.keys()].reverse().find(i=>days[i].v!=null);
 const reset=()=>{cross.style.display='none';ro.innerHTML=lastI!=null?`آخر نشاط: <b>${fmt(days[lastI].dk)}</b>، ${ar(days[lastI].v)}٪`:'ابدأ أول تمرين ليظهر منحنى تقدمك';};
 wrap.querySelectorAll('.hit').forEach(r=>{r.addEventListener('pointerenter',()=>show(+r.dataset.i));r.addEventListener('click',()=>show(+r.dataset.i));});
 wrap.querySelector('svg').addEventListener('pointerleave',reset);reset();
 const dots=el('div','dots');days.forEach(d=>{const s=el('span',d.done?'on':d.v!=null?'part':'');s.title=fmt(d.dk);dots.append(s);});
 wrap.append(el('p','dots-l','أيام التمرين المكتمل خلال ١٤ يوماً'),dots);
 return wrap;}

 else if(tf<.55){t='سريع ومتسرّع';d='تجيب بسرعة لكن تفوتك تفاصيل. خذ ثانيتين لقراءة كل الخيارات قبل أن تختار.';}

 const sorted=[...GAMES].sort((a,b)=>{const ka=skOf(a.id),kb=skOf(b.id);if(!ka&&!kb)return 0;if(!ka)return 1;if(!kb)return -1;return kb.r-ka.r;});
 const strong=assessed.length>=3?[...assessed].sort((a,b)=>S.sk[b.id].r-S.sk[a.id].r).slice(0,2).map(g=>g.id):[];
 const weak=assessed.length>=3?[...assessed].sort((a,b)=>S.sk[a.id].r-S.sk[b.id].r).slice(0,2).map(g=>g.id):[];
 const card=el('div','card skills');
 sorted.forEach(g=>{const k=skOf(g.id);const lv=skLevel(g.id);const row=el('div','skrow');
  let flag='';if(strong.includes(g.id))flag=`<span class="flag good">${ic('up')} قوة</span>`;else if(weak.includes(g.id))flag=`<span class="flag weak">${ic('target')} ضعف</span>`;
  let trend='';if(k&&k.hist.length>=2){const h=k.hist;const df=h[h.length-1].p-h[h.length-2].p;trend=`<span class="tr ${df>0?'upc':df<0?'downc':''}">${df>0?'▲':df<0?'▼':''}</span>`;}
  row.innerHTML=`<div class="skh"><span class="skn"><span class="sdot" style="background:var(--${g.color})"></span>${SK[g.id].n}</span>${flag}<span class="skv">${k?ar(k.r):'—'}${trend}</span></div>
  <div class="skbar ${k?'':'empty'}"><i style="width:${k?Math.max(2,k.r):0}%"></i></div>
  <div class="skm"><span>${SK[g.id].d}</span><span class="lvpill ${lv.cls}">${lv.name}</span></div>`;
  row.title=k?`${SK[g.id].n}: ${k.r} من ١٠٠، ${k.n} جلسة`:'لم تُقيَّم بعد';
  card.append(row);});
 m.append(card);

 /* نقاط القوة والضعف بالتفصيل */
 if(assessed.length>=3){
  const sw=el('div','home-top');sw.style.marginTop='14px';
  const cs=el('div','card coach good');cs.innerHTML=`<span class="ci">${ic('up')}</span><div><b>نقاط قوتك: ${strong.map(id=>SK[id].n).join(' و')}</b><p>${SK[strong[0]].strong}</p></div>`;
  const cw=el('div','card coach weak');cw.innerHTML=`<span class="ci">${ic('target')}</span><div><b>ركّز على: ${weak.map(id=>SK[id].n).join(' و')}</b><p>${SK[weak[0]].weak}</p><p class="muted small">تمرين الغد سيتضمن «${G(weak[0]).name}» تلقائياً.</p></div>`;
  sw.append(cw,cs);m.append(sw);
 }else{
  m.append(el('div','card coach','<span class="ci">'+ic('target')+'</span><div><b>التحليل يكتمل بعد قياس ٣ مهارات</b><p>كل تمرين يومي يقيس مهارات جديدة حتى تكتمل الصورة خلال ٣ إلى ٤ أيام. بعدها يبدأ التمرين بالتركيز على ضعفك.</p></div>'));}
 const si=styleInsight();if(si){si.style.marginTop='14px';m.append(si);}

 m.append(el('h2','','تقدمك خلال أسبوعين'));
 const tc=el('div','card');tc.append(trendChart());m.append(tc);

 m.append(el('h2','',`خطة الغد`));
 const tp=el('div','card');tp.append(el('p','muted small','مبنية على تقييمك الحالي، وتتحدث تلقائياً مع كل تمرين.'));tp.append(planRows(buildPlan(addDays(today(),1)),false));m.append(tp);

 m.append(el('h2','','الأوسمة'));const bw=el('div','badges');BADGES.forEach(b=>bw.append(badgeEl(b,S.badges.includes(b.id))));m.append(bw);
 m.append(el('h2','','استخدمه كتطبيق'));
 m.append(el('div','card install',`${ic('phone')}<div><b>أضفه للشاشة الرئيسية</b><br>في الآيفون: افتح الرابط في Safari ثم زر المشاركة ثم "إضافة إلى الشاشة الرئيسية". في أندرويد: قائمة Chrome ثم "إضافة إلى الشاشة الرئيسية". سيفتح بملء الشاشة كتطبيق مستقل.</div>`));
 const rs=el('button','btn ghost','تصفير تقدّمي');rs.style.marginTop='20px';
 rs.onclick=()=>{if(confirm('سيتم حذف كل النقاط والتحليل والأوسمة. متأكد؟')){S={xp:0,games:0,best:{},plays:{},streak:0,last:null,badges:[],sk:{},items:{},days:{},dp:{}};save();analysis();toast('بدأت من جديد');}};
 m.append(rs);}

home();
</script>
