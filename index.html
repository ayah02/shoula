<style>
:root{
  /* الألوان مستخلصة من الشعار */
  --navy:#123B50;
  --navy-deep:#0B2838;
  --navy-card:#16475F;
  --navy-raise:#1B5470;
  --green:#3DB672;
  --teal:#1C8C8E;
  --yellow:#F7C443;
  --orange:#F2922A;
  --ink:#F3F8FA;
  --muted:#A8C2CE;
  --faint:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.12);
  /* رموز الثيم */
  --bg:#0B2838;
  --on-ink:#0B2838;
  --track:rgba(255,255,255,.1);
  --line-strong:rgba(255,255,255,.3);
  --glass-top:rgba(11,40,56,.82);
  --glass-tab:rgba(22,71,95,.92);
  --glass-timer:rgba(11,40,56,.88);
  --step-bg:rgba(11,40,56,.45);
  --card-shadow:none;
  --tab-shadow:0 12px 30px rgba(0,0,0,.35);
  --glow-a:rgba(242,146,42,.16);--glow-b:rgba(28,140,142,.22);--glow-c:rgba(61,182,114,.14);
  --wk-a:var(--navy-raise);--wk-b:var(--navy-card);
  --t-yellow:#F7C443;--t-orange:#F2922A;--t-green:#3DB672;--t-teal:#3BB5B7;
  --c-pct:100%;
  --pill-base-bg:rgba(242,146,42,.18);--pill-base-fg:#FFC48A;
  --pill-mid-bg:rgba(28,140,142,.3);--pill-mid-fg:#8FE0E1;
  --pill-adv-bg:rgba(61,182,114,.22);--pill-adv-fg:#9BE6BC;
  color-scheme:dark;
  --radius:18px;
  --font:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: light){
 :root:not([data-theme="dark"]){
  --navy-deep:#F2F6F7;

  --muted:#4E6672;

  --line:rgba(18,59,80,.14);

  --line-strong:rgba(18,59,80,.32);

  --glass-tab:rgba(255,255,255,.94);
  --glass-timer:rgba(242,246,247,.92);
  --step-bg:#F4F8F9;
  --card-shadow:0 1px 2px rgba(15,42,56,.06),0 4px 14px rgba(15,42,56,.05);
  --tab-shadow:0 10px 28px rgba(15,42,56,.16);
  --glow-a:rgba(242,146,42,.12);--glow-b:rgba(28,140,142,.12);--glow-c:rgba(61,182,114,.10);
  --wk-a:#FFF7E3;--wk-b:#FFFFFF;
  --t-yellow:#9A6200;--t-orange:#B4530A;--t-green:#1D7444;--t-teal:#136A6C;
  --c-pct:72%;

 }

  color:var(--ink);
  min-height:100vh;
  line-height:1.7;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(600px 400px at 100% 0%, var(--glow-a), transparent 60%),
    radial-gradient(520px 420px at 0% 30%, var(--glow-b), transparent 60%),
    radial-gradient(500px 380px at 80% 100%, var(--glow-c), transparent 60%),
    var(--navy-deep);
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== الهيكل ===== */
.topbar{
  position:sticky;top:0;z-index:20;
  padding:calc(10px + var(--safe-t)) 16px 10px;
  background:var(--glass-top);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--faint);
}
.topbar-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:0}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--navy);display:grid;place-items:center;border:1px solid var(--line)}
.brand-mark svg{width:24px;height:24px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);line-height:1.2}
.chip{display:flex;align-items:center;gap:8px;background:var(--navy-card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.chip .streak{color:var(--t-orange);display:flex;align-items:center;gap:3px}
.chip .streak svg{width:15px;height:15px}

main{max-width:1040px;margin:0 auto;padding:18px 16px calc(110px + var(--safe-b))}
.narrow{max-width:680px;margin:0 auto}

.tabbar{
  position:fixed;z-index:30;left:50%;transform:translateX(-50%);
  bottom:calc(12px + var(--safe-b));
  display:flex;gap:4px;padding:6px;border-radius:999px;
  background:var(--glass-tab);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);box-shadow:var(--tab-shadow);
}
.tabbar button{display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.tabbar button.on{background:var(--ink);color:var(--on-ink)}

/* ===== عناصر عامة ===== */
.eyebrow{margin:0;color:var(--t-yellow);font-weight:600;font-size:14px}
h1{font-size:clamp(26px,5.4vw,40px);line-height:1.3;margin:6px 0 10px;font-weight:700;text-wrap:balance}
h2{font-size:20px;margin:28px 0 12px;font-weight:700}
.lead{color:var(--muted);margin:0;font-size:16px;max-width:56ch}
.muted{color:var(--muted)}
.card{background:var(--navy-card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--card-shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;font-weight:700;font-size:15px;transition:transform .12s, opacity .2s, background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--orange);color:#1b1205}
.btn.primary:disabled{opacity:.4}
.btn.ghost{background:var(--faint);border:1px solid var(--line)}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* ===== الرئيسية ===== */
.home-top{display:grid;gap:16px;grid-template-columns:1fr}
.level .lv-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.level .lv-name{font-size:22px;font-weight:700}
.level .lv-xp{color:var(--muted);font-size:13px}
.bar-wrap{height:10px;background:var(--track);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--yellow),var(--orange));transition:width .8s}
.lv-steps{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.lv-steps span.on{color:var(--t-yellow);font-weight:600}

.daily{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--navy-raise),var(--navy-card));}
.daily::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;left:-50px;top:-60px;background:radial-gradient(circle,rgba(247,196,67,.35),transparent 70%)}
.daily .tag{background:var(--yellow);color:#2a1d00}
.daily h3{margin:10px 0 4px;font-size:20px}
.daily p{margin:0 0 14px;color:var(--muted)}
.daily.done .tag{background:var(--green);color:#03210f}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--faint);color:var(--muted)}
.tag svg{width:14px;height:14px}

.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gcard{
  text-align:right;background:var(--navy-card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;display:flex;flex-direction:column;gap:10px;min-height:150px;position:relative;overflow:hidden;box-shadow:var(--card-shadow);
  transition:transform .15s,border-color .2s;
}
.gcard:hover{border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.gcard:active{transform:scale(.97)}
.gcard::before{content:"";position:absolute;inset:auto auto -40px -40px;width:120px;height:120px;border-radius:50%;background:var(--c);opacity:.12}
.gicon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) var(--c-pct),#0B2838)}
.gicon svg{width:22px;height:22px}
.gcard b{font-size:16px;line-height:1.4}
.gcard small{color:var(--muted);font-size:13px;line-height:1.5}
.gcard .best{margin-top:auto;font-size:12px;color:color-mix(in srgb,var(--c) var(--c-pct),#0B2838);font-weight:600}

.meet-card{display:flex;gap:14px;align-items:center;text-align:right;width:100%;margin-top:12px}
.meet-card .gicon{width:50px;height:50px}
.meet-card div{flex:1}
.meet-card b{display:block;font-size:17px}
.meet-card small{color:var(--muted)}

/* قائمة الألعاب */
.glist{display:grid;gap:12px}
.gitem{display:flex;gap:14px;text-align:right;align-items:flex-start;width:100%}
.gitem .gicon{width:48px;height:48px}
.gitem .txt{flex:1;min-width:0}
.gitem b{display:block;font-size:17px}
.gitem .s{color:var(--ink);opacity:.9;font-size:14px;margin:2px 0 6px}
.gitem .why{color:var(--muted);font-size:13px;border-right:3px solid var(--c);padding-right:10px;margin:0}
.gitem .meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* ===== شاشة اللعب ===== */
.gtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--faint);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.gtitle{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.gtitle .gicon{width:38px;height:38px;border-radius:11px}
.gtitle b{display:block;font-size:16px;line-height:1.3}
.x2{display:inline-block;font-size:11px;font-weight:700;color:#2a1d00;background:var(--yellow);padding:1px 8px;border-radius:99px;margin-top:2px}
.score{text-align:center;background:var(--navy-card);border:1px solid var(--line);border-radius:12px;padding:4px 12px;min-width:74px}
.score small{display:block;font-size:10px;color:var(--muted);line-height:1.3}
.score b{font-size:18px;color:var(--t-yellow);font-variant-numeric:tabular-nums}

.prog{display:flex;gap:6px;margin-bottom:10px}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--track)}
.prog i.done{background:var(--green)}
.prog i.now{background:var(--yellow)}

.timer{display:flex;align-items:center;gap:10px;margin:0 -16px 14px;padding:8px 16px;position:sticky;top:calc(59px + var(--safe-t));z-index:15;background:var(--glass-timer);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.timer .track{flex:1;height:10px;border-radius:9px;background:var(--track);overflow:hidden}
.tpill{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:99px;background:var(--navy-card);border:1.5px solid var(--teal);color:var(--ink);flex:none;transition:border-color .3s,background .3s}
.tpill svg{width:17px;height:17px;color:var(--t-teal)}
.tpill small{font-size:12px;color:var(--muted)}
.timer.low .tpill{border-color:var(--orange);background:rgba(242,146,42,.15)}
.timer.low .tpill svg{color:var(--t-orange)}
.timer .bar{height:100%;width:100%;background:var(--teal);transform-origin:right center;border-radius:9px;transition:transform .2s linear, background .3s}
.timer.low .bar{background:var(--orange)}
.timer .secs{font-weight:700;font-variant-numeric:tabular-nums;min-width:22px;text-align:center;font-size:18px;line-height:1}
.timer.low .secs{color:var(--t-orange);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}

.qcard{background:var(--navy-card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--card-shadow);margin-bottom:14px;animation:rise .35s ease both}
.qtext{font-size:18px;font-weight:600;margin:10px 0 0;line-height:1.75}
.constraint{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:rgba(247,196,67,.14);color:var(--t-yellow);font-weight:600;font-size:15px;display:flex;gap:8px;align-items:flex-start}
.constraint svg{margin-top:4px}
.center{text-align:center}
.big{font-size:30px;font-weight:700;margin:8px 0 2px;color:var(--t-yellow)}
.ask{margin:4px 0 10px;color:var(--muted);font-weight:600;font-size:14px}
.opts{display:grid;gap:10px;margin-bottom:14px}
.opt{
  text-align:right;width:100%;padding:14px 16px;border-radius:14px;
  background:var(--navy-raise);border:1.5px solid var(--line);box-shadow:var(--card-shadow);
  font-size:15px;line-height:1.7;white-space:pre-line;
  transition:border-color .2s, background .2s, transform .12s;
  animation:rise .35s ease both;
}
.opt:not(:disabled):hover{border-color:var(--line-strong)}
.opt:not(:disabled):active{transform:scale(.985)}
.opt.ok{border-color:var(--green);background:rgba(61,182,114,.16)}
.opt.bad{border-color:var(--orange);background:rgba(242,146,42,.14);animation:shake .35s}
.opt:disabled:not(.ok):not(.bad){opacity:.55}
.opt.order{display:flex;gap:12px;align-items:center}
.opt .num{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px dashed var(--line-strong);font-weight:700}
.opt.sel{border-color:var(--yellow)}
.opt.sel .num{background:var(--yellow);border-color:var(--yellow);color:#2a1d00}
.opt.ok .num{background:var(--green);border-color:var(--green);color:#03210f}
.opt.bad .num{border-color:var(--orange)}
.hint{margin:-4px 0 4px;font-size:13px;color:var(--t-orange);padding-right:6px}

.feedback{border-radius:var(--radius);padding:16px;margin:4px 0 16px;border:1px solid;animation:rise .3s ease both}
.feedback.good{border-color:rgba(61,182,114,.5);background:rgba(61,182,114,.1)}
.feedback.miss{border-color:rgba(242,146,42,.5);background:rgba(242,146,42,.08)}
.feedback strong{display:block;font-size:16px;margin-bottom:4px}
.feedback.good strong{color:var(--t-green)}
.feedback.miss strong{color:var(--t-orange)}
.feedback p{margin:0 0 14px;color:var(--ink);opacity:.92}

/* المستند */
.doc{background:#F7F4EC;color:#1d2a31;border-radius:14px;padding:6px 0 10px;margin-bottom:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:rise .35s ease both}
.doc-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:2px solid #e3dccb;margin-bottom:4px;font-size:15px}
.doc-h svg{color:var(--teal)}
.line{display:block;width:100%;text-align:right;padding:10px 16px;font-size:15px;color:#1d2a31;border-right:4px solid transparent;transition:background .15s}
.line:not(:disabled):hover{background:#efe9da}
.line.sel{background:#fde8cc;border-right-color:var(--orange)}
.line.ok{background:#dcf3e5;border-right-color:var(--green)}
.line.miss{background:#fff3d1;border-right-color:var(--yellow)}
.line.bad{background:#fbe0d3;border-right-color:#c2410c;text-decoration:line-through;text-decoration-color:rgba(194,65,12,.5)}
.line .why{display:block;font-size:13px;color:#43545c;margin-top:4px;text-decoration:none}
.line.miss .why::before{content:"فاتك: ";font-weight:700;color:#8a6300}
.line.ok .why::before{content:"أحسنت: ";font-weight:700;color:#1e7a47}
.counter{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 12px}

/* لماذا الخمسة */
.chain{display:grid;gap:0;margin:0 0 6px}
.link{display:flex;gap:12px;align-items:flex-start;position:relative;padding:0 0 14px;animation:rise .3s ease both}
.link::before{content:"";position:absolute;right:15px;top:32px;bottom:0;width:2px;background:var(--green);opacity:.5}
.link .lv{width:32px;height:32px;border-radius:50%;background:var(--green);color:#03210f;font-weight:700;display:grid;place-items:center;flex:none}
.link p{margin:3px 0 0;font-size:15px}
.link.root .lv{background:var(--yellow);color:#2a1d00}

/* الاستخدامات البديلة */
.ideaform{display:flex;gap:8px;margin-bottom:12px}
.ideaform input{flex:1;min-width:0;padding:13px 14px;border-radius:14px;background:var(--navy-raise);border:1.5px solid var(--line);outline:none;font-size:16px}
.ideaform input:focus{border-color:var(--yellow)}
.ideaform input.shake{animation:shake .35s;border-color:var(--orange)}
.meter{display:flex;gap:4px;margin-bottom:12px}
.meter i{flex:1;height:8px;border-radius:5px;background:var(--track);transition:background .3s}
.meter i.on{background:var(--yellow)}
.meter i.over{background:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:10px}
.chip-i{background:var(--navy-raise);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:14px;animation:pop .3s ease both}

/* اللغز */
.qs{display:grid;gap:8px;margin-bottom:8px}
.qbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:right;width:100%;padding:12px 14px;border-radius:12px;background:var(--navy-raise);border:1px solid var(--line);font-size:15px}
.qbtn .ans{min-width:62px;text-align:center;font-size:13px;padding:3px 10px;border-radius:99px;background:var(--faint);color:var(--muted)}
.qbtn .ans:empty::after{content:"اسأل"}
.qbtn.open{cursor:default}
.qbtn.yes .ans{background:var(--green);color:#03210f}
.qbtn.no .ans{background:var(--orange);color:#1b1205}
.qbtn.na .ans{background:var(--muted);color:var(--on-ink)}

/* النتيجة */
.result{text-align:center;padding-top:10px}
.ring{width:170px;height:170px;margin:10px auto 6px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .val b{font-size:40px;line-height:1;color:var(--t-yellow);font-variant-numeric:tabular-nums}
.ring .val small{color:var(--muted);font-size:13px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{background:var(--navy-card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;box-shadow:var(--card-shadow)}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.msg{font-size:17px;font-weight:600;max-width:40ch;margin:4px auto 0}
.lvlup{margin:16px auto;padding:12px 16px;border-radius:14px;background:linear-gradient(90deg,rgba(247,196,67,.18),rgba(242,146,42,.18));border:1px solid rgba(247,196,67,.4);font-weight:700;color:var(--t-yellow);max-width:420px}

/* الإنجازات */
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{text-align:center;padding:14px 8px;border-radius:16px;background:var(--navy-card);border:1px solid var(--line)}
.badge .bi{width:48px;height:48px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:var(--faint);color:var(--muted)}
.badge.on .bi{background:linear-gradient(135deg,var(--yellow),var(--orange));color:#2a1d00}
.badge b{display:block;font-size:13px}
.badge small{display:block;font-size:11px;color:var(--muted);line-height:1.5;margin-top:2px}
.badge:not(.on){opacity:.55}
.newbadges{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.newbadges .badge{width:120px;animation:pop .5s ease both}

.bests{display:grid;gap:8px}
.bestrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--navy-card);border:1px solid var(--line)}
.bestrow .gicon{width:34px;height:34px;border-radius:10px}
.bestrow .gicon svg{width:18px;height:18px}
.bestrow span{flex:1}
.bestrow b{color:var(--t-yellow);font-variant-numeric:tabular-nums}

/* الاجتماع */
.field{width:100%;padding:13px 14px;border-radius:14px;background:var(--navy-raise);border:1.5px solid var(--line);outline:none;resize:vertical;font-size:16px;line-height:1.7}
.field:focus{border-color:var(--yellow)}
.lbl{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
.seg{display:flex;background:var(--navy-raise);border-radius:14px;padding:4px;border:1px solid var(--line);margin-bottom:16px}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--on-ink)}
.devil{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(242,146,42,.22),rgba(247,196,67,.12));border:1px solid rgba(242,146,42,.45);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.devil .gicon{--c:var(--orange);width:48px;height:48px}
.devil small{display:block;color:var(--muted);font-size:13px}
.devil b{font-size:22px}
.clock{font-size:clamp(56px,16vw,96px);font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1;margin:14px 0 6px;color:var(--ink)}
.clock.low{color:var(--t-orange)}
.prompts{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:8px}
.prompts li{padding:10px 14px;border-radius:12px;background:var(--navy-card);border:1px solid var(--line);font-size:15px;display:flex;gap:10px}
.prompts li::before{content:"؟";color:var(--t-yellow);font-weight:700}

.toast{position:fixed;left:50%;top:calc(76px + var(--safe-t));transform:translate(-50%,-20px);opacity:0;z-index:50;background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;transition:all .3s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.install{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--muted)}
.install b{color:var(--ink)}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (min-width:760px){
  .home-top{grid-template-columns:1.3fr 1fr;align-items:start}
  .ggrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .glist{grid-template-columns:1fr 1fr}
  .badges{grid-template-columns:repeat(6,minmax(0,1fr))}
  .home-side{display:grid;gap:16px}
}
.home-side{display:grid;gap:16px}
.chip .xpn{color:var(--muted);font-weight:500}
.top-actions{display:flex;align-items:center;gap:8px;min-width:0}
.themebtn{width:38px;height:38px;border-radius:12px;background:var(--navy-card);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--ink);transition:transform .2s}
.themebtn:active{transform:rotate(-20deg) scale(.92)}
.themebtn svg{width:19px;height:19px}
html.theme-anim *{transition:background-color .35s,border-color .35s,color .35s!important}
@media (max-width:400px){.brand small{display:none}.chip{padding:6px 10px;gap:6px}}
@media (max-width:380px){
  .tabbar button{padding:10px 12px;font-size:13px}
  .gcard{padding:14px;min-height:140px}
  .stats{gap:6px}
}

/* ===== تمرين اليوم ===== */
.wk{background:linear-gradient(150deg,var(--wk-a),var(--wk-b));position:relative;overflow:hidden}
.wk::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;left:-70px;top:-80px;background:radial-gradient(circle,rgba(247,196,67,.28),transparent 70%);pointer-events:none}
.wk-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.wk .tag{background:var(--yellow);color:#2a1d00}
.wk.complete .tag{background:var(--green);color:#03210f}
.wk h3{margin:12px 0 2px;font-size:21px;line-height:1.4}
.wk-sub{margin:0;font-size:14px}
.wk .bar-wrap{margin:12px 0 12px}
.steps{display:grid;gap:8px;margin-bottom:14px;position:relative;z-index:1}
.step{display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:10px 12px;border-radius:14px;background:var(--step-bg);border:1.5px solid var(--line);transition:border-color .2s}
.step:not(.static):hover{border-color:var(--line-strong)}
.step.next{border-color:var(--yellow)}
.step .sn{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;border:1.5px solid var(--line-strong)}
.step.done .sn{background:var(--green);border-color:var(--green);color:#03210f}
.step.done .sn svg{width:16px;height:16px}
.step .gicon{width:36px;height:36px;border-radius:11px}
.step .gicon svg{width:18px;height:18px}
.step .st{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.45}
.step .st b{font-size:15px}
.step .st small{color:var(--muted);font-size:12.5px}
.step .sp{font-weight:700;color:var(--t-yellow);font-variant-numeric:tabular-nums}
.step.done .st b{opacity:.85}

.lvpill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--faint);color:var(--muted);white-space:nowrap}
.lvpill.base{background:var(--pill-base-bg);color:var(--pill-base-fg)}
.lvpill.mid{background:var(--pill-mid-bg);color:var(--pill-mid-fg)}
.lvpill.adv{background:var(--pill-adv-bg);color:var(--pill-adv-fg)}
.gcard .lvpill{margin-top:auto;align-self:flex-start}
.gsub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.gsub .x2{margin:0}

/* لمحة سريعة */
.qi{display:grid;gap:10px}
.qi-row{display:flex;align-items:center;gap:10px}
.qi-row b{flex:1;font-size:15px}
.qi-row .v{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.flag svg{width:14px;height:14px}
.flag.good{background:var(--pill-adv-bg);color:var(--pill-adv-fg)}
.flag.weak{background:var(--pill-base-bg);color:var(--pill-base-fg)}

/* النتيجة */
.delta{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px auto 0;padding:10px 14px;border-radius:14px;background:var(--navy-card);border:1px solid var(--line);max-width:440px;font-size:15px}
.delta svg{color:var(--t-yellow)}
.upc{color:var(--t-green);font-weight:700}
.downc{color:var(--t-orange);font-weight:700}
.coach{display:flex;gap:12px;align-items:flex-start;text-align:right;background:var(--navy-card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px}
.coach .ci{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(247,196,67,.16);color:var(--t-yellow)}
.coach.good .ci{background:rgba(61,182,114,.18);color:var(--t-green)}
.coach.weak .ci{background:rgba(242,146,42,.18);color:var(--t-orange)}
.coach b{display:block;font-size:16px;margin-bottom:2px}
.coach p{margin:0;color:var(--ink);opacity:.9;font-size:14.5px}
.coach .mini{display:flex;gap:14px;margin-top:8px;font-size:13px;color:var(--muted)}
.coach .mini b{display:inline;font-size:13px;color:var(--ink)}
.small{font-size:13px}
.card-h{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.card-h svg{color:var(--t-yellow)}

/* التحليل */
.heroN small{color:var(--muted);font-weight:600}
.heroN .hn{display:block;font-size:64px;line-height:1.1;color:var(--t-yellow);font-variant-numeric:tabular-nums;margin:4px 0}
.heroN p{margin:0}
.skills{display:grid;gap:16px}
.skh{display:flex;align-items:center;gap:8px}
.skn{flex:1;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.sdot{width:10px;height:10px;border-radius:3px;flex:none}
.skv{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.tr{font-size:11px}
.skbar{height:10px;border-radius:99px;background:var(--track);margin:7px 0 6px;overflow:hidden}
.skbar i{display:block;height:100%;border-radius:99px;background:var(--teal);transition:width .8s}
.skbar.empty{background:repeating-linear-gradient(135deg,var(--track) 0 6px,transparent 6px 12px)}
.skm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}

.chartwrap{position:relative}
.readout{margin:0 0 6px;font-size:14px;color:var(--muted);min-height:22px}
.readout b{color:var(--ink)}
.tchart{width:100%;max-width:620px;height:auto;display:block;touch-action:pan-y}
.tchart .grid{stroke:var(--track);stroke-width:1}
.tchart .ax{fill:var(--muted);font-size:10px;font-family:var(--font)}
.tchart .ln{fill:none;stroke:var(--teal);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tchart .pt{fill:var(--teal);stroke:var(--navy-card);stroke-width:2}
.tchart .hit{fill:transparent;cursor:pointer}
.tchart .cross{stroke:var(--line-strong);stroke-width:1;stroke-dasharray:3 3}
.dots-l{margin:12px 0 6px;font-size:12.5px;color:var(--muted)}
.dots{display:flex;gap:4px}
.dots span{flex:1;max-width:20px;aspect-ratio:1;border-radius:6px;background:var(--track)}
.dots span.part{background:rgba(28,140,142,.45)}
.dots span.on{background:var(--green)}

/* ===== المراجع والمصادر ===== */
.qmeta{display:flex;flex-wrap:wrap;gap:6px}
.qmeta.solo{margin-bottom:8px}
.tag.src{background:rgba(28,140,142,.16);color:var(--t-teal)}
.ref{display:flex;gap:8px;align-items:flex-start;margin:-6px 0 14px;padding:10px 12px;border-radius:12px;background:var(--faint);border:1px dashed var(--line-strong);font-size:13.5px;color:var(--ink)}
.ref svg{width:17px;height:17px;margin-top:3px;color:var(--t-teal);flex:none}
.ref b{color:var(--t-teal)}
/* ===== المرونة ===== */
.stagebox{animation:rise .35s ease both}
.twist{border-radius:var(--radius);padding:14px 16px;margin:6px 0 14px;background:linear-gradient(135deg,rgba(247,196,67,.18),rgba(242,146,42,.10));border:1.5px solid rgba(247,196,67,.55)}
.twist .tag{background:var(--yellow);color:#2a1d00}
.twist p{margin:8px 0 0;font-size:16.5px;font-weight:600;line-height:1.75}
.feedback.mini p{margin-bottom:12px}
/* ===== فترة التركيز ===== */
.focusban{border-color:rgba(28,140,142,.55);background:linear-gradient(135deg,rgba(28,140,142,.16),transparent 70%),var(--navy-card);display:grid;gap:14px}
.fb-item b{display:block;font-size:18px;margin:8px 0 6px}
.fb-item p{margin:8px 0 4px;font-size:14px}
.focusban .tag{background:var(--teal);color:#fff}
.chips-s{display:flex;flex-wrap:wrap;gap:6px}
.chips-s span{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--faint);border:1px solid var(--line);color:var(--ink)}
/* ===== المصادر في التحليل ===== */
.srcs{display:grid;gap:10px}
.srow{display:flex;align-items:center;gap:10px;font-size:14.5px}
.srow svg{color:var(--t-teal)}
.srow span{flex:1}
.srow b{font-variant-numeric:tabular-nums}
.srcs p{margin:4px 0 0}
/* ===== الإدارة ===== */
.admin .seg{margin:12px 0 14px}
.draftban{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(247,196,67,.14);border:1px solid rgba(247,196,67,.45);font-size:13.5px;margin-bottom:4px}
.draftban svg{color:var(--t-yellow);margin-top:2px}
.alist{display:grid;gap:10px;margin-top:12px}
.arow-h,.qrow-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.arow-h b{flex:1;font-size:16px}
.arow p{margin:6px 0}
.arow .row{margin-top:10px}
.empty{display:flex;gap:12px;align-items:center;color:var(--muted)}
.empty p{margin:0}
.aform .card-h{margin-bottom:6px}
.aform .field{margin-bottom:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .lbl{margin-top:12px}
.afilters{display:grid;gap:10px;margin-bottom:12px}
.afilters .two{gap:8px}
select.field{appearance:auto;padding:11px 12px;font-size:14.5px}
.field.ok{border-color:rgba(61,182,114,.6)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.pickchips{display:flex;flex-wrap:wrap;gap:8px}
.pick{padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--navy-raise);font-size:13.5px;font-weight:600;color:var(--muted)}
.pick.on{border-color:var(--teal);background:rgba(28,140,142,.18);color:var(--ink)}
.qrow{padding:14px}
.qrow.off{opacity:.6}
.qrow-t{margin:8px 0 4px;font-size:14.5px;line-height:1.7}
.qrow-a{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;margin-left:auto}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch span{width:40px;height:24px;border-radius:99px;background:var(--track);position:relative;transition:background .2s;flex:none}
.switch span::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(-16px)}
.switch input:focus-visible+span{outline:2px solid var(--yellow);outline-offset:2px}
.switch em{font-style:normal;color:var(--muted);min-width:34px}
.qprev{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--faint);border:1px solid var(--line)}
.qprev ol,.qprev ul{margin:0 0 8px;padding-right:22px;list-style-type:arabic-indic;font-size:13.5px;display:grid;gap:4px}
.qprev li.ok{color:var(--t-green);font-weight:600}
.qprev li.bad{color:var(--t-orange)}
.qprev small{color:var(--muted)}
.note ul{margin:0;padding-right:18px;display:grid;gap:8px}
@media (max-width:420px){.two{grid-template-columns:1fr}.two .lbl{margin-top:10px}}
.qprev ul{list-style-type:disc}
/* ===== إدارة مبسطة ===== */
.alertcard{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:var(--radius);margin:4px 0 12px;border:1.5px solid}
.alertcard>svg{width:22px;height:22px;flex:none;margin-top:2px}
.alertcard>div{flex:1;min-width:180px}
.alertcard b{display:block;font-size:15.5px}
.alertcard p{margin:4px 0 0;font-size:13.5px}
.alertcard.warn{background:rgba(247,196,67,.13);border-color:rgba(247,196,67,.5)}
.alertcard.warn>svg{color:var(--t-yellow)}
.alertcard.ok{background:rgba(61,182,114,.12);border-color:rgba(61,182,114,.45)}
.alertcard.ok>svg{color:var(--t-green)}
.alertcard .btn{align-self:center}
.small-lead{font-size:15px;font-weight:600;color:var(--ink);margin:14px 0 10px}
.bigact{display:flex;align-items:center;gap:14px;width:100%;text-align:right;margin-bottom:10px;padding:16px;transition:border-color .2s,transform .12s}
.bigact:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.bigact:active{transform:scale(.985)}
.bigact .gicon{width:52px;height:52px;border-radius:15px}
.bigact .gicon svg{width:26px;height:26px}
.bigact>div{flex:1;min-width:0}
.bigact b{display:block;font-size:17px}
.bigact p{margin:2px 0 6px;font-size:13.5px;color:var(--muted);line-height:1.6}
.bigact small{display:inline-block;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--faint);border:1px solid var(--line);padding:2px 10px;border-radius:99px}
.bigact .chev{transform:scaleX(-1);color:var(--muted)}
.helpbox{margin-top:14px}
.helpbox summary{cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px;list-style:none}
.helpbox summary::-webkit-details-marker{display:none}
.helpbox summary svg{color:var(--t-teal)}
.helpbox ol{margin:12px 0 0;padding-right:22px;list-style-type:arabic-indic;display:grid;gap:8px;font-size:14px}
.helpbox.note b{display:flex;align-items:center;gap:8px}
.astep{margin-bottom:12px}
.stephead{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.stepn{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--yellow);color:#2a1d00;font-weight:700}
.stephead b{display:block;font-size:16px;line-height:1.5}
.stephead small{display:block;color:var(--muted);font-size:13px;line-height:1.6;margin-top:2px}
.moresrc{margin-top:12px}
.moresrc summary{cursor:pointer;color:var(--t-teal);font-size:13.5px;font-weight:600;margin-bottom:10px}
.countline{display:flex;align-items:center;gap:6px;margin:12px 0 0;font-size:14px;color:var(--muted)}
.countline svg{width:18px;height:18px}
.countline.good{color:var(--t-green)}
.countline b{color:var(--ink)}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.presets .pick{padding:9px 16px;font-size:14px}
.dates{margin-top:6px}
.preview{margin-top:4px}
.field.big{font-size:22px;letter-spacing:6px;text-align:center}
.kchips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 8px;scrollbar-width:none}
.kchips::-webkit-scrollbar{display:none}
.kchips .pick{white-space:nowrap;flex:none}
.msgbox{padding:12px 14px;border-radius:12px;background:var(--faint);border:1px dashed var(--line-strong);font-size:14px;line-height:1.8;margin-bottom:10px}
.chlist{margin:0;padding-right:20px;display:grid;gap:6px;font-size:14.5px}
.qpreview{margin-bottom:12px}
.qpreview .opt{cursor:default}
.okc{color:var(--t-green)}
.okc svg{width:15px;height:15px;vertical-align:-2px}
.howto{margin:0;padding:0;list-style:none;counter-reset:h;display:grid;gap:12px}
.howto li{counter-increment:h;display:grid;grid-template-columns:32px 1fr;gap:2px 12px}
.howto li::before{content:counter(h,arabic-indic);grid-row:span 2;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff;font-weight:700}
.howto b{font-size:15px}
.howto span{font-size:13.5px;color:var(--muted);line-height:1.6}
.devil small+b+small{margin-top:2px}
.srctabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.srctab{display:flex;align-items:center;gap:8px;text-align:right;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--navy-raise);position:relative}
.srctab svg{width:18px;height:18px;color:var(--t-teal);flex:none}
.srctab span{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.srctab b{font-size:13.5px}
.srctab small{font-size:11.5px;color:var(--muted)}
.srctab.on{border-color:var(--teal);background:rgba(28,140,142,.16)}
.srctab .dot{position:absolute;top:8px;left:8px;width:8px;height:8px;border-radius:50%;background:var(--green);display:none}
.srctab.has .dot{display:block}
.subbox .lbl{margin-top:4px}
.pick em{font-style:normal;font-size:11.5px;opacity:.7;margin-right:4px}
.pick.all{border-style:dashed}
.pick:disabled{opacity:.45;cursor:default}
.pickedsum{margin-top:12px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pickedsum span{background:rgba(28,140,142,.16);border:1px solid rgba(28,140,142,.4);padding:2px 10px;border-radius:99px;font-weight:600}
.admin>select.field{margin-bottom:8px}
/* ===== كل المواضيع ===== */
.subsearch{margin:2px 0 10px}
.subbox .grp{margin:14px 0 8px;font-size:12.5px;font-weight:700;color:var(--t-teal);letter-spacing:.2px}
.pick small.no{font-size:11px;font-weight:700;color:var(--t-teal);margin-left:6px;padding:1px 6px;border-radius:6px;background:rgba(28,140,142,.14)}
.pick.zero{border-style:dashed;color:var(--muted)}
.pick.zero em{opacity:.85;font-size:11px}
.pick.zero.on{color:var(--ink)}
.newsub{margin-top:14px}
.newsub-box{margin-top:6px;padding:12px;border-radius:12px;border:1px dashed var(--line-strong);background:var(--faint)}
.newsub-box .row{margin-top:8px}
.zerowarn .alertcard{margin:12px 0 0}
.zerorow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.zerorow p{margin:0;display:flex;align-items:center;gap:6px;color:var(--t-yellow)}
.zerorow p svg{width:16px;height:16px}
/* ===== لوحة المتابعة ===== */
.admin.dash{max-width:1080px}
.dtool{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
.dtool .sp{flex:1}
.dtool p{margin:0}
.dtool .field{flex:1;min-width:160px;padding:10px 12px;font-size:15px}
.dtool select.field{flex:0 1 210px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;text-align:start;font:inherit;color:inherit}
button.kpi{cursor:pointer}
button.kpi:hover{border-color:var(--line-strong)}
.kpi .gicon{width:34px;height:34px;border-radius:10px;margin-bottom:6px}
.kpi b{font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span:not(.gicon){font-weight:700;font-size:14px}
.kpi small{color:var(--muted);font-size:12px;line-height:1.5}
.kpi.t1 .gicon{--c:var(--teal)}.kpi.t2 .gicon{--c:var(--orange)}.kpi.t3 .gicon{--c:var(--green)}.kpi.t4 .gicon{--c:var(--yellow)}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.dash h3{display:flex;align-items:center;gap:8px;font-size:16.5px;margin:0 0 4px}
.dash h3 svg{width:20px;height:20px;color:var(--t-teal)}
.dash .card>p.muted.small{margin:0 0 12px}
.cbar{display:grid;grid-template-columns:minmax(120px,1.25fr) 2fr 46px;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.cbar .cn{line-height:1.4}
.cbar>b{text-align:left;font-variant-numeric:tabular-nums}
.ctrack{position:relative;display:block;height:10px;border-radius:99px;background:var(--track);overflow:visible}
.cfill{position:absolute;top:0;bottom:0;right:0;border-radius:99px;background:var(--muted);transition:width .6s}
.cfill.base,.lg.base{background:var(--orange)}.cfill.mid,.lg.mid{background:var(--t-teal)}.cfill.adv,.lg.adv{background:var(--green)}
.cmark{position:absolute;top:-4px;bottom:-4px;width:3px;margin-right:-1.5px;border-radius:2px;background:var(--ink);opacity:.85}
em.tg{font-style:normal;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;margin-inline-start:4px;white-space:nowrap}
em.tg.adv{background:var(--pill-adv-bg);color:var(--pill-adv-fg)}em.tg.base{background:var(--pill-base-bg);color:var(--pill-base-fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 0 0;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:12px;height:8px;border-radius:99px}
.srow2{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.srow2:first-of-type{border-top:0}
.srow2 .st{flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px}
.srow2 .st b{font-size:14px;line-height:1.5}
.srow2 .st small{color:var(--muted);font-size:12px}
.srow2 .st .ctrack{height:7px;margin-top:4px}
.srow2 .pv{font-size:17px;min-width:44px;text-align:left;font-variant-numeric:tabular-nums}
.srow2.mini{padding:6px 0}.srow2.mini .pv{font-size:14px;color:var(--t-green)}
.subh{font-weight:700;font-size:13px;color:var(--muted);margin:14px 0 4px}
.chipsel{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:thin}
.chipbtn{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--navy-card);font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.chipbtn.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.tablewrap{overflow-x:auto;margin:0 -8px;padding:0 8px 4px}
.htable{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:13.5px;min-width:760px}
.htable th{font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 3px;text-align:center;white-space:nowrap}
.htable th:first-child{text-align:start}
.htable td{padding:6px 3px;text-align:center;vertical-align:middle}
.htable tbody tr{cursor:pointer}
.htable tbody tr:hover td.sticky,.htable tbody tr:focus td.sticky{color:var(--t-teal)}
.htable tbody tr:focus{outline:none}
.htable tbody tr:focus td{box-shadow:inset 0 -2px 0 var(--t-teal)}
.htable .sticky{position:sticky;right:0;background:var(--navy-card);z-index:1;text-align:start;min-width:170px}
.htable td.sticky{display:flex;align-items:center;gap:10px}
.nm{display:flex;flex-direction:column;line-height:1.35}.nm b{font-size:14px}.nm small{color:var(--muted);font-size:11.5px}
td.h{border-radius:8px;font-weight:700;min-width:46px;font-variant-numeric:tabular-nums;background:var(--faint);color:var(--muted)}
td.h.base{background:var(--pill-base-bg);color:var(--pill-base-fg)}td.h.mid{background:var(--pill-mid-bg);color:var(--pill-mid-fg)}td.h.adv{background:var(--pill-adv-bg);color:var(--pill-adv-fg)}
td.h+td.h{border-right:3px solid var(--navy-card)}
td.ld{font-size:12.5px;white-space:nowrap;color:var(--muted)}td.ld.idle{color:var(--t-orange);font-weight:700}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--t-teal) 26%,transparent);color:var(--ink);font-weight:700;font-size:12px;letter-spacing:-.5px}
.av.big{width:56px;height:56px;font-size:18px}
.flagnote{font-size:13px;margin:0 0 6px;color:var(--t-yellow)}
.linkbtn{color:var(--t-teal);font-weight:700;text-decoration:underline;font-size:13px}
.dempty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 18px}
.dempty svg{width:32px;height:32px;color:var(--t-teal)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--track);border-top-color:var(--t-teal);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dnote{margin-top:6px}
.emphead{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.emphead b{font-size:19px;display:block}.emphead small{color:var(--muted)}
.swcard .swi{padding:10px 0;border-top:1px solid var(--line)}
.swcard .swi:first-of-type{border-top:0}
.swh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.swi p{margin:6px 0 0;font-size:13.5px;color:var(--muted);line-height:1.7}
.swcard.good h3 svg{color:var(--t-green)}.swcard.bad h3 svg{color:var(--t-orange)}
.spark{display:flex;align-items:stretch;gap:5px;height:130px;margin-top:6px}
.spark .sc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.spark .sb{flex:1;width:100%;display:flex;align-items:flex-end}
.spark .sc i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--muted)}
.spark .sc i.base{background:var(--orange)}.spark .sc i.mid{background:var(--t-teal)}.spark .sc i.adv{background:var(--green)}.spark .sc i.off{background:var(--track)}
.spark .sc small{font-size:10.5px;color:var(--muted);height:14px}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.5;height:180px;white-space:pre;overflow:auto;text-align:left;margin-bottom:10px}
.astep ol{margin:6px 0 10px;padding-right:20px;display:grid;gap:6px;line-height:1.7}
.keyline code{display:inline-block;padding:6px 10px;border-radius:8px;background:var(--faint);font-size:14px;letter-spacing:.5px;user-select:all}
.ticks{margin:0 0 12px;padding-right:20px;display:grid;gap:6px;line-height:1.7}
.done-card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:14px}
.done-card .gicon{width:52px;height:52px}
/* رسالة الإدارة */
.noticeban{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;border:1.5px solid color-mix(in srgb,var(--t-teal) 55%,transparent);background:color-mix(in srgb,var(--t-teal) 12%,var(--navy-card))}
.noticeban .gicon{--c:var(--teal);flex:none;width:40px;height:40px}
.noticeban>div{flex:1}
.noticeban>div>small:first-child{display:block;font-weight:700;font-size:12px;color:var(--t-teal)}
.noticeban p{margin:4px 0;font-size:15px;line-height:1.75;font-weight:600}
.noticeban.warn{border-color:color-mix(in srgb,var(--orange) 60%,transparent);background:color-mix(in srgb,var(--orange) 12%,var(--navy-card))}
.noticeban.warn .gicon{--c:var(--orange)}.noticeban.warn>div>small:first-child{color:var(--t-orange)}
.noticeban .iconbtn{width:34px;height:34px;flex:none}
.admin .seg label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:10px;font-weight:600;cursor:pointer}
.admin .seg label:has(input:checked){background:var(--ink);color:var(--on-ink)}
.admin .seg input{accent-color:var(--orange)}
.pv-wrap .noticeban{margin:4px 0 0}
/* بيانات الموظف */
.mehero{text-align:center;display:flex;flex-direction:column;align-items:center;margin:8px 0 16px}
.mehero .gicon{width:56px;height:56px;margin-bottom:6px}
.mehero h1{margin:4px 0 8px}
.meform .lbl:first-child{margin-top:0}
.mecard{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.mecard>div{flex:1}.mecard b{display:block}.mecard small{color:var(--muted)}.mecard p{margin:4px 0 0}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dgrid{grid-template-columns:1fr}}
@media (max-width:420px){.kpi b{font-size:24px}.cbar{grid-template-columns:minmax(96px,1fr) 1.4fr 40px;gap:8px;font-size:13px}.emphead{align-items:flex-start}}

.livestate{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;border-radius:12px;margin:0 0 12px;font-weight:700;font-size:13.5px;text-align:start;border:1px solid var(--line)}
.livestate i{width:9px;height:9px;border-radius:50%;flex:none;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 22%,transparent)}
.livestate.adv{background:var(--pill-adv-bg);color:var(--pill-adv-fg)}.livestate.mid{background:var(--pill-mid-bg);color:var(--pill-mid-fg)}.livestate.base{background:var(--pill-base-bg);color:var(--pill-base-fg);cursor:pointer}
a.btn{text-decoration:none}

.linkcard{margin-bottom:12px;border:1.5px solid color-mix(in srgb,var(--t-teal) 50%,transparent)}
.linkcard .keyline code{display:block;word-break:break-all;font-size:12.5px;letter-spacing:0;margin:6px 0 10px}
.brand-mark{background:none!important;border:0!important;overflow:hidden;border-radius:10px}.brand-mark img{width:100%;height:100%;display:block}</style>
</head>

  <div class="topbar-in">
    <div class="brand">
      <span class="brand-mark" id="brandMark"></span>
      <span>سراج<small>تدريب الرقابة والتوطين</small></span>
    </div>
    <div class="top-actions"><button class="themebtn" id="themeBtn" type="button"></button><div class="chip" id="hdrChip"></div></div>
  </div>
</header>

</div></main>

/* ================= أدوات ================= */
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const ar=n=>Number(n).toLocaleString('ar-SA');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=(a,n)=>shuffle(a).slice(0,n);
const fx=t=>{try{navigator.vibrate&&navigator.vibrate(t==='bad'?[25,40,25]:12)}catch(e){}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200);}
const dkey=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const today=()=>dkey(new Date());
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dkey(d);};


/* ================= الوضع الداكن والفاتح ================= */
const mqLight=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;
const curTheme=()=>document.documentElement.getAttribute('data-theme')||(mqLight&&mqLight.matches?'light':'dark');
function paintThemeBtn(){const t=curTheme();const b=$('#themeBtn');
 b.innerHTML=ic(t==='dark'?'sun':'moon');
 const l=t==='dark'?'التبديل إلى الوضع الفاتح':'التبديل إلى الوضع الداكن';b.setAttribute('aria-label',l);b.title=l;
 $('#themeColor').setAttribute('content',t==='dark'?'#0B2838':'#F2F6F7');}
function setTheme(t){const h=document.documentElement;h.classList.add('theme-anim');h.setAttribute('data-theme',t);
 try{localStorage.setItem('mulhem_theme',t)}catch(e){}paintThemeBtn();setTimeout(()=>h.classList.remove('theme-anim'),400);}
$('#themeBtn').onclick=()=>setTheme(curTheme()==='dark'?'light':'dark');
if(mqLight&&mqLight.addEventListener)mqLight.addEventListener('change',paintThemeBtn);
paintThemeBtn();

const KEY='mulhem_v2';
let S={xp:0,games:0,best:{},plays:{},streak:0,last:null,badges:[],dailyDone:null};
try{let d=JSON.parse(localStorage.getItem(KEY));if(!d){const o=JSON.parse(localStorage.getItem('mulhem_v1'))||JSON.parse(localStorage.getItem('shoula_v1'));if(o){d={xp:o.xp||0,games:o.games||0,streak:o.streak||0,last:o.last||null,badges:o.badges||[],dp:o.dp||{}};}}if(d)S=Object.assign(S,d);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const LEVELS=[{n:'مبتدئ',x:0},{n:'متدرب',x:300},{n:'متمكن',x:900},{n:'محترف',x:2000},{n:'خبير',x:4000}];
function lvl(xp){let i=0;LEVELS.forEach((l,k)=>{if(xp>=l.x)i=k});const c=LEVELS[i],n=LEVELS[i+1];return{i,name:c.n,next:n,pct:n?(xp-c.x)/(n.x-c.x):1};}

 {"id": "integ02", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، مجال تطبيق الدليل", "t": "طلب منك صديق يعمل مستشاراً للمنشآت نسخة من \"الدليل الإجرائي لجدول المخالفات والعقوبات\" ليجهّز عملاءه للزيارات.", "o": ["أعتذر؛ فالدليل داخلي لا يُتداول خارج الوزارة، وأوجّهه للأنظمة والقرارات المنشورة", "أرسله له، فكل ما يساعد المنشآت على الالتزام بالنظام يحقق هدف الوزارة في النهاية", "أرسل له الصفحات التي تخص نشاط عملائه فقط، دون بقية الفئات والمخالفات", "لا أرسل الملف، لكن أشرح له مسوغات الضبط وما يتحقق منه المراقب بالتفصيل"], "w": "ينص الدليل على أنه دليل إجرائي داخلي وغير قابل للتداول خارج نطاق الوزارة. ما تحتاجه المنشآت للالتزام موجود في الأنظمة والقرارات المنشورة على موقع الوزارة.", "subs": ["guide_inspect"]},
 {"id": "integ03", "src": "law", "topic": "wages", "ref": "نظام العمل، المادة ٧٣", "t": "وجدت في منشأة أن الغرامات المقتطعة من العمال تُصرف على مصاريف تشغيلية للمنشأة، ولا يوجد سجل خاص بها.", "o": ["مخالفة؛ فالغرامات تُقيَّد في سجل خاص، ولا تُصرف إلا فيما ينفع العمال وبالطريقة النظامية", "لا مخالفة ما دامت الغرامات موقعة وفق لائحة تنظيم العمل المعتمدة ومعلنة للعاملين", "لا مخالفة إذا وافق أغلب العمال على أوجه الصرف في اجتماع موثق ووقّعوا على محضره مع الإدارة", "المخالفة في غياب السجل الخاص فقط، أما أوجه صرف الغرامات فيقررها صاحب العمل"], "w": "المادة ٧٣ تلزم بسجل خاص للغرامات يبيّن اسم العامل وأجره ومقدار الغرامة وسببها وتاريخها، ولا يجوز التصرف فيها إلا فيما يعود بالنفع على عمال المنشأة، من خلال اللجنة العمالية، أو بموافقة الوزارة إذا لم توجد لجنة.", "subs": ["law_discipline"]},
 {"id": "integ04", "src": "law", "topic": "end", "ref": "نظام العمل، المادتان ٦٤ و٨٨", "t": "انتهت علاقة عامل بالمنشأة وطلب شهادة خدمة، فقرر صاحب العمل أن يكتب فيها \"كثير الغياب وغير منضبط\"، وأن يحتفظ بشهاداته الأصلية حتى يسدد سلفة عليه.", "o": ["تُعطى الشهادة دون مقابل وبلا عبارات مسيئة، وتُعاد وثائقه، ويُحسم دَين العمل من مستحقاته", "يحق له تضمين الشهادة تقييماً لسلوك العامل ما دام صحيحاً، ويحتفظ بالوثائق ضماناً لسداد السلفة", "يلتزم بالشهادة دون تقييم، لكن يجوز له حجز الوثائق الأصلية حتى يسدد العامل ما عليه", "شهادة الخدمة تُعطى بمقابل رسوم إدارية يحددها صاحب العمل، ويحتفظ بالوثائق حتى التسوية"], "w": "المادة ٦٤ تلزم صاحب العمل بإعطاء شهادة الخدمة عند الطلب دون مقابل، وتمنع تضمينها ما قد يسيء إلى سمعة العامل أو يقلل فرص العمل أمامه، وتلزمه بإعادة ما أودعه العامل من شهادات أو وثائق. والمادة ٨٨ تجيز له حسم الدين المستحق بسبب العمل من مستحقات العامل.", "subs": ["law_end"]},
 {"id": "integ05", "src": "regs", "topic": "foreign", "ref": "اللائحة التنفيذية، المادة ٦ (تنفيذاً للمادة ٢٠ من النظام)", "t": "صاحب منشأة يقول إنه يحتفظ بجوازات العمال \"برضاهم\" خوفاً من تغيّبهم، ومعه إقرارات موقعة منهم.", "o": ["مخالفة؛ فاللائحة تمنع الاحتفاظ بجواز العامل غير السعودي أو إقامته أو بطاقة تأمينه", "لا مخالفة ما دام الاحتفاظ برضا العامل وبإقرار موقع منه يجيز ذلك صراحة", "يجوز له الاحتفاظ بجواز السفر فقط بإقرار العامل، أما الإقامة وبطاقة التأمين فتبقى مع العامل دائماً", "يجوز الاحتفاظ بالجوازات خلال فترة التجربة فقط، ثم تُعاد للعامل بعد انتهائها"], "w": "المنع في المادة السادسة من اللائحة لا يرتفع بإقرار العامل. والتحقق يكون بالمستندات الداعمة لثبوت الاحتفاظ، وإفادة العامل، وإفادة صاحب المنشأة.", "subs": ["regs_docs", "guide_foreign"]},
 {"id": "integ06", "src": "law", "topic": "foreign", "ref": "نظام العمل، المادة ٤٠", "t": "منشأة تخصم من رواتب عمالها الوافدين رسوم تجديد الإقامة ورخصة العمل، وتقول إن ذلك منصوص عليه في عقودهم.", "o": ["مخالفة؛ فرسوم الإقامة ورخصة العمل وتجديدهما وغرامات تأخيرها على صاحب العمل", "لا مخالفة، فالعقد شريعة المتعاقدين ما دام العامل وقّعه وهو على علم بهذا البند", "صاحب العمل يتحمل رسوم الاستقدام فقط، أما تجديد الإقامة ورخصة العمل فعلى العامل", "يجوز تقاسم الرسوم بين الطرفين مناصفة إذا نص العقد على ذلك واتفقا عليه كتابة"], "w": "المادة ٤٠ تحمّل صاحب العمل رسوم الاستقدام، ورسوم الإقامة ورخصة العمل وتجديدهما وغرامات التأخير، ورسوم تغيير المهنة والخروج والعودة. وجود نص مخالف في العقد لا يغيّر هذا الالتزام.", "subs": ["law_foreign", "guide_foreign"]},
 {"id": "integ07", "src": "law", "topic": "env", "ref": "نظام العمل، المادة ٣", "t": "إعلان وظيفة محاسب في منشأة خاصة يشترط: \"ذكور فقط، أقل من ٣٠ سنة\".", "o": ["مؤشر على تمييز يستوجب التحقق، فالمواطنون متساوون في حق العمل دون تمييز بالجنس أو السن", "لا شأن للرقابة بشروط الإعلان، فالمخالفة تقع فقط إذا ثبت أن متقدماً رُفض فعلاً لهذا السبب بعينه", "مقبول، فصاحب العمل حر في تحديد شروط المرشحين ما دام يوظف سعوديين", "شرط السن مقبول للوظائف المكتبية، والمخالفة في شرط الجنس فقط إن وُجدت شكوى"], "w": "المادة الثالثة تجعل العمل حقاً للمواطن، والمواطنين متساوين فيه دون أي تمييز على أساس الجنس أو الإعاقة أو السن أو أي شكل آخر، سواء أثناء العمل أو عند التوظيف أو الإعلان عنه. والدليل يطلب التحقق من وجود التمييز فعلياً ونوعه قبل الضبط.", "subs": ["law_general"]},
 {"id": "integ08", "src": "guide", "topic": "fake", "ref": "الدليل الإجرائي، مخالفة تسجيل عامل سعودي دون علاقة عمل فعلية", "t": "زميلك ضبط مخالفة توطين وهمي، ولاحظت أن المحضر لا يتضمن إفادة صاحب المنشأة ولا مطابقة العقود مع بيانات التأمينات، والمشرف يستعجل اعتماده.", "o": ["أنبّه زميلي والمشرف إلى استكمال مسوغات الضبط قبل الاعتماد، لأن نقصها يضعف المخالفة", "أعتمده كما هو، فغياب الموظفين عن المقر وحده كافٍ لإثبات التوطين الوهمي", "لا أتدخل، فمركز الاعتماد سيكتشف أي نقص ويعيد المحضر لصاحبه إن لزم", "أكتب الإفادة المتوقعة لصاحب المنشأة من واقع البلاغ والزيارة، حتى يكتمل المحضر ويُعتمد سريعاً"], "w": "من مسوغات ضبط هذه المخالفة في الدليل: مطابقة العقود مع بيانات التأمينات، وإفادة العاملين، وإفادة صاحب العمل. استكمالها مسؤولية مشتركة، وإضافة إفادة لم تُؤخذ فعلاً إخلال بالنزاهة.", "subs": ["guide_fake", "saud_fake"]},
 {"id": "integ09", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الإيضاحات ومسوغات الضبط", "t": "زرت منشأة لديك عنها انطباع سيئ من بلاغات سابقة، ووجدت مؤشراً على مخالفة، وصاحب المنشأة يريد تقديم توضيح.", "o": ["أستمع لإفادته وأوثّقها، وأبني قراري على المسوغات الثابتة لا على الانطباع", "لا داعي لإفادته، فتكرار البلاغات السابقة عن المنشأة قرينة كافية على المخالفة", "أحرر المخالفة فوراً، فله حق الاعتراض لاحقاً أمام مركز الاعتراضات إن كان محقاً", "أتجاهل المؤشر هذه المرة، تجنباً لاتهامي بالتحامل بسبب البلاغات السابقة"], "w": "إفادة صاحب المنشأة أو ممثلها جزء من مسوغات الضبط في معظم مخالفات الدليل، ومركز الاعتماد يأخذها في الاعتبار عند التحقق من ثبوت المخالفة.", "subs": ["guide_inspect"]},
 {"id": "integ10", "src": "law", "topic": "safety", "ref": "نظام العمل، المادة ١٢٤", "t": "في موقع إنشاءات، وفّر صاحب العمل أدوات الوقاية وأثبت تسليمها للعمال، لكن أحدهم يرفض لبس الخوذة.", "o": ["المسؤولية هنا على العامل، فالنظام يلزمه باستعمال وسائل الوقاية وتنفيذ تعليماتها", "المسؤولية على صاحب العمل في كل الأحوال، فهو المسؤول عن أي تقصير يقع في موقعه ولو من العامل", "لا مخالفة على أحد، فارتداء أداة الوقاية شأن شخصي ما دامت متوفرة للعامل", "تسقط المسؤولية عن الطرفين لأن صاحب العمل وفّر الأداة والعامل لم يتضرر بعد"], "w": "المادة ١٢٤ تلزم العامل باستعمال الوسائل الوقائية المخصصة لكل عملية والمحافظة عليها، وتنفيذ التعليمات الموضوعة. والدليل يتضمن مخالفة مستقلة لعدم التزام العامل بالتعليمات الوقائية، مع التحقق مما يثبت استلامه للأدوات.", "subs": ["law_safety"]},
 {"id": "integ11", "src": "regs", "topic": "foreign", "ref": "اللائحة التنفيذية، المادة ١٤ (الفقرة ١٦)؛ الدليل الإجرائي", "t": "منشأة صغيرة استقدمت ١٥ عاملاً خلال ٦ أشهر، ولا يظهر في الموقع إلا ٣ منهم، وصاحب المنشأة يقول إن البقية \"يبحثون عن عمل مناسب لهم\".", "o": ["مؤشر على استخدام التأشيرات لغير الغرض، فلا يجوز الاستقدام دون عمل فعلي لدى صاحب العمل", "لا مخالفة ما دام العمال دخلوا المملكة بتأشيرات نظامية صادرة باسم المنشأة", "لا مخالفة إذا كانوا يعملون مؤقتاً لدى منشآت أخرى بعلم صاحب العمل وموافقته حتى يتوفر لهم عمل", "المخالفة على العمال وحدهم، أما صاحب العمل فلا يُسأل عن عمل لم يمارسوه"], "w": "الفقرة (١٦) من المادة ١٤ من اللائحة تمنع استقدام العامل أو نقل خدماته دون وجود عمل فعلي لدى صاحب العمل. والدليل يتحقق من حركة العاملين في آخر ٦ أشهر، ومن مباشرتهم أعمالاً مناطة بهم داخل المنشأة.", "subs": ["regs_docs", "regs_saud", "guide_foreign"]},
 {"id": "integ12", "src": "law", "topic": "penal", "ref": "نظام العمل، المادتان ٣٠ و٢٢٩ مكرر؛ الدليل الإجرائي، الفئة (ط)", "t": "قريب لك يعرض في حسابه على وسائل التواصل \"استقدام عاملات منزليات بسعر أقل من المكاتب\"، وطلب منك ألا تتدخل لأنه \"يساعد الناس\".", "o": ["أوضح له أن الاستقدام دون ترخيص مخالفة، وأتعامل مع الحالة رسمياً", "أتركه، فمخالفات الاستقدام تخص المكاتب المرخصة فقط ولا تشمل الأفراد الذين يساعدون غيرهم", "أطلب منه حذف الإعلان فقط، فلا داعي لأي إجراء ما دام قريباً لي وتوقف من نفسه", "أنصحه بتقليل إعلاناته ونشرها في مجموعات خاصة حتى لا تلاحظها الرقابة الإلكترونية"], "w": "المادة ٣٠ تمنع أي شخص طبيعي أو اعتباري من ممارسة الاستقدام أو توظيف السعوديين أو الإسناد دون ترخيص، والمادة ٢٢٩ مكرر تجعل غرامتها بين ٢٠٠ ألف و٥٠٠ ألف ريال. النزاهة تعني ألا تؤثر القرابة في الإجراء.", "subs": ["law_employ", "guide_unlicensed", "law_penal"]},
 {"id": "integ13", "src": "law", "topic": "inspect", "ref": "نظام العمل، المادة ٢٠٢", "t": "وصلتك شكوى من عامل عن نقص أجهزة السلامة في منشأته. أثناء الزيارة سألك صاحب المنشأة: \"مين اللي اشتكى؟ أبي أعرف عشان أحل المشكلة معه.\"", "o": ["لا أفصح عن الشكوى، وأتحقق من أجهزة السلامة بنفسي", "أخبره باسم العامل، فهذا يسرّع حل المشكلة بينهما ودياً دون إجراءات", "أخبره أن هناك شكوى دون ذكر الاسم، وأترك له معرفة صاحبها من العمال", "أطلب من العامل الحضور ليشرح المشكلة أمام صاحب المنشأة وأمامي"], "w": "المادة ٢٠٢ تلزم المفتش بأن يحيط بالسرية التامة الشكاوى التي تصله عن نقص الأجهزة أو المخالفات، ولا يجوز له إفشاء وجود الشكوى لصاحب العمل.", "subs": ["law_inspect"]},
 {"id": "integ14", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (و)؛ قواعد ممارسة الاستقدام، المادة ٤١", "t": "زرت مكتب استقدام فوجدت صاحبه مقيماً في مدينة أخرى، ويدير المكتب موظف غير مسجل في التأمينات الاجتماعية. صاحب المكتب صديق لمديرك.", "o": ["أضبط المخالفة كما هي، فوجود صديق لمديري لا يغيّر الإجراء", "أكتفي بتنبيه شفهي احتراماً لعلاقته بمديري، ثم أتابع المكتب في زيارة لاحقة بعد شهر", "لا مخالفة؛ يكفي أن يكون صاحب المكتب سعودياً ومرخصاً ولو أدار المكتب غيره", "أضبط المخالفة على الموظف وحده، لأنه هو من يدير المكتب فعلياً وليس صاحب الترخيص"], "w": "بحسب قواعد ممارسة الاستقدام، يدير صاحب المكتب مكتبه بنفسه، وله أن يعيّن مديراً تتوافر فيه شروط صاحب المكتب نفسها ويسجّله في التأمينات، وتعيين المدير لا يعفيه من المسؤولية.", "subs": ["guide_offices", "regs_recruit"]},
 {"id": "ga24", "src": "guide", "topic": "inspect", "ref": "الملحق الأول من اللائحة التنفيذية، المادة ٥٣؛ الدليل الإجرائي، الفئة (أ)", "t": "وضعت منشأة سياسة للزي، لكنها تعاقب العاملات فقط على المخالفات، وتتجاهل مخالفات العاملين الرجال.", "o": ["أنبّه لتطبيق الضوابط على الجميع", "لا مخالفة؛ للمنشأة أن تطبق السياسة كما تراه", "أطلب إلغاء سياسة الزي كلياً", "أكتفي بتسجيل ملاحظة دون إبلاغ المنشأة"], "w": "يتحقق المراقب من وضع تنظيم لاشتراطات زي العاملين نساءً ورجالاً، وإعلانه وإقرار العاملين بالاطلاع عليه، ومن إيقاع العقوبات على المخالفين لاشتراطات الزي.", "subs": ["guide_env", "regs_conduct"]},
 {"id": "ga33", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، مسوغات الضبط المشتركة", "t": "صاحب منشأة رفض الإدلاء بإفادته وقال: \"اكتب اللي تبيه\". زميلك يقترح كتابة إفادة نيابة عنه \"لتكمل المحضر\".", "o": ["أوثّق رفضه كما هو", "أكتب إفادة مختصرة باسمه حتى يكتمل المحضر", "ألغي المحضر لأن الإفادة ناقصة", "أكتب إفادة على لسان أحد العمال بدلاً منه"], "w": "إفادة صاحب المنشأة أو ممثله من مسوغات الضبط المشتركة في أغلب المخالفات، وتُوثق كما هي. كتابة إفادة لم يدلِ بها تُضعف المحضر وتخالف النزاهة.", "subs": ["guide_inspect"]},
 {"id": "hr03", "src": "guide", "topic": "inspect", "ref": "الدليل الإجرائي، الفئة (هـ)؛ قواعد ممارسة الاستقدام وتقديم الخدمات العمالية، المادة ٤٤", "t": "عرضت شركة استقدام مرخصة على مكتب غير مرخص أن \"يشتغل باسمها\" مقابل نسبة من الأرباح، وقالت إن ذلك \"تعاون بين الشركات\".", "o": ["مخالفة؛ تأجير الترخيص ممنوع", "لا مخالفة؛ ما دامت الشركة المرخصة تتحمل المسؤولية", "لا مخالفة إذا وُثّق الاتفاق بعقد مكتوب", "مخالفة فقط إذا كان المقابل المالي ثابتاً"], "w": "المادة ٤٤: لا يجوز للمرخص له بطريقة مباشرة أو غير مباشرة تأجير الترخيص للغير أو منحه حق الانتفاع به بأي وسيلة، حتى لو كان دون مقابل مادي، ومن ذلك التفويض دون عقود ارتباط.", "subs": ["guide_hrco", "regs_recruit"]},

 {"id": "init03", "src": "law", "topic": "minors", "ref": "نظام العمل، المادة ١٦٢؛ الدليل الإجرائي", "t": "جئت لمنشأة للتحقق من بلاغ عن الأجور، فلاحظت فتى يبدو صغير السن يعمل في المستودع.", "o": ["أتحقق من عمره بالتاريخ الهجري من هويته، ومن طبيعة العمل الذي يؤديه", "أتجاهله، فالزيارة مخصصة لبلاغ الأجور ولا يجوز التوسع خارج غرضها", "أسجل ملاحظة لزيارة قادمة، دون التحقق من عمره أو عمله في هذه الزيارة", "أطلب من صاحب المنشأة إخراجه من المستودع، وأكتفي بذلك دون أي توثيق"], "w": "المادة ١٦٢ تمنع تشغيل من لم يتم ١٥ سنة، إلا ما يأذن به الوزير لمن بين ١٣ و١٥ سنة في أعمال خفيفة بشروط. والدليل يطلب التحقق من عمر الطفل بالتاريخ الهجري من هويته، ومن المهنة التي يمارسها.", "subs": ["law_minors", "guide_women"]},
 {"id": "init04", "src": "guide", "topic": "wages", "ref": "القرار الوزاري ١٢٩٨٦٥ وتاريخ ٢٥ / ٩ / ١٤٤٦هـ؛ الدليل الإجرائي", "t": "لاحظت في بيانات منشأة أن ملف حماية الأجور لم يُرفع منذ شهرين، مع أن عمالها لم يتقدموا بأي شكوى.", "o": ["لا أنتظر شكوى؛ فرفع ملف حماية الأجور التزام شهري قائم بذاته", "لا إجراء ما دامت لا توجد شكوى، فحماية الأجور تُفعَّل عند تضرر العامل فقط", "أنتظر ثلاثة أشهر متتالية دون رفع، ثم أعدّها مخالفة تستوجب الضبط", "أتواصل مع العمال، فإن أكدوا استلام رواتبهم فلا مخالفة رغم عدم الرفع"], "w": "الدليل يتضمن مخالفة عدم التزام صاحب العمل برفع ملف حماية الأجور شهرياً أو عدم الالتزام بنسبة الامتثال المحددة، ويتحقق منها المراقب الإلكتروني من بيانات المنصة دون انتظار شكوى.", "subs": ["guide_wps"]},
 {"id": "init05", "src": "guide", "topic": "train", "ref": "القرار الوزاري ٣٥٦٨ وتاريخ ٧ / ١ / ١٤٤٥هـ؛ الدليل الإجرائي", "t": "منشأة يعمل بها ٧٥ عاملاً، ونحن على أبواب نهاية العام الميلادي.", "o": ["أذكّرها بالإفصاح السنوي عن بيانات التدريب في منصة قوى، فهي ٥٠ عاملاً فأكثر", "لا يلزمها شيء، فالإفصاح عن التدريب اختياري ويُشجَّع عليه دون إلزام", "الإفصاح السنوي مطلوب من المنشآت التي يعمل بها ٥٠٠ عامل فأكثر فقط", "أنتظر حتى تنتهي المهلة دون إفصاح، ثم أضبط المخالفة مباشرة دون تذكير"], "w": "الدليل يتضمن مخالفة عدم الإفصاح عن بيانات التدريب سنوياً، ويتحقق من أن عدد العاملين ٥٠ فأكثر، ومن توثيق بيانات التدريب في منصة قوى من نهاية العام الميلادي.", "subs": ["guide_other"]},
 {"id": "init06", "src": "guide", "topic": "contract", "ref": "قرار توثيق عقود العاملين (٥ / ٥ / ١٤٤٤هـ)؛ الدليل الإجرائي", "t": "خلال زيارة لغرض آخر، تبيّن أن المنشأة توقّع عقوداً ورقية مع عمالها الجدد ولا توثقها إلكترونياً.", "o": ["أوضح لها أن توثيق العقود إلكترونياً التزام بقرار وزاري، وأتحقق من عقودهم", "العقد الورقي الموقّع من الطرفين كافٍ نظاماً، والتوثيق الإلكتروني اختياري", "أؤجل الموضوع، فالعقود الجديدة تُمنح سنة كاملة قبل أن يلزم توثيقها", "لا أتطرق له، فالتوثيق الإلكتروني شأن بين المنشأة والمنصة لا يخص الرقابة"], "w": "الدليل يتضمن مخالفة عدم التزام صاحب العمل بتوثيق عقود العاملين إلكترونياً، استناداً إلى القرار الوزاري الخاص بتوثيق العقود. المبادرة أن تعالج ما تلاحظه ولو لم يكن سبب الزيارة.", "subs": ["guide_other"]},
 {"id": "init07", "src": "law", "topic": "hours", "ref": "نظام العمل، المادة ٩٨", "t": "يقترب شهر رمضان، وأنت تراجع جداول الدوام المعلنة في منشآت قطاع التجزئة.", "o": ["أنبّه المنشآت إلى أن ساعات المسلمين في رمضان لا تزيد على ٦ يومياً أو ٣٦ أسبوعياً", "أنبّه المنشآت إلى أن ساعات العمل الفعلية في رمضان لا تزيد على ٧ ساعات يومياً أو ٤٢ ساعة أسبوعياً", "أنبّه المنشآت إلى أن ساعات رمضان المخفضة تشمل جميع العاملين أياً كانت ديانتهم", "لا حاجة للتنبيه، فساعات العمل في رمضان تخضع لاتفاق المنشأة مع العاملين"], "w": "المادة ٩٨ تخفّض ساعات العمل الفعلية خلال رمضان للمسلمين بحيث لا تزيد على ست ساعات في اليوم، أو ست وثلاثين ساعة في الأسبوع.", "subs": ["law_hours", "guide_hours"]},
 {"id": "init08", "src": "guide", "topic": "fake", "ref": "الدليل الإجرائي، مخالفة تسجيل عامل سعودي دون علاقة عمل فعلية", "t": "تراجع بيانات منشأة صغيرة، فتجد أن عدد السعوديين المسجلين فيها تضاعف فجأة، بينما لم يتغير نشاطها ولا حجمها.", "o": ["أدرجها ضمن أولويات التحقق الميداني من وجود علاقة عمل فعلية", "أعتبر الزيادة تحسناً في التوطين، فبيانات التأمينات تثبت تسجيلهم ورواتبهم", "أحرر مخالفة توطين وهمي مباشرة، فالقفزة المفاجئة في البيانات دليل كافٍ", "أنتظر بلاغاً من أحد الموظفين، فالتحقق دون بلاغ يعدّ تدخلاً غير مبرر"], "w": "من مسوغات ضبط هذه المخالفة في الدليل: التحقق من العمل الفعلي للعاملين، ومن تناسب عددهم مع حجم وطبيعة النشاط، ومقارنة إجمالي العاملين في بيانات الوزارة بالعاملين فعلياً.", "subs": ["guide_fake", "saud_fake"]},
 {"id": "init09", "src": "guide", "topic": "env", "ref": "القرار الوزاري ٢٠٩١٢ وتاريخ ٢ / ٢ / ١٤٤١هـ؛ الدليل الإجرائي", "t": "زرت منشأة كبيرة فلم تجد أي إعلان عن ضوابط الحماية من التعديات السلوكية، مع أنها لم تتلقَّ أي شكوى.", "o": ["أتحقق من إعلانها للضوابط وإقرار العاملين بها، فهو التزام ولو لم تقع شكاوى", "لا شيء مطلوب ما دامت لا توجد شكاوى، فالضوابط تُفعَّل عند وقوع التعدي", "الإعلان مطلوب بعد أول شكوى فقط، ضمن إجراءات التحقيق التي تتخذها اللجنة", "يكفي أن يطلع مدير الموارد البشرية على الضوابط ويطبقها عند الحاجة"], "w": "الدليل يتضمن مخالفة عدم الإعلان عن ضوابط الحماية من التعديات السلوكية بأي وسيلة تكفل علم الخاضعين لها وإقرارهم بالعلم والالتزام، استناداً إلى القرار الوزاري ٢٠٩١٢.", "subs": ["guide_env"]},
 {"id": "init10", "src": "law", "topic": "safety", "ref": "نظام العمل، المادة ١٣٣", "t": "أخبرك عامل أثناء الزيارة أن زميله أصيب في العمل قبل أسبوع، والمنشأة غير خاضعة لفرع الأخطار المهنية في التأمينات.", "o": ["أتحقق من تحمّل صاحب العمل نفقات علاج المصاب كاملة، فهو ملزم بها نظاماً", "العلاج على حساب العامل، لأن المنشأة غير خاضعة لفرع الأخطار المهنية", "يتحمل صاحب العمل نصف نفقات العلاج، ويتحمل العامل الباقي لعدم وجود تأمين", "ليس من نطاق زيارتي، فأنصح العامل برفع دعوى أمام المحكمة العمالية"], "w": "المادة ١٣٣ تلزم صاحب العمل بعلاج العامل المصاب بإصابة عمل أو مرض مهني، وتحمّل جميع النفقات اللازمة لذلك، بما فيها الإقامة في المستشفى والفحوص والتحاليل والأشعة والأجهزة التعويضية ونفقات الانتقال.", "subs": ["law_safety"]},
 {"id": "init11", "src": "regs", "topic": "env", "ref": "اللائحة التنفيذية، المادة ٩ والملحق الثاني؛ الدليل الإجرائي", "t": "زرت منشأة يعمل بها ٨٠ عاملاً، بينهم موظفون من ذوي الإعاقة، لغرض لا علاقة له بهم.", "o": ["أتحقق من الترتيبات التيسيرية لهم، ومن شهادة المواءمة لأنها ٥٠ عاملاً فأكثر", "لا يلزمها شيء ما دام الموظفون مسجلين ويستلمون أجورهم في مواعيدها", "شهادة المواءمة مطلوبة من المنشآت التي يعمل بها ٥٠٠ عامل فأكثر فقط", "أكتفي بالتأكد من وجود مواقف سيارات مخصصة لهم عند مدخل المنشأة"], "w": "الدليل يتضمن مخالفة عدم توفير الخدمات والترتيبات التيسيرية لتمكين الأشخاص ذوي الإعاقة وفق الملحق الثاني والمادة ٩ من اللائحة، ويتحقق من حصول المنشآت الكبيرة والعملاقة (٥٠ عاملاً فأكثر) على شهادة المواءمة.", "subs": ["regs_disab", "guide_disab"]},
 {"id": "init12", "src": "saud", "topic": "saud", "subs": ["saud_pm"], "ref": "الدليل الإجرائي لتوطين مهن إدارة المشاريع (التطبيق في ١٤ فبراير ٢٠٢٧م)", "t": "تعلم أن توطين مهن إدارة المشاريع بنسبة ٧٠٪ سيبدأ تطبيقه في ١٤ فبراير ٢٠٢٧.", "o": ["أبدأ من الآن بحصر المنشآت التي لديها مهن إدارة مشاريع وإبلاغها بالنسبة وموعد التطبيق", "أنتظر حتى ١٤ فبراير ٢٠٢٧ وأبدأ بزيارات الضبط في اليوم نفسه", "أنتظر انتهاء ستة أشهر بعد التطبيق ثم أبدأ التحقق من المنشآت", "لا حاجة لأي توعية، فالقرار منشور على موقع الوزارة لمن يبحث"], "w": "الفترة بين إعلان القرار وتطبيقه هي وقت الحصر والتوعية، حتى تبدأ المنشآت التطبيق وهي مستعدة، وتكون الزيارات بعده للتحقق لا للمفاجأة."},
 {"id": "init13", "src": "saud", "topic": "saud", "ref": "قرار رفع نسب التوطين في أربع مهن صحية (وزارة الموارد البشرية ووزارة الصحة)", "t": "في مارس ٢٠٢٥ اتصل بك صاحب مركز صحي صغير في أبها يسأل: متى يلزمه توطين مهن الأشعة والمختبرات والتغذية والعلاج الطبيعي؟", "o": ["أوضح أنه ضمن المرحلة الثانية (١٧ أكتوبر ٢٠٢٥)، وأدلّه على برامج الدعم ليستعد", "أخبره أن الالتزام يبدأ في ١٧ أبريل ٢٠٢٥ لكل المنشآت الصحية في المملكة دون أي استثناء", "أخبره أن القرار لا يشمل المنشآت الصحية الصغيرة الواقعة خارج المدن الرئيسة الست", "أنتظر بدء التطبيق في منطقته، ثم أزور المركز للتحقق من التزامه وأضبط ما أجده"], "w": "المرحلة الأولى (١٧ أبريل ٢٠٢٥) تخص الرياض ومكة والمدينة وجدة والدمام والخبر، والمنشآت الكبيرة والعملاقة في بقية المناطق. المرحلة الثانية (١٧ أكتوبر ٢٠٢٥) تشمل كل المنشآت. المبادرة أن تساعده على الاستعداد قبل الموعد.", "subs": ["saud_radio", "saud_lab", "saud_nutri", "saud_physio"]},
 {"id": "init14", "src": "law", "topic": "safety", "ref": "نظام العمل، المواد ١٩٠ إلى ١٩٣", "t": "زرت محجراً يعمل فيه ٦٠ عاملاً للتحقق من بلاغ عن تأخر الأجور.", "o": ["أتحقق من الأجور، ثم من سجل قيد العمال ونقطة الإنقاذ وغرفة التمريض", "أتحقق من الأجور فقط، فالزيارة مخصصة للبلاغ ولا يجوز توسيعها لموضوعات أخرى لم يُبلّغ عنها", "أتحقق من الأجور، وأحيل كل ما يخص السلامة في المحجر لجهة أخرى لأنه خارج اختصاص الوزارة", "أؤجل التحقق من الأجور حتى تكتمل زيارة سلامة منفصلة يجدولها فريق آخر"], "w": "للمحاجر والمناجم أحكام خاصة: سجل لقيد العمال قبل دخولهم وعند خروجهم (م١٩٠)، ونقطة إنقاذ مجهزة قريبة (م١٩٢)، وفي كل منجم أو محجر يعمل فيه ٥٠ عاملاً فأكثر مكان مناسب للإنقاذ والإسعاف وغرفة تمريض وغرفة لتغيير الملابس (م١٩٣).", "subs": ["law_mines", "guide_mines"]},
 {"id": "init15", "src": "guide", "topic": "saud", "ref": "الدليل الإجرائي، الفئة (د)؛ دليل توطين عقود التشغيل والصيانة بالجهات العامة (القرار ٧٣٤٨٣)", "t": "تراجع بيانات منشأة تشغيل وصيانة فازت بعقد مع جهة حكومية قبل ٧ أشهر، ولم تجد أي إفصاح عن العقد في خدمة توطين عقود التشغيل والصيانة.", "o": ["أتحقق من العقد وأضبط مخالفة عدم الإفصاح، فمهلة الـ٦ أشهر انتهت", "لا مخالفة بعد؛ الإفصاح عن عقود التشغيل والصيانة مطلوب بعد سنة كاملة من ترسية العقد", "أنتظر حتى نهاية العقد، فالإفصاح عن بياناته يكون عند التسليم النهائي للمشروع", "أراسل الجهة الحكومية المتعاقدة لتفصح هي عن بيانات العقد بدلاً من المنشأة"], "w": "من مخالفات الفئة (د): عدم إفصاح المنشأة عن بيانات عقود التشغيل والصيانة مع الجهات الحكومية بعد مرور ٦ أشهر من ترسية العقد، وعدم تحديثها بشكل نصف سنوي. ويتحقق المراقب من توطين وظائف الإدارة العليا والإشرافية بنسبة ١٠٠٪.", "subs": ["saud_om", "guide_om"]},
 {"id": "ga04", "src": "guide", "topic": "inspect", "ref": "نظام العمل، المادة ١٢٣؛ الدليل الإجرائي، الفئة (أ)", "t": "عامل جديد في مصنع كيماويات بدأ العمل أمس، وأخبرك أنه لا يعرف مخاطر المواد التي يتعامل معها.", "o": ["أتحقق من توعيته بمخاطر مهنته وتدريبه", "أطلب منه أن يسأل زملاءه القدامى عن المخاطر", "لا شيء؛ التعريف بالمخاطر يكون بعد فترة التجربة", "أوصي بنقله لقسم آخر دون إبلاغ صاحب العمل"], "w": "المادة ١٢٣: على صاحب العمل أن يحيط العامل قبل مزاولة العمل بمخاطر مهنته وسبل الوقاية الواجبة، ويلزمه باستعمال وسائل الوقاية. ويتحقق المراقب من التوعية والتدريب ومدى ملاءمة العامل صحياً للمهن الخطرة.", "subs": ["guide_safety", "law_safety"]},
 {"id": "ga10", "src": "guide", "topic": "inspect", "ref": "القرار الوزاري ١٨٦٣٢ (ضوابط العمل الليلي)؛ الدليل الإجرائي، الفئة (أ)", "t": "منشأة بدأت حديثاً نظام نوبات ليلية، ولا يوجد في ملفات العاملين ما يثبت لياقتهم الصحية.", "o": ["أتحقق من لياقتهم الصحية للعمل ليلاً", "أنتظر حتى يمرض أحدهم ثم أتدخل", "لا شيء؛ اللياقة الصحية تخص المهن الخطرة فقط", "أطلب إلغاء النوبات الليلية كلها"], "w": "ضوابط العمل الليلي تستثني غير اللائق صحياً من العمل الليلي، ويتحقق المراقب من الحالة الصحية للعاملين وبياناتهم وعقودهم وساعات عسراج.", "subs": ["guide_night"]},

 {"id": "comm03", "src": "law", "topic": "leave", "ref": "نظام العمل، المادة ١٠٩", "label": "النص النظامي", "t": "\"للعامل الحق في إجازة سنوية لا تقل مدتها عن واحد وعشرين يوماً، تزاد إلى ثلاثين يوماً إذا أمضى خمس سنوات متصلة، ولا يجوز النزول عنها أو تقاضي بدل نقدي عنها أثناء خدمته.\"", "sub": "اشرحها لعامل جديد في جملة واحدة", "o": ["لك إجازة مدفوعة لا تقل عن ٢١ يوماً، وتصير ٣٠ بعد ٥ سنوات متصلة، ولا تُستبدل بمال", "لك ٢١ يوماً كل سنة، وإذا لم تحتجها فلك أن تأخذ بدلها نقداً متى شئت", "لك ٢١ يوماً، وتصير ٣٠ يوماً بعد ٣ سنوات متصلة، ويحق لك استبدالها نقداً متى شئت", "لك ٣٠ يوماً مدفوعة من أول سنة، ولا يجوز تأجيلها إلى السنة التالية"], "w": "الشرح الجيد يحتفظ بالأرقام الثلاثة المهمة (٢١، ٣٠، ٥ سنوات) والقيد الأهم (لا بدل نقدي أثناء الخدمة) بلغة بسيطة.", "subs": ["law_leave"]},
 {"id": "comm04", "src": "law", "topic": "hours", "ref": "نظام العمل، المادة ١٠٧", "label": "سؤال عامل", "t": "\"كيف تُحسب ساعة العمل الإضافي؟\"", "sub": "أجب بدقة وببساطة", "o": ["تأخذ أجر الساعة ومعه ٥٠٪ من أجرك الأساسي عن كل ساعة", "تأخذ ضعف أجر الساعة عن كل ساعة إضافية، أياً كان يوم العمل", "تأخذ أجر الساعة، ومعه ٢٥٪ منه إذا تجاوزت ساعتين في اليوم", "تأخذ أجر الساعة فقط، إلا إذا نص العقد على زيادة محددة"], "w": "المادة ١٠٧ تلزم صاحب العمل بأن يدفع عن ساعات العمل الإضافية أجراً يوازي أجر الساعة مضافاً إليه ٥٠٪ من الأجر الأساسي.", "subs": ["law_hours"]},
 {"id": "comm05", "src": "law", "topic": "end", "ref": "نظام العمل، المادة ٧٥", "label": "سؤال صاحب منشأة", "t": "\"أبي أنهي عقد موظف غير محدد المدة، راتبه شهري، والسبب مشروع. وش المطلوب مني؟\"", "sub": "جملة واحدة واضحة", "o": ["تبلغه كتابياً قبل ٦٠ يوماً على الأقل من تاريخ الإنهاء", "تبلغه قبل ٣٠ يوماً، ويكفي الإبلاغ الشفهي بحضور شاهد", "لا يلزمك إشعار ما دام السبب مشروعاً، لكن تدفع له مكافأته", "تبلغه كتابياً قبل ٣٠ يوماً، مثل مهلة العامل إذا استقال"], "w": "المادة ٧٥: في العقد غير محدد المدة بأجر شهري، إذا كان الإنهاء من صاحب العمل وجب إشعار العامل كتابياً قبل ستين يوماً على الأقل، وإذا كان من العامل فقبل ثلاثين يوماً على الأقل.", "subs": ["law_end"]},
 {"id": "comm06", "src": "law", "topic": "end", "ref": "نظام العمل، المادة ٧٩ مكرر", "label": "سؤال موظفة", "t": "\"عقدي محدد المدة، وقدّمت استقالتي كتابياً قبل ٣٥ يوماً، وما رد علي صاحب العمل. وش وضعي؟\"", "sub": "أجب بدقة ودون مصطلحات معقدة", "o": ["استقالتك تُعد مقبولة، لأنه مضى عليها ٣٠ يوماً دون رد", "استقالتك معلّقة حتى يوافق صاحب العمل عليها صراحة وكتابياً", "استقالتك تحتاج ٦٠ يوماً كاملة قبل أن تُعد مقبولة تلقائياً", "تُعد مرفوضة، لأن عدم الرد خلال ٣٠ يوماً يعني الرفض نظاماً"], "w": "المادة ٧٩ مكرر: يُعد طلب الاستقالة مقبولاً إذا مضى على تقديمه ثلاثون يوماً دون رد من صاحب العمل.", "subs": ["law_end"]},
 {"id": "comm07", "src": "law", "topic": "leave", "ref": "نظام العمل، المادة ١١٧", "label": "سؤال عامل", "t": "\"أنا مريض بتقرير طبي من ٤٠ يوم هالسنة، وش أجري؟\"", "sub": "اشرح له بدقة في جملة", "o": ["الثلاثون الأولى بأجر كامل، والعشرة التالية بثلاثة أرباع الأجر", "الأربعون يوماً كلها بأجر كامل، لأنها أقل من ٦٠ يوماً في السنة", "الثلاثون الأولى بأجر كامل، والأيام العشرة التالية بنصف الأجر", "الثلاثون الأولى بأجر كامل، وما بعدها دون أجر حتى يتعافى"], "w": "المادة ١١٧: إجازة مرضية بأجر كامل عن الثلاثين يوماً الأولى، وبثلاثة أرباع الأجر عن الستين يوماً التالية، ودون أجر للثلاثين يوماً التي تليها خلال السنة الواحدة.", "subs": ["law_leave"]},
 {"id": "comm08", "src": "law", "topic": "minors", "ref": "نظام العمل، المادة ١٦٤", "label": "سؤال ولي أمر", "t": "\"ولدي عمره ١٦ ويبي يشتغل في الصيف، كم ساعة يشتغل في اليوم؟\"", "sub": "أجب بدقة في جملة", "o": ["لا تزيد على ٦ ساعات فعلية، ولا يعمل أكثر من ٤ ساعات متصلة دون راحة", "مثل غيره من العمال: ٨ ساعات يومياً، مع راحة نصف ساعة بعد ٥ ساعات", "٤ ساعات يومياً طوال السنة، وتصير ساعتين في شهر رمضان", "حسب اتفاقه مع صاحب العمل، بشرط موافقة ولي أمره كتابياً"], "w": "المادة ١٦٤: لا يجوز تشغيل الأحداث أكثر من ست ساعات فعلية في اليوم (وأربع في رمضان)، ولا يعمل الحدث أكثر من أربع ساعات متصلة دون فترة راحة لا تقل عن نصف ساعة.", "subs": ["law_minors"]},
 {"id": "comm09", "src": "saud", "topic": "saud", "ref": "قرارا رفع نسبة التوطين في مهن التسويق ومهن المبيعات (اعتباراً من ١٩ أبريل ٢٠٢٦م)", "label": "سؤال صاحب منشأة", "t": "\"عندي شركة فيها ٤ موظفين في مهن التسويق (أخصائي تسويق ومصمم إعلانات). وش المطلوب مني في قرار التوطين؟\"", "sub": "جملة واحدة دقيقة", "o": ["يلزمك ٦٠٪ سعوديين، ولا يُحتسب السعودي إلا بأجر ٥٬٥٠٠ ريال فأكثر", "يلزمك أن يكون ٦٠٪ منهم سعوديين، ويُحتسب السعودي في النسبة بأي أجر", "القرار لا يشملك، فهو يطبق على المنشآت التي فيها ٥ موظفين فأكثر", "يلزمك أن يكون ٣٠٪ منهم سعوديين، بأجر لا يقل عن ٤٬٠٠٠ ريال"], "w": "قرار مهن التسويق: ٦٠٪ على المنشآت التي يعمل بها ٣ عاملين فأكثر في مهن التسويق، ولا يُحتسب السعودي إلا بأجر ٥٬٥٠٠ ريال فأكثر. ولمهن المبيعات قرار مستقل بالنسبة نفسها (٦٠٪).", "subs": ["saud_sales"]},
 {"id": "comm10", "src": "regs", "topic": "env", "ref": "اللائحة التنفيذية، الملحق الأول (ضوابط سلوكيات العمل)، المادة ٥٣؛ القرار الوزاري ٤٩٠٦١", "label": "سؤال صاحب منشأة", "t": "\"وش الشروط اللي لازم أراعيها إذا حطيت سياسة لزي الموظفين؟\"", "sub": "أجب بدقة في جملة أو جملتين", "o": ["زي لا يخالف الشرع، مهني لائق، محتشم غير شفاف، مع إعلان السياسة وإقرار العاملين بها", "لك حرية تحديد الزي كما تشاء، والمهم فقط أن تبلغ الموظفين به شفهياً عند التعيين", "يلزمك زي رسمي موحد بلون محدد لكل المنشآت، تعتمده الوزارة قبل تطبيقه", "لا يجوز لك وضع أي سياسة للزي، فاختيار اللباس حق شخصي للموظف وحده"], "w": "المادة ٥٣ من الملحق الأول باللائحة تشترط ألا يتعارض الزي مع الأحكام الشرعية، وأن يكون بمظهر مهني لائق يتناسب مع مهام العامل، وأن يكون محتشماً وغير شفاف. والدليل يتحقق أيضاً من إعلان الاشتراطات وإقرار العاملين بالعلم بها.", "subs": ["regs_conduct", "guide_env"]},
