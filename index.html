 top.querySelector('button').onclick=()=>{stopT();s.wk?home():games();};
 const prog=el('div','prog');for(let k=0;k<s.total;k++)prog.append(el('i'));
 const tw=el('div','timer',`<span class="tpill">${ic('clock')}<span class="secs"></span><small>ث</small></span><div class="track"><div class="bar"></div></div>`);tw.style.visibility='hidden';
 const body=el('div','');
 wrap.append(top,prog,tw,body);
 return{body,
  prog:i=>[...prog.children].forEach((d,k)=>d.className=k<i?'done':k===i?'now':''),
  score:v=>{top.querySelector('.score b').textContent=ar(Math.round(v));},
  timer:(sec,end)=>timer(sec,tw,end)};}
function timer(sec,wrap,end){stopT();wrap.style.visibility='visible';const bar=wrap.querySelector('.bar'),tx=wrap.querySelector('.secs');const t0=Date.now();let left=sec;
 const tick=()=>{left=Math.max(0,sec-(Date.now()-t0)/1000);bar.style.transform=`scaleX(${left/sec})`;wrap.classList.toggle('low',left/sec<.25);tx.textContent=ar(Math.ceil(left));if(left<=0){stopT();end();}};
 tick();T=setInterval(tick,200);return()=>left;}
function nextBtn(last,fn){const b=el('button','btn primary block',last?'عرض النتيجة':'التالي');b.onclick=fn;return b;}
function scrollTo(e){setTimeout(()=>{try{e.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(x){}},60);}
const refLine=it=>it.ref?`<p class="ref">${ic('book')}<span><b>المرجع:</b> ${esc(it.ref)}</span></p>`:'';
const qHead=it=>`<div class="qmeta">${it.label?`<span class="tag">${esc(it.label)}</span>`:''}${srcChip(it.src)}${subLabel(it)?`<span class="tag">${subLabel(it)}</span>`:''}</div>`;

/* ===== محرك: اختيار من متعدد ===== */
function runMCQ(g,wk){const items=pickItems(g,wk?g.wn:g.n);const s=newSess(g,items.length,wk);const time=gTime(g);let i=0;const sh=shell(g,s);
 function q(){if(i>=items.length)return finish(s);const it=items[i];sh.prog(i);sh.body.innerHTML='';
  sh.body.append(el('div','qcard',`${qHead(it)}<p class="qtext">${esc(it.t)}</p>${it.sub?`<p class="constraint">${ic('lock')}<span>${esc(it.sub)}</span></p>`:''}`));
  sh.body.append(el('p','ask',g.prompt));
  const opts=shuffle(it.o.map((t,k)=>({t,ok:k===0})));const list=el('div','opts');let answered=false;
  opts.forEach((o,k)=>{const b=el('button','opt');b.textContent=o.t;b.style.animationDelay=(k*60)+'ms';o.b=b;b.onclick=()=>answer(o);list.append(b);});
  sh.body.append(list);
  const left=sh.timer(time,()=>answer(null));
  function answer(o){if(answered)return;answered=true;stopT();const rem=left();const good=!!(o&&o.ok);
   s.res.push({k:it._k,ok:good,p:good?70+30*rem/time:0,tf:1-rem/time,timed:1});
   opts.forEach(x=>{x.b.disabled=true;if(x.ok)x.b.classList.add('ok');});
   if(good){s.score+=100+Math.ceil(rem)*3;s.correct++;fx('ok');}else{if(o)o.b.classList.add('bad');fx('bad');}
   sh.score(s.score);
   const fb=el('div','feedback '+(good?'good':'miss'),`<strong>${good?'إجابة صحيحة':(o?'ليست الإجابة الصحيحة':'انتهى الوقت')}</strong><p>${esc(it.w)}</p>${refLine(it)}`);
   fb.append(nextBtn(i===items.length-1,()=>{i++;q();}));sh.body.append(fb);scrollTo(fb);}
 }
 q();}

/* ===== محرك: الترتيب ===== */
function runOrder(g,wk){const items=pickItems(g,wk?g.wn:g.n);const s=newSess(g,items.length,wk);const time=gTime(g);let i=0;const sh=shell(g,s);
 function q(){if(i>=items.length)return finish(s);const it=items[i];sh.prog(i);sh.body.innerHTML='';
  sh.body.append(el('div','qcard',`${qHead(it)}<p class="qtext">${esc(it.t)}</p>`));
  sh.body.append(el('p','ask','اضغط على أول ٣ خطوات بالترتيب: ١ ثم ٢ ثم ٣. اضغط مرة ثانية للإلغاء.'));
  const opts=shuffle(it.o.map((t,k)=>({t,k})));const chosen=[];let done=false;const list=el('div','opts');
  const confirm=el('button','btn primary block','اعتمد الترتيب');confirm.disabled=true;
  opts.forEach((o,k)=>{const b=el('button','opt order','<span class="num"></span><span class="t"></span>');b.querySelector('.t').textContent=o.t;b.style.animationDelay=(k*60)+'ms';o.b=b;
   b.onclick=()=>{if(done)return;const p=chosen.indexOf(o);if(p>-1)chosen.splice(p,1);else if(chosen.length<3)chosen.push(o);paint();fx('ok');};list.append(b);});
  function paint(){opts.forEach(o=>{const p=chosen.indexOf(o);o.b.classList.toggle('sel',p>-1);o.b.querySelector('.num').textContent=p>-1?ar(p+1):'';});confirm.disabled=chosen.length<3;}
  sh.body.append(list,confirm);
  const left=sh.timer(time,submit);confirm.onclick=submit;
  function submit(){if(done)return;done=true;stopT();const rem=left();let exact=0,part=0;
   chosen.forEach((o,p)=>{if(o.k===p)exact++;else if(o.k<3)part++;});
   const full=chosen.length===3;
   s.res.push({k:it._k,ok:exact===3,p:(exact*30+part*10)/90*85+(full?15*rem/time:0),tf:1-rem/time,timed:1});
   s.score+=exact*40+part*15+(full?Math.ceil(rem):0);if(exact===3)s.correct++;sh.score(s.score);fx(exact===3?'ok':'bad');
   opts.forEach(o=>{o.b.disabled=true;o.b.classList.remove('sel');const n=o.b.querySelector('.num');
    if(o.k<3){o.b.classList.add('ok');n.textContent=ar(o.k+1);}else if(chosen.includes(o)){o.b.classList.add('bad');n.textContent='✕';}else n.textContent='';});
   confirm.remove();
   const head=!full?'انتهى الوقت قبل اكتمال الترتيب':exact===3?'ترتيب صحيح':`${ar(exact)} من ٣ في مكانها الصحيح`;
   const fb=el('div','feedback '+(exact===3?'good':'miss'),`<strong>${head}</strong><p>${esc(it.w)}</p>${refLine(it)}`);
   fb.append(nextBtn(i===items.length-1,()=>{i++;q();}));sh.body.append(fb);scrollTo(fb);}
 }
 q();}

/* ===== محرك: دقة الملاحظة ===== */
function runSpot(g,wk){const items=pickItems(g,wk?g.wn:g.n);const s=newSess(g,items.length,wk);const time=gTime(g);let i=0;const sh=shell(g,s);
 function q(){if(i>=items.length)return finish(s);const it=items[i];sh.prog(i);sh.body.innerHTML='';let done=false;
  const need=it.l.filter(x=>x.e).length;
  sh.body.append(el('div','qmeta solo',srcChip(it.src)+(subLabel(it)?`<span class="tag">${subLabel(it)}</span>`:'')));
  sh.body.append(el('p','ask',`في هذا المستند ${ar(need)} أخطاء نظامية. اضغط على الأسطر الخاطئة ثم اضغط زر التحقق.`));
  const doc=el('div','doc');doc.append(el('div','doc-h',`${ic('file')}<b>${esc(it.title)}</b>`));
  const lines=it.l.map(x=>{const b=el('button','line');b.textContent=x.t;b.onclick=()=>{if(done)return;b.classList.toggle('sel');count();fx('ok');};doc.append(b);return{x,b};});
  const cnt=el('p','counter');
  function count(){cnt.textContent=`اخترت ${ar(lines.filter(l=>l.b.classList.contains('sel')).length)} من ${ar(need)}`;}
  count();
  const btn=el('button','btn primary block','تحقّق');
  sh.body.append(doc,cnt,btn);
  const left=sh.timer(time,submit);btn.onclick=submit;
  function submit(){if(done)return;done=true;stopT();const rem=left();let hit=0,wrong=0;
   lines.forEach(({x,b})=>{const sel=b.classList.contains('sel');b.disabled=true;b.classList.remove('sel');
    if(x.e&&sel){hit++;b.classList.add('ok');}else if(x.e)b.classList.add('miss');else if(sel){wrong++;b.classList.add('bad');}
    if(x.e){const w=el('span','why');w.textContent=x.e;b.append(w);}});
   const ok=hit===need&&!wrong;
   s.res.push({k:it._k,ok,p:Math.max(0,hit/need*85-wrong*12)+(hit?15*rem/time:0),tf:1-rem/time,timed:1});
   s.score+=Math.max(0,hit*60-wrong*20+(hit?Math.ceil(rem):0));if(ok)s.correct++;sh.score(s.score);fx(hit===need?'ok':'bad');
   btn.remove();cnt.remove();
   const head=`اكتشفت ${ar(hit)} من ${ar(need)}`+(wrong?`، و${ar(wrong)} اختيار لسطر سليم`:'');
   const fb=el('div','feedback '+(ok?'good':'miss'),`<strong>${head}</strong><p>${esc(it.w)}</p>${refLine(it)}`);
   fb.append(nextBtn(i===items.length-1,()=>{i++;q();}));sh.body.append(fb);scrollTo(fb);}
 }
 q();}

/* ===== محرك: المرونة (سؤال، ثم معلومة جديدة) ===== */
function runTwist(g,wk){const items=pickItems(g,wk?g.wn:g.n);const s=newSess(g,items.length,wk);const time=gTime(g);let i=0;const sh=shell(g,s);
 function q(){if(i>=items.length)return finish(s);const it=items[i];sh.prog(i);sh.body.innerHTML='';const st={};
  sh.body.append(el('div','qcard',`${qHead(it)}<p class="qtext">${esc(it.t)}</p>`));
  stage(1);
  function stage(n){const qs=n===1?it.q1:it.q2,os=n===1?it.o1:it.o2,ws=n===1?it.w1:it.w2;
   const box=el('div','stagebox');
   if(n===2)box.append(el('div','twist',`<span class="tag">${ic('info')} معلومة جديدة</span><p>${esc(it.tw)}</p>`));
   box.append(el('p','ask',`${n===1?'السؤال الأول':'السؤال الثاني'}: ${esc(qs)}`));
   const opts=shuffle(os.map((t,k)=>({t,ok:k===0})));const list=el('div','opts');let answered=false;
   opts.forEach((o,k)=>{const b=el('button','opt');b.textContent=o.t;b.style.animationDelay=(k*60)+'ms';o.b=b;b.onclick=()=>answer(o);list.append(b);});
   box.append(list);sh.body.append(box);if(n===2)scrollTo(box);
   const left=sh.timer(time,()=>answer(null));
   function answer(o){if(answered)return;answered=true;stopT();const rem=left();const good=!!(o&&o.ok);
    st[n]={good,rem};opts.forEach(x=>{x.b.disabled=true;if(x.ok)x.b.classList.add('ok');});
    if(good){s.score+=80+Math.ceil(rem)*2;fx('ok');}else{if(o)o.b.classList.add('bad');fx('bad');}
    sh.score(s.score);
    const fb=el('div','feedback '+(good?'good':'miss')+(n===1?' mini':''),`<strong>${good?'صحيح':(o?'ليست الإجابة الصحيحة':'انتهى الوقت')}</strong><p>${esc(ws)}</p>${n===2?refLine(it):''}`);
    if(n===1){const nb=el('button','btn primary block',ic('info')+' ظهرت معلومة جديدة');nb.onclick=()=>{nb.remove();stage(2);};fb.append(nb);}
    else{const p1=st[1].good?70+30*st[1].rem/time:0,p2=good?70+30*rem/time:0;const both=st[1].good&&good;if(both)s.correct++;
     s.res.push({k:it._k,ok:both,p:(p1+p2)/2,tf:1-(st[1].rem+rem)/(2*time),timed:1});
     fb.append(nextBtn(i===items.length-1,()=>{i++;q();}));}
    box.append(fb);scrollTo(fb);}
  }
 }
 q();}

/* ================= النتيجة وتحديث المهارات ================= */
const BADGES=[
 {id:'first',n:'البداية',d:'أكملت أول تمرين',ic:'check'},
 {id:'perfect',n:'دقة كاملة',d:'كل الإجابات صحيحة في تمرين',ic:'target'},
 {id:'workout',n:'يوم مكتمل',d:'أنهيت تمرين يوم كامل',ic:'dumbbell'},
 {id:'streak',n:'مواظب',d:'٣ أيام تمرين متتالية',ic:'zap'},
 {id:'week',n:'أسبوع متواصل',d:'٧ أيام تمرين متتالية',ic:'trend'},
 {id:'all',n:'شامل',d:'قِست الكفاءات الثماني',ic:'grid'}
];
function checkBadges(s,dayDone){const got=[];const add=id=>{if(!S.badges.includes(id)){S.badges.push(id);got.push(id);}};
 add('first');if(s.total&&s.correct===s.total)add('perfect');if(dayDone)add('workout');if(streakNow()>=3)add('streak');if(streakNow()>=7)add('week');if(GAMES.every(g=>skOf(g.id)))add('all');return got;}
function badgeEl(b,on){return el('div','badge'+(on?' on':''),`<div class="bi">${ic(b.ic)}</div><b>${b.n}</b><small>${b.d}</small>`);}
function recordSkill(g,s){const t=today();
 const p=s.res.length?Math.round(s.res.reduce((a,r)=>a+r.p,0)/s.res.length):0;
 s.res.forEach(r=>{if(!r.k)return;const it=S.items[r.k]||{seen:0};it.seen++;it.last=t;it.miss=!r.ok;S.items[r.k]=it;});
 const k=S.sk[g.id]||{r:0,n:0,hist:[],acc:null,tf:null};const before=k.n?k.r:null;
 k.r=k.n?Math.round(k.r*.6+p*.4):p;k.n++;k.last=t;k.hist.push({d:t,p});if(k.hist.length>30)k.hist.shift();
 const timed=s.res.filter(r=>r.timed);
 if(timed.length){const acc=timed.filter(r=>r.ok).length/timed.length,tf=timed.reduce((a,r)=>a+r.tf,0)/timed.length;k.acc=k.acc==null?acc:k.acc*.6+acc*.4;k.tf=k.tf==null?tf:k.tf*.6+tf*.4;}
 S.sk[g.id]=k;const dp=S.dp[t]||{s:0,n:0};dp.s+=p;dp.n++;S.dp[t]=dp;
 subStats(s.res);reportSoon();
 return{p,before,after:k.r};}
function finish(s){stopT();const g=s.g,t=today();
 const R=recordSkill(g,s);
 let xp=Math.round(s.score/10);let dayDone=false;
 if(s.wk){const d=todayPlan();d.done[g.id]=R.p;
  if(!d.complete&&d.plan.every(id=>d.done[id]!=null)){d.complete=true;dayDone=true;xp+=50;if(S.last!==t){S.streak=S.last===yesterday()?S.streak+1:1;S.last=t;}}}
 const before=lvl(S.xp).i;
 S.xp+=xp;S.games++;S.plays[g.id]=(S.plays[g.id]||0)+1;
 const prev=S.best[g.id]||0;const newBest=s.score>prev&&s.score>0;if(newBest)S.best[g.id]=Math.round(s.score);
 const nb=checkBadges(s,dayDone);save();header();
 const after=lvl(S.xp);
 const m=view();const w=el('div','narrow result');m.append(w);
 const C=2*Math.PI*70;
 w.append(el('p','eyebrow',g.name));
 const ring=el('div','ring',`<svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="70" style="stroke:var(--track)" stroke-width="12" fill="none"/><circle class="arc" cx="80" cy="80" r="70" stroke="url(#rg)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.1s ease"/><defs><linearGradient id="rg"><stop offset="0" stop-color="#3DB672"/><stop offset=".5" stop-color="#F7C443"/><stop offset="1" stop-color="#F2922A"/></linearGradient></defs></svg><div class="val"><b>٠</b><small>٪ أداء</small></div>`);
 w.append(ring);
 const msg=R.p>=80?'أداء قوي ودقيق.':R.p>=55?'أداء جيد، وفيه مساحة للتحسن.':'التمرين أدّى مهمته: كشف لك أين تحتاج تركيزاً.';

 const W=340,H=150,L=10,R=34,Tp=12,B=26,iw=W-L-R,ih=H-Tp-B;
 const x=i=>W-R-(i/13)*iw;

 let svg=`<svg viewBox="0 0 ${W} ${H}" class="tchart" role="img" aria-label="متوسط الأداء اليومي لآخر ١٤ يوماً">`;
 [0,50,100].forEach(v=>{svg+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${W-R+6}" y="${y(v)+4}" class="ax" text-anchor="end">${ar(v)}</text>`;});
 [[13,'end'],[6,'middle'],[0,'start']].forEach(([i,a])=>{svg+=`<text x="${x(i)}" y="${H-6}" class="ax" text-anchor="${a}">${fmt(days[i].dk)}</text>`;});
 svg+=`<path d="${path}" class="ln"/>`;
 days.forEach((d,i)=>{if(d.v!=null)svg+=`<circle cx="${x(i)}" cy="${y(d.v)}" r="4" class="pt"/>`;});
 days.forEach((d,i)=>{svg+=`<rect x="${x(i)-iw/26}" y="${Tp}" width="${iw/13}" height="${ih}" class="hit" data-i="${i}"/>`;});
 svg+=`<line class="cross" x1="0" x2="0" y1="${Tp}" y2="${Tp+ih}" style="display:none"/></svg>`;

 const cross=wrap.querySelector('.cross');
 const show=i=>{const d=days[i];ro.innerHTML=`<b>${fmt(d.dk)}</b>: ${d.v==null?'لا تمرين':`${ar(d.v)}٪ متوسط الأداء`}${d.done?'، تمرين اليوم مكتمل':''}`;cross.setAttribute('x1',x(i));cross.setAttribute('x2',x(i));cross.style.display='';};

 wrap.querySelectorAll('.hit').forEach(r=>{r.addEventListener('pointerenter',()=>show(+r.dataset.i));r.addEventListener('click',()=>show(+r.dataset.i));});
 wrap.querySelector('svg').addEventListener('pointerleave',reset);reset();

const GH_KEY='siraj_github';
function ghGuess(){const h=location.hostname,m=h.match(/^([^.]+)\.github\.io$/i);if(!m)return{};const seg=location.pathname.split('/').filter(Boolean)[0];
 return{owner:m[1],repo:seg&&!/\.html?$/i.test(seg)?seg:h};}
function ghConf(){let c={};try{c=JSON.parse(localStorage.getItem(GH_KEY))||{};}catch(e){}const g=ghGuess();
 return Object.assign({owner:g.owner||'',repo:g.repo||'',branch:'main',path:REMOTE_PATH,token:''},c);}
const ghReady=()=>{const c=ghConf();return !!(c.owner&&c.repo&&c.token);};
function ghSave(c){try{localStorage.setItem(GH_KEY,JSON.stringify(c));}catch(e){}}
const b64=str=>{const bytes=new TextEncoder().encode(str);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin);};
const unb64=str=>new TextDecoder().decode(Uint8Array.from(atob(str.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function ghApi(c,path,opt={}){return fetch('https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+path,Object.assign({},opt,{headers:Object.assign({'Accept':'application/vnd.github+json','Authorization':'Bearer '+c.token,'X-GitHub-Api-Version':'2022-11-28'},opt.body?{'Content-Type':'application/json'}:{})}));}
function ghErr(st){return st===401?'رمز GitHub غير صحيح أو انتهت صلاحيته. أنشئ رمزاً جديداً من إعدادات GitHub.':st===403?'الرمز لا يملك صلاحية الكتابة على هذا المستودع. تأكد من صلاحية Contents: Read and write.':st===404?'لم أجد المستودع أو الفرع. تأكد من الاسم، ومن أن الرمز يشمل هذا المستودع.':st===409?'تعارض مع تحديث آخر. أعد المحاولة بعد لحظات.':st===422?'GitHub رفض الطلب. تأكد من اسم الفرع.':'تعذّر الاتصال بـ GitHub. تأكد من الإنترنت وحاول مرة أخرى.';}
function ghTest(c){return ghApi(c,'').then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>{if(!(j.permissions&&j.permissions.push))return Promise.reject(403);return j;});}
function ghReadCfg(c){return ghApi(c,'/contents/'+c.path.split('/').map(encodeURIComponent).join('/')+'?ref='+encodeURIComponent(c.branch)).then(r=>{if(r.status===404)return{sha:null,cfg:null};if(!r.ok)return Promise.reject(r.status);return r.json().then(j=>{let cfg=null;try{cfg=JSON.parse(unb64(j.content||''));}catch(e){}return{sha:j.sha,cfg};});});}
function ghWriteCfg(c,cfg,sha,msg){return ghApi(c,'/contents/'+c.path.split('/').map(encodeURIComponent).join('/'),{method:'PUT',body:JSON.stringify(Object.assign({message:msg,content:b64(JSON.stringify(cfg,null,1)+'\n'),branch:c.branch},sha?{sha}:{}))}).then(r=>r.ok?r.json():Promise.reject(r.status));}
function publishedCfg(){const out=Object.assign({},CFG);delete out._draft;out.v=1;out.stamp=Date.now().toString(36);out.publishedAt=new Date().toISOString();return out;}

 return names.map((n,i)=>{const R=x=>hash(n+'|'+x);const base=30+R('b')*55;const sk={};
  COMP.forEach(c=>{if(R('m'+c)<.12&&i%3)return;const v=Math.max(8,Math.min(98,Math.round(base+(R(c)-.5)*50)));sk[c]=[v,1+Math.floor(R('n'+c)*12),addDays(t,-Math.floor(R('l'+c)*9))];});
  const st={};for(let j=0;j<22;j++){const k=subKeys[Math.floor(R('s'+j)*subKeys.length)];const tries=2+Math.floor(R('t'+j)*9);const hard=/مكافأة|الأجور|التوطين|نسب|ساعات/.test(SUBS[k].n)?.25:0;st[k]=[tries,Math.round(tries*Math.max(0,Math.min(1,base/100+(R('o'+j)-.5)*.5-hard)))];}

  const last=Object.keys(dp).sort().pop()||addDays(t,-gap);

function gsCode(key){return `// سراج: التحديث الفوري لإعدادات المشرف + ملخص تقدّم الموظفين
// لا تشارك هذا الكود: فيه رمز اللوحة الخاص بك
const ADMIN_KEY = '${key}';
const SHEET = 'الموظفون';
const CFG_SHEET = 'الإعدادات';
const HEAD = ['المعرّف','الاسم','الإدارة','الرقم الوظيفي','آخر تحديث','آخر تدريب','النقاط','متوسط الكفاءات','البيانات'];

function doPost(e) {
  try {
    const raw = (e.postData && e.postData.contents) || '';
    const d = JSON.parse(raw);
    if (d.t === 'config') {                       // المشرف يحفظ تغييراً
      if (d.key !== ADMIN_KEY) return out({ok: false, err: 'key'});
      if (!d.cfg || typeof d.cfg.stamp !== 'string') return out({ok: false});
      writeCfg_(JSON.stringify(d.cfg));
      return out({ok: true, stamp: d.cfg.stamp});
    }
    if (raw.length > 45000 || d.t !== 'report' || !d.id || !d.name) return out({ok: false});
    const v = Object.keys(d.sk || {}).map(function (k) { return d.sk[k][0]; });
    const avg = v.length ? Math.round(v.reduce(function (a, b) { return a + b; }, 0) / v.length) : '';
    const row = [String(d.id).slice(0, 40), String(d.name).slice(0, 60), String(d.dept || '').slice(0, 60),
      String(d.emp || '').slice(0, 20), new Date(), d.last || '', d.xp || 0, avg, raw];
    const lock = LockService.getScriptLock();
    lock.waitLock(20000);
    try {
      const sh = sheet_(), n = sh.getLastRow() - 1;
      const ids = n > 0 ? sh.getRange(2, 1, n, 1).getValues().map(function (r) { return r[0]; }) : [];
      const i = ids.indexOf(row[0]);
      sh.getRange(i < 0 ? sh.getLastRow() + 1 : i + 2, 1, 1, row.length).setValues([row]);
    } finally { lock.releaseLock(); }
    return out({ok: true});
  } catch (err) { return out({ok: false}); }
}

function doGet(e) {
  const p = (e && e.parameter) || {};
  if (p.t === 'config') return out({ok: true, cfg: readCfg_()});   // كل موظف يقرأ آخر الإعدادات
  if (p.key !== ADMIN_KEY) return out({ok: false, err: 'key'});
  if (p.t === 'ping') return out({ok: true, ping: true, v: 2});
  const sh = sheet_(), n = sh.getLastRow() - 1;
  const rows = n > 0 ? sh.getRange(2, 9, n, 1).getValues().map(function (r) {
    try { return JSON.parse(r[0]); } catch (x) { return null; }
  }).filter(Boolean) : [];
  return out({ok: true, rows: rows});
}

function readCfg_() {
  const cache = CacheService.getScriptCache(), hit = cache.get('cfg');
  if (hit) return JSON.parse(hit);
  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(CFG_SHEET);
  if (!sh || !sh.getLastRow()) return null;
  const s = sh.getRange(1, 1, sh.getLastRow(), 1).getValues().map(function (r) { return String(r[0]).slice(1); }).join('');
  if (!s) return null;
  if (s.length < 90000) cache.put('cfg', s, 21600);
  return JSON.parse(s);
}

function writeCfg_(s) {
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    const sh = ss.getSheetByName(CFG_SHEET) || ss.insertSheet(CFG_SHEET);
    const parts = [];
    for (let i = 0; i < s.length; i += 40000) parts.push(['x' + s.slice(i, i + 40000)]);
    sh.clear();
    sh.getRange(1, 1, parts.length, 1).setValues(parts);
    const cache = CacheService.getScriptCache();
    cache.remove('cfg');
    if (s.length < 90000) cache.put('cfg', s, 21600);
  } finally { lock.releaseLock(); }
}

function sheet_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName(SHEET);
  if (!sh) { sh = ss.insertSheet(SHEET); sh.appendRow(HEAD); sh.setFrozenRows(1); sh.setRightToLeft(true); }
  return sh;
}

function out(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}
